<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b56">
<title>中1 定期テスト学習アプリ</title>
<style>
:root{--navy:#173b56;--blue:#236b91;--bg:#f2f6f8;--ink:#20313d;--muted:#657783;--line:#d9e3e8;--green:#18794e;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic UI",Meiryo,sans-serif}
header{background:var(--navy);color:#fff;padding:20px 16px}header>div,main{max-width:980px;margin:auto}h1{font-size:clamp(22px,4vw,31px);margin:4px 0}header p{margin:0;color:#d7e5ec;font-size:14px}
main{padding:20px 14px 44px}.crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
h2{font-size:21px;margin:0 0 6px}.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card,.action{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;color:var(--ink)}
.card:hover,.action:hover{border-color:#8fb5c8}.emoji{font-size:27px}.card h3{margin:7px 0 4px;font-size:17px}.card p,.action span{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.action strong{display:block;margin-bottom:5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
button:focus-visible{outline:3px solid #82c5e8;outline-offset:2px}
.primary,.secondary{border-radius:10px;padding:10px 15px;font-size:14px;cursor:pointer}
.primary{background:var(--blue);border:0;color:white}.primary:disabled{opacity:.45}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}
.hidden{display:none!important}.notice{background:#eef5f8;border-left:4px solid var(--blue);padding:11px 13px;border-radius:8px;font-size:13px;line-height:1.6}
.progress{height:8px;background:#e6edf1;border-radius:99px;overflow:hidden;margin:12px 0 17px}.progress>div{height:100%;background:var(--blue);width:0}
.qmeta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.question{font-size:18px;line-height:1.75;margin:16px 0}
.option{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0;cursor:pointer;line-height:1.55}
.option input{margin-top:4px;accent-color:var(--blue)}.option:has(input:checked){border-color:var(--blue);background:#f1f7fa}
.feedback{padding:13px;border-radius:10px;margin-top:13px;line-height:1.7;font-size:14px}.correct{background:#eaf6ef;border:1px solid #b8dfc7;color:#155c3b}.incorrect{background:#fff0ef;border:1px solid #f0c1bd;color:#8c211a}
.explanation{color:var(--ink);margin-top:7px}.score{font-size:28px;font-weight:700;margin:8px 0}.keypoint{padding:12px;background:#f7fafb;border:1px solid var(--line);border-radius:10px;margin:8px 0;line-height:1.7}
input[type=text]{font:inherit;padding:11px;border:1px solid #aebfc8;border-radius:9px;width:100%;max-width:520px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 15px 25px}
@media(max-width:520px){header{padding:17px 14px}.panel{padding:14px}.question{font-size:17px}}
</style>
</head>

<header><div><div style="font-size:12px;letter-spacing:.12em;opacity:.8">STUDY SUPPORT</div><h1>中1 定期テスト学習アプリ</h1><p>理科・地理・国語｜追加範囲対応 v0.7</p></div></header>
<main>
<div class="crumb" id="crumb">ホーム</div>
<section id="home">
<h2>教科を選ぶ</h2><p class="lead">学習したい教科を選択してください。学習記録と間違えた問題は、この端末のブラウザーに保存されます。</p>
<div class="grid">
<button class="card" onclick="chooseSubject('science')"><div class="emoji">🧪</div><h3>理科</h3><p>物質のすがたとその変化／光の性質・凸レンズ</p></button>
<button class="card" onclick="chooseSubject('geography')"><div class="emoji">🌍</div><h3>地理</h3><p>ヨーロッパ州／アフリカ州／北アメリカ州</p></button>
<button class="card" onclick="chooseSubject('japanese')"><div class="emoji">📚</div><h3>国語</h3><p>説明文・詩・古典・物語・文法</p></button>
</div>
<div class="panel"><h2>学習状況</h2><div id="homeStats" class="lead"></div><div class="toolbar"><button class="secondary" onclick="showWrong()">間違えた問題をまとめて復習</button><button class="secondary" onclick="resetProgress()">この端末の記録を消去</button></div></div>
<div class="notice">この版はオフラインでも使える単体HTMLです。学習記録は現在開いている端末・ブラウザー内に保存され、別端末との自動同期はまだありません。</div>
</section>
<section id="subject" class="hidden"><h2 id="subjectTitle"></h2><p class="lead">学習方法を選択してください。</p>
<div class="actions">
<button class="action" onclick="chooseMode('learn')"><strong>📖 ① 覚える</strong><span>単元の要点・重要語句を確認</span></button>
<button class="action" onclick="chooseMode('check')"><strong>☑️ ② 確認する</strong><span>基本事項を一問ずつ確認</span></button>
<button class="action" onclick="chooseMode('understand')"><strong>🧠 ③ 理解する</strong><span>理由・実験・資料・考察を確認</span></button>
<button class="action" onclick="chooseMode('test')"><strong>📝 ④ テスト</strong><span>単元の問題をまとめて解く</span></button>
</div><div class="toolbar"><button class="secondary" onclick="goHome()">← 教科選択へ</button></div></section>
<section id="units" class="hidden"><h2 id="unitTitle"></h2><p class="lead" id="unitLead">学習する単元を選んでください。</p><div class="grid" id="unitGrid"></div><div class="toolbar"><button class="secondary" onclick="showSubject()">← 学習方法へ戻る</button></div></section>
<section id="learn" class="hidden"><h2 id="learnTitle"></h2><div class="panel" id="learnContent"></div><div class="toolbar"><button class="primary" onclick="startUnitQuiz('check')">この単元を確認する</button><button class="secondary" onclick="showUnits()">← 単元一覧へ</button></div></section>
<section id="quiz" class="hidden"><div class="qmeta"><span id="qCount"></span><span id="qMode"></span></div><div class="progress"><div id="progressBar"></div></div>
<div class="panel"><div class="qmeta"><span id="unitMeta"></span><span id="answeredCount"></span></div><div class="question" id="questionText"></div><div id="options"></div><div id="feedback"></div>
<div class="toolbar"><button class="primary" id="checkBtn" onclick="checkAnswer()" disabled>答え合わせ</button><button class="primary hidden" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button></div></div>
<div class="toolbar"><button class="secondary" onclick="showUnits()">← 単元一覧へ</button></div></section>
<section id="result" class="hidden"><div class="panel"><h2>今回の結果</h2><div class="score" id="scoreText"></div><p id="resultMessage"></p><div id="resultDetails"></div>
<div class="toolbar"><button class="primary" id="retryBtn" onclick="retryWrong()">間違えた問題だけ解く</button><button class="secondary" onclick="restartQuiz()">もう一度解く</button><button class="secondary" onclick="showUnits()">単元一覧へ</button></div></div></section>
</main><footer>中1 定期テスト学習アプリ v0.7｜学習データは端末内に保存</footer>

};
const SUBJECTS={science:{name:"理科",icon:"🧪"},geography:{name:"地理",icon:"🌍"},japanese:{name:"国語",icon:"📚"}};
const MODE={learn:"覚える",check:"確認する",understand:"理解する",test:"テスト"};
let subject="",mode="",unit="",set=[],baseSet=[],idx=0,answers=[],picked=null,locked=false,wrongOnly=false;
const $=id=>document.getElementById(id);
function allQuestions(){return Object.entries(DB).flatMap(([s,units])=>units.flatMap(u=>u.questions.map((q,i)=>({id:s+"|"+u.unit+"|"+i,subject:s,unit:u.unit,q:q[0],a:q[1],c:q[2],e:q[3],kind:q[4],level:q[5]}))))}
function records(){try{return JSON.parse(localStorage.getItem("studyRecords")||"{}")}catch(e){return {}}}
function saveRecord(id,ok){let r=records();r[id]=r[id]||{tries:0,wrong:0,last:""};r[id].tries++;if(!ok)r[id].wrong++;r[id].last=new Date().toLocaleString("ja-JP");localStorage.setItem("studyRecords",JSON.stringify(r))}
function hideAll(){["home","subject","units","learn","quiz","result"].forEach(x=>$(x).classList.add("hidden"))}
function goHome(){hideAll();$("home").classList.remove("hidden");$("crumb").textContent="ホーム";updateStats()}
function chooseSubject(s){subject=s;showSubject()}
function showSubject(){hideAll();$("subject").classList.remove("hidden");$("subjectTitle").textContent=SUBJECTS[subject].name;$("crumb").textContent="ホーム ＞ "+SUBJECTS[subject].name}
function chooseMode(m){mode=m;showUnits()}
function showUnits(){hideAll();$("units").classList.remove("hidden");$("unitTitle").textContent=SUBJECTS[subject].name+"｜"+MODE[mode];$("unitLead").textContent=mode==="learn"?"要点を読んで、重要語句を確認します。":"学習する単元を選んでください。";$("crumb").textContent="ホーム ＞ "+SUBJECTS[subject].name+" ＞ "+MODE[mode];let g=$("unitGrid");g.innerHTML="";DB[subject].forEach((u,i)=>{let b=document.createElement("button");b.className="card";let count=u.questions.length;b.innerHTML='<div class="emoji">📘</div><h3></h3><p>'+count+'問｜要点 '+u.points.length+'項目</p>';b.querySelector("h3").textContent=u.unit;b.onclick=()=>openUnit(u.unit);g.appendChild(b)})}
function openUnit(u){unit=u;if(mode==="learn"){showLearn();return}startUnitQuiz(mode)}
function showLearn(){let u=DB[subject].find(x=>x.unit===unit);hideAll();$("learn").classList.remove("hidden");$("learnTitle").textContent=unit+"｜要点整理";$("crumb").textContent="ホーム ＞ "+SUBJECTS[subject].name+" ＞ 覚える ＞ "+unit;let box=$("learnContent");box.innerHTML="<h3>重要ポイント</h3>";u.points.forEach((p,i)=>{let d=document.createElement("div");d.className="keypoint";d.textContent=(i+1)+"．"+p;box.appendChild(d)});let n=document.createElement("p");n.className="lead";n.textContent="この単元の確認問題："+u.questions.length+"問";box.appendChild(n)}
function startUnitQuiz(which){let u=DB[subject].find(x=>x.unit===unit);let qs=u.questions.map((q,i)=>({id:subject+"|"+unit+"|"+i,subject,unit,q:q[0],a:q[1],c:q[2],e:q[3],kind:q[4],level:q[5]}));if(which==="check")qs=qs.filter(q=>q.kind==="確認"||q.kind==="基本");if(which==="understand")qs=qs.filter(q=>q.kind==="理解"||q.level==="標準"||q.level==="応用");if(which==="test")qs=qs.sort(()=>Math.random()-.5);startQuiz(qs,which)}
function startQuiz(qs,which){set=qs.slice();baseSet=qs.slice();mode=which||mode;idx=0;answers=[];wrongOnly=false;render();hideAll();$("quiz").classList.remove("hidden");$("crumb").textContent="ホーム ＞ "+SUBJECTS[subject].name+" ＞ "+MODE[mode]+" ＞ "+unit}
function render(){picked=null;locked=false;let q=set[idx];$("qCount").textContent="問題 "+(idx+1)+" / "+set.length;$("qMode").textContent=MODE[mode];$("unitMeta").textContent=SUBJECTS[q.subject].name+"｜"+q.unit;$("answeredCount").textContent="回答 "+answers.length+" / "+set.length;$("progressBar").style.width=(idx/set.length*100)+"%";$("questionText").textContent=q.q;$("options").innerHTML="";q.a.forEach((v,i)=>{let l=document.createElement("label");l.className="option";let r=document.createElement("input");r.type="radio";r.name="answer";r.value=i;r.onchange=()=>{picked=i;$("checkBtn").disabled=false};let s=document.createElement("span");s.textContent=String.fromCharCode(65+i)+"．"+v;l.append(r,s);$("options").appendChild(l)});$("feedback").innerHTML="";$("checkBtn").classList.remove("hidden");$("checkBtn").disabled=true;$("nextBtn").classList.add("hidden")}
function checkAnswer(){if(picked===null||locked)return;locked=true;let q=set[idx],ok=picked===q.c;answers.push({q,picked,ok});saveRecord(q.id,ok);let f=$("feedback");f.className="feedback "+(ok?"correct":"incorrect");f.innerHTML="<strong>"+(ok?"正解！":"不正解")+"</strong><div class='explanation'></div>";f.querySelector(".explanation").textContent=q.e;$("checkBtn").classList.add("hidden");$("nextBtn").classList.remove("hidden");$("nextBtn").textContent=idx===set.length-1?"結果を見る":"次の問題へ →";$("answeredCount").textContent="回答 "+answers.length+" / "+set.length}
function nextQuestion(){idx++;if(idx<set.length)render();else showResult()}
function showResult(){hideAll();$("result").classList.remove("hidden");let score=answers.filter(x=>x.ok).length;try{window.rikuLog&&rikuLog("ch1",SUBJECTS[subject].name+"｜"+unit+"｜"+MODE[mode]+(wrongOnly?"｜再挑戦":""),score,set.length)}catch(e){}$("scoreText").textContent=score+" / "+set.length+" 問正解";$("resultMessage").textContent=score===set.length?"全問正解！解説を自分の言葉でも説明できるか確認しましょう。":score>=Math.ceil(set.length*.7)?"よくできました。間違えた問題を復習しましょう。":"解説を読んで、もう一度挑戦しましょう。";let d=$("resultDetails");d.innerHTML="";answers.forEach((x,i)=>{let p=document.createElement("div");p.className="keypoint";p.textContent="問"+(i+1)+"："+(x.ok?"○ 正解":"× 不正解")+"｜"+x.q.q;d.appendChild(p)});$("retryBtn").classList.toggle("hidden",!answers.some(x=>!x.ok));$("progressBar").style.width="100%";updateStats()}
function retryWrong(){let qs=answers.filter(x=>!x.ok).map(x=>x.q);if(!qs.length)return;set=qs;idx=0;answers=[];wrongOnly=true;render();hideAll();$("quiz").classList.remove("hidden");$("crumb").textContent="間違えた問題の再挑戦"}
function restartQuiz(){startQuiz(baseSet,mode)}
function showWrong(){let wrong=allQuestions().filter(q=>{let r=records()[q.id];return r&&r.wrong>0});if(!wrong.length){alert("現在、間違えた問題の記録はありません。");return}subject=wrong[0].subject;unit="全単元";startQuiz(wrong,"test")}
function updateStats(){let r=records(),vals=Object.values(r),wrong=vals.filter(x=>x.wrong>0).length;$("homeStats").textContent="回答した問題："+vals.reduce((n,x)=>n+x.tries,0)+"回｜間違いが記録された問題："+wrong+"問"}
function resetProgress(){if(confirm("この端末に保存された学習記録をすべて消去します。よろしいですか？")){localStorage.removeItem("studyRecords");updateStats()}}
goHome();
</script><script src="riku-common.js"></script></body></html>
