<style>

const BASE=[
{id:'sci001',s:'sci',u:'状態変化',t:'fill',q:'物質が加熱や冷却によって、固体・液体・気体の間ですがたを変えることを何というか。',a:['状態変化'],e:'物質は加熱・冷却によって固体・液体・気体の間で状態が変化する。',p:'p.174'},
{id:'sci002',s:'sci',u:'状態変化',t:'choice',q:'物質を固体→液体→気体の向きに状態変化させる操作はどれか。',c:['加熱する','冷却する','かき混ぜる','圧力を下げる'],a:0,e:'赤い矢印はすべて加熱、青い矢印はすべて冷却。',p:'p.175'},
{id:'sci003',s:'sci',u:'状態変化',t:'choice',q:'次の物質のうち、気体から直接固体になるものがあるのはどれか。',c:['二酸化炭素','塩化ナトリウム','金','アルミニウム'],a:0,e:'二酸化炭素のように、気体から直接固体になる物質もある。',p:'p.174'},
{id:'sci004',s:'sci',u:'状態変化',t:'essay',q:'身のまわりの鉄製品は、鉄のどのような状態変化を利用してつくられているか。「加熱」「冷却」を使って説明しなさい。',a:'鉄を加熱してとかして液体にし、型に流しこんで冷却し、再び固体にしている。',r:['加熱して固体から液体にする','型に流しこむ','冷却して再び固体にする'],e:'図46の金属の型への流しこみ。',p:'p.174'},

BASE.push(...[{"id":"sci021","s":"sci","u":"状態変化と温度","t":"choice","q":"水を加熱したとき、氷がとけている間の水の温度はどうなるか。","c":["0℃で一定","上がり続ける","100℃で一定","下がり続ける"],"a":0,"e":"図57のグラフ。氷がとけている間も、水が沸騰している間も温度は一定。","p":"p.180"},{"id":"sci022","s":"sci","u":"状態変化と温度","t":"choice","q":"温度計の目盛りを読むとき、最小目盛りの何分の1まで目分量で読むか。","c":["10分の1","2分の1","5分の1","100分の1"],"a":0,"e":"液面の位置を真横から見て、最小目盛りの10分の1まで読む。","p":"p.180"},{"id":"sci023","s":"sci","u":"体積と質量","t":"choice","q":"水が液体から固体(氷)になると、体積はどうなるか。","c":["約1.1倍に大きくなる","約0.9倍に小さくなる","変わらない","約490倍になる"],"a":0,"e":"水は例外で、氷になると体積が約1.1倍になる。","p":"p.178"},{"id":"sci024","s":"sci","u":"体積と質量","t":"choice","q":"実験6で、液体のろうが固体になったとき、体積と質量はどうなったか。","c":["体積は小さくなり、質量は変わらない","体積も質量も小さくなる","体積は大きくなり、質量は変わらない","体積も質量も変わらない"],"a":0,"e":"固体になると液面の印より下がった。質量は変化しない。","p":"p.178"},{"id":"sci025","s":"sci","u":"体積と質量","t":"choice","q":"固体・液体・気体のうち、粒子が規則正しく並び、その位置でわずかに動いているのはどれか。","c":["固体","液体","気体","どれでもない"],"a":0,"e":"固体→液体→気体の順に粒子の運動が激しくなり、粒子の間隔が広がる。","p":"p.179"},{"id":"sci026","s":"sci","u":"体積と質量","t":"choice","q":"蒸発と沸騰のちがいとして正しいものはどれか。","c":["蒸発は液体の表面で起こり、沸騰は液体の内部からも起こる","蒸発は内部で、沸騰は表面で起こる","蒸発は100℃以上でのみ起こる","どちらも表面でだけ起こる"],"a":0,"e":"蒸発は温度に関係なく液体の表面で起こる。沸騰は内部からも気体になる。","p":"p.179"},{"id":"sci027","s":"sci","u":"体積と質量","t":"essay","q":"物質が液体から固体に変わるとき、(水以外では)体積が小さくなる理由を、粒子の言葉を使って説明しなさい。","a":"粒子の数は変わらないが、粒子が規則正しく並んで粒子どうしの間隔がせまくなるから。","r":["粒子の数は変わらない","粒子が規則正しく並ぶ","粒子どうしの間隔がせまくなる"],"e":"質量は変わらず体積だけが小さくなる。","p":"p.179"},{"id":"sci028","s":"sci","u":"混合物の分け方","t":"choice","q":"次のうち、混合物はどれか。","c":["空気","酸素","エタノール","塩化ナトリウム"],"a":0,"e":"空気は窒素・酸素などの混合物。酸素、エタノール、塩化ナトリウムは1種類の物質(純粋な物質)。","p":"p.191"},{"id":"sci029","s":"sci","u":"混合物の分け方","t":"choice","q":"水とエタノールの混合物を加熱したときの温度変化はどうなるか。","c":["沸騰が始まっても、温度はゆるやかに上がり続ける","78℃で一定になる","100℃で一定になる","下がっていく"],"a":0,"e":"混合物の沸点や融点は決まった温度にならない(図63)。","p":"p.186"},{"id":"sci030","s":"sci","u":"混合物の分け方","t":"fill","q":"液体を加熱して沸騰させ、出てくる蒸気を冷やして再び液体にして集める方法を何というか。","a":["蒸留"],"e":"沸点のちがいを利用して、混合物から目的の物質を分離する。","p":"p.188"},{"id":"sci031","s":"sci","u":"混合物の分け方","t":"choice","q":"実験8で、最初の試験管に集まった液体に火がついたのはなぜか。","c":["エタノールの沸点が水より低く、エタノールを多くふくむ蒸気が先に出てくるから","水の沸点が低いから","エタノールが水に変化したから","沸騰石を入れたから"],"a":0,"e":"エタノールの沸点は78℃で、水(100℃)より低い。","p":"p.188"},{"id":"sci032","s":"sci","u":"混合物の分け方","t":"essay","q":"水とエタノールの混合物からエタノールを多くふくむ液体をとり出す方法を、「沸点」という言葉を使って説明しなさい。","a":"混合物を加熱し、沸点が低いエタノールを多くふくむ気体が先に出てくるので、それを冷やして液体にして集める(蒸留)。","r":["混合物を加熱する","沸点のちがいを利用する","出てきた気体を冷やして液体にして集める"],"e":"実験8。集める順番によってエタノールの割合がちがう。","p":"p.188"},{"id":"sci033","s":"sci","u":"混合物の分け方","t":"choice","q":"石油(原油)からガソリンや灯油をとり出すときに利用している方法はどれか。","c":["蒸留(沸点のちがいを利用)","ろ過","水に溶かす","磁石を使う"],"a":0,"e":"蒸留塔で、沸点のちがいによって成分を分ける。","p":"p.189"},{"id":"sci034","s":"sci","u":"光の反射","t":"fill","q":"光が物体の表面などではね返ることを何というか。","a":["光の反射","反射"],"e":"はね返った光の向きは、鏡の面に垂直な直線を基準にして決まる。","p":"p.204"},{"id":"sci035","s":"sci","u":"光の反射","t":"choice","q":"光が反射するとき、入射角と反射角の関係として正しいものはどれか。","c":["いつも等しい","入射角のほうが大きい","反射角のほうが大きい","決まっていない"],"a":0,"e":"実験1から。これを光の反射の法則という。","p":"p.204"},{"id":"sci036","s":"sci","u":"光の反射","t":"choice","q":"入射角とは、どの角度のことか。","c":["鏡の面に垂直な直線と入射光の間の角度","鏡の面と入射光の間の角度","入射光と反射光の間の角度","鏡の面と反射光の間の角度"],"a":0,"e":"反射角は、鏡の面に垂直な直線と反射光の間の角度。","p":"p.204"},{"id":"sci037","s":"sci","u":"光の反射","t":"choice","q":"物体が見えるために必要なこととして正しいものはどれか。","c":["光源から出た光や物体で反射した光が目に届くこと","物体が自分で光を出していること","物体が暗いところにあること","物体が鏡に映っていること"],"a":0,"e":"真っ暗なところでは物体は見えない。","p":"p.205"},{"id":"sci038","s":"sci","u":"光の反射","t":"essay","q":"紙などの表面で光が反射するとき、どの方向からでもその物体が見える理由を説明しなさい。","a":"表面が細かくでこぼこしていて、光がいろいろな方向に反射する(乱反射する)ので、どの方向からでも目に光が届くから。","r":["表面がでこぼこしている","光がいろいろな方向に反射する(乱反射)","どの方向からでも目に光が届く"],"e":"1つ1つの光は反射の法則どおりに反射している。","p":"p.206"},{"id":"sci039","s":"sci","u":"光の屈折","t":"fill","q":"光が異なる物質の境界で折れ曲がる現象を何というか。","a":["屈折","光の屈折"],"e":"境界の面に垂直な直線と屈折した光の間の角度を屈折角という。","p":"p.210"},{"id":"sci040","s":"sci","u":"光の屈折","t":"choice","q":"光が空気から水やガラスへ進むとき、入射角と屈折角の関係はどれか。","c":["入射角>屈折角","入射角<屈折角","入射角=屈折角","屈折しない"],"a":0,"e":"水やガラスから空気へ進むときは、入射角<屈折角になる。","p":"p.211"},{"id":"sci041","s":"sci","u":"光の屈折","t":"fill","q":"光が水やガラスから空気へ進むとき、入射角を大きくしていくと、境界面ですべての光が反射するようになる。この現象を何というか。","a":["全反射"],"e":"光ファイバーなどに利用されている。","p":"p.211"},{"id":"sci042","s":"sci","u":"光の屈折","t":"choice","q":"通信ケーブルの光ファイバーで光を伝えるしくみに利用されている現象はどれか。","c":["全反射","乱反射","光の分散","像の拡大"],"a":0,"e":"光が内部で全反射をくり返して進む。","p":"p.211"},{"id":"sci043","s":"sci","u":"光の屈折","t":"essay","q":"カップの底のコインが、水を入れると見えるようになる理由を説明しなさい。","a":"コインで反射した光が水面で屈折して目に届くようになり、光がまっすぐ進んできたように感じるから。","r":["光が水面で屈折する","屈折した光が目に届く"],"e":"図18。川底が浅く見えるのも同じしくみ。","p":"p.210"},{"id":"sci044","s":"sci","u":"光と色","t":"choice","q":"白色光をプリズムに通すと色が分かれるのはなぜか。","c":["色ごとに屈折する角度がちがうから","色ごとに反射するから","色ごとに吸収されるから","光の量が増えるから"],"a":0,"e":"虹も、空気中の水滴で光が屈折して色が分かれて見える現象。","p":"p.212"},{"id":"sci045","s":"sci","u":"光と色","t":"essay","q":"青い傘が青く見える理由を説明しなさい。","a":"傘の表面で青色の光が強く反射され、それ以外の色の光の多くは吸収されるから。","r":["青色の光が反射される","青以外の光は吸収される"],"e":"図25。","p":"p.212"},{"id":"sci046","s":"sci","u":"凸レンズ","t":"fill","q":"凸レンズの光軸に平行な光が屈折して1点に集まる。この点を何というか。","a":["焦点"],"e":"レンズの中心から焦点までの距離が焦点距離。","p":"p.215"},{"id":"sci047","s":"sci","u":"凸レンズ","t":"choice","q":"凸レンズのふくらみが大きいほど、焦点距離はどうなるか。","c":["短くなる","長くなる","変わらない","0になる"],"a":0,"e":"ふくらみの大きいレンズほど、光の屈折のしかたが大きい。","p":"p.215"},{"id":"sci048","s":"sci","u":"凸レンズ","t":"choice","q":"光軸に平行に凸レンズに入った光は、通過後どう進むか。","c":["焦点を通る","まっすぐ進む","光軸に平行のまま進む","反射する"],"a":0,"e":"レンズの中心を通る光は直進する。焦点を通って入った光は光軸に平行に進む。","p":"p.216"},{"id":"sci049","s":"sci","u":"凸レンズ","t":"choice","q":"物体を焦点距離の2倍より遠い位置に置いたとき、できる像はどれか。","c":["物体より小さい実像(上下左右が逆向き)","物体と同じ大きさの実像","物体より大きい実像","物体より大きい虚像"],"a":0,"e":"焦点距離の2倍の位置では、同じ大きさの実像ができる。","p":"p.219"},{"id":"sci050","s":"sci","u":"凸レンズ","t":"choice","q":"物体を凸レンズの焦点の内側に置いて、レンズを通して見ると何が見えるか。","c":["物体より大きい虚像(同じ向き)","物体より小さい実像","上下逆向きの実像","何も見えない"],"a":0,"e":"虫眼鏡で見える像。スクリーンには映らない。","p":"p.219"},{"id":"sci051","s":"sci","u":"凸レンズ","t":"choice","q":"物体を凸レンズの焦点の位置に置いたとき、像はどうなるか。","c":["スクリーン上に像はできない","実像ができる","虚像ができる","大きな実像ができる"],"a":0,"e":"焦点上では光が平行に進み、1点に集まらない。","p":"p.219"},{"id":"sci052","s":"sci","u":"凸レンズ","t":"essay","q":"実像と虚像のちがいを説明しなさい。","a":"実像は光が実際に1点に集まってできる像でスクリーンに映る。虚像は光が集まっておらず、屈折した光の延長線上にあるように見える像でスクリーンには映らない。","r":["実像は光が実際に集まる/スクリーンに映る","虚像は光が集まらず延長線上に見える/スクリーンに映らない"],"e":"図33・35。","p":"p.219"},{"id":"sci053","s":"sci","u":"光の屈折","t":"essay","q":"深い川でも、川岸からは浅く見える場合がある。この理由を説明しなさい。","a":"川底から出た光が水面で屈折して目に届き、光が屈折前の直線上から来たように見えるので、実際より浅い位置にあるように見えるから。","r":["光が水面で屈折する","屈折した光が目に届く","実際より浅い位置にあるように見える"],"e":"振り返りの問題。","p":"p.221"},{"id":"sci054","s":"sci","u":"力だめし(物質)","t":"fill","q":"赤ワインの液体の成分は、おもに□とエタノールであると考えられる。□にあてはまる物質名を答えなさい。","a":["水"],"e":"ブドウを原料につくる赤ワインの成分は、水とエタノールが中心。","p":"p.193 問5"},{"id":"sci055","s":"sci","u":"力だめし(物質)","t":"choice","q":"赤ワインを蒸留して3本の試験管A〜Cに順に液体を集めた。集まった液体の色として正しいものはどれか。","c":["どれも無色","どれももとの赤ワインと同じ赤色","Aがもっとも濃い赤色","Cがもっとも濃い赤色"],"a":0,"e":"蒸留では沸点の低い物質が気体になって出てくるので、赤い色のもとは試験管に集まらない。※答えは教科書p.267で確認してください。","p":"p.193 問5"},{"id":"sci056","s":"sci","u":"力だめし(物質)","t":"choice","q":"赤ワインの蒸留で、エタノールの濃度がもっとも高い液体が集まったのはどれか。","c":["試験管A(青い炎をあげてよく燃えたから)","試験管B(火がついたがすぐに消えたから)","試験管C(火がつかなかったから)","どれも同じ"],"a":0,"e":"沸点の低いエタノールが先に出てくるので、最初のAにエタノールが多く集まる。","p":"p.193 問5"},{"id":"sci057","s":"sci","u":"力だめし(物質)","t":"essay","q":"水ではない物質を固体・液体・気体の粒子のモデルで表した図で、固体の粒子は底に規則正しく並び、気体の粒子は広がって飛び回っている。この物質が液体になったときの粒子のようすを、体積の変化を意識して説明しなさい。","a":"粒子の数は変わらず、固体より体積は少し大きくなる。粒子は規則正しくは並ばず、たがいに近い距離でうごき回る。気体ほど広がらない。","r":["粒子の数は変わらない","固体より少し広がる/体積が少し大きい","気体ほど広がらず、粒子は近いまま動く"],"e":"固体<液体<<気体の順に体積が大きくなる(水は例外)。","p":"p.193 問4"},{"id":"sci058","s":"sci","u":"力だめし(物質)","t":"fill","q":"ある卵の体積は60cm³、質量は65gであった。この卵の密度は何g/cm³か。四捨五入して小数第2位まで求めなさい。","a":["1.08","1.08g/cm3"],"e":"密度=質量÷体積=65÷60=1.083…→1.08。","p":"p.194 問6"},{"id":"sci059","s":"sci","u":"力だめし(物質)","t":"choice","q":"密度を求める式として正しいものはどれか。","c":["密度(g/cm³)=物質の質量(g)÷物質の体積(cm³)","密度(g/cm³)=物質の体積(cm³)÷物質の質量(g)","密度(g/cm³)=物質の質量(g)×物質の体積(cm³)","密度(g/cm³)=物質の質量(g)+物質の体積(cm³)"],"a":0,"e":"密度は、一定体積(1cm³)あたりの質量。","p":"p.190"},{"id":"sci060","s":"sci","u":"力だめし(物質)","t":"fill","q":"密度1.12g/cm³の卵が浮くようにしたい。水400cm³に食塩を10gずつ加えるとき、何回加えると浮くか。水溶液の体積は変化しないものとする。","a":["5","5回"],"e":"(400+10×n)÷400が1.12以上になればよい。n=4.8なので5回。","p":"p.194 問6"},{"id":"sci061","s":"sci","u":"力だめし(物質)","t":"essay","q":"ふちまで水が入ったビーカーを使って、卵の体積をはかる方法を説明しなさい。","a":"ビーカーに水をふちすれすれまで入れ、卵を静かに沈める。こぼれた水の体積をメスシリンダーではかると、それが卵の体積になる。","r":["水をふちすれすれまで入れる","卵を沈めてこぼれた水の体積をはかる","メスシリンダーを使う"],"e":"メスシリンダーに卵が入らないときの方法。","p":"p.194 問6"},{"id":"sci062","s":"sci","u":"力だめし(物質)","t":"choice","q":"ガスバーナーに火をつける手順として正しいものはどれか。ア:ガス調節ねじと空気調節ねじが軽く閉まっている状態にする。キ:元栓を開ける。エ:コックを開けて、マッチに火をつける。オ:ななめ下から火を近づけ、ガス調節ねじをゆるめて点火する。イ:ガス調節ねじで炎の大きさを10cmにする。カ:空気調節ねじで青色の炎にする。","c":["ア→キ→エ→オ→イ→カ","キ→ア→エ→オ→イ→カ","ア→キ→オ→エ→カ→イ","エ→キ→ア→オ→イ→カ"],"a":0,"e":"元栓を開ける前に、2つのねじが閉まっていることを確認する。※答えは教科書p.267で確認してください。","p":"p.192 問1"},{"id":"sci063","s":"sci","u":"力だめし(物質)","t":"fill","q":"砂糖のように、燃えると二酸化炭素を生じる、炭素をふくむ物質を一般に何というか。","a":["有機物"],"e":"有機物は炭素をふくむ物質。燃えると二酸化炭素と水ができる。","p":"p.192 問1"},{"id":"sci064","s":"sci","u":"力だめし(物質)","t":"choice","q":"スチール缶とアルミニウム缶を紙やすりでみがいたとき、どちらにも見られる性質はどれか。","c":["金属光沢が見られる","電気を通さなくなる","磁石につく","においが出る"],"a":0,"e":"金属に共通の性質。","p":"p.192 問1"},{"id":"sci065","s":"sci","u":"力だめし(物質)","t":"choice","q":"スチール缶とアルミニウム缶を、身近な道具で簡単に区別する方法はどれか。","c":["磁石を近づける(スチール缶だけがつく)","水に入れる(スチール缶だけがとける)","においをかぐ","火を近づける(スチール缶だけが燃える)"],"a":0,"e":"鉄は磁石につくが、アルミニウムはつかない。","p":"p.192 問1"},{"id":"sci066","s":"sci","u":"力だめし(物質)","t":"choice","q":"酸素と二酸化炭素の入った試験管を、火のついた線香で区別する方法として正しいものはどれか。","c":["酸素では線香が激しく燃え、二酸化炭素では火が消える","酸素では火が消え、二酸化炭素では激しく燃える","どちらも同じように燃える","どちらも火が消える"],"a":0,"e":"酸素にはものを燃やすはたらきがある。","p":"p.192 問2"},{"id":"sci068","s":"sci","u":"力だめし(物質)","t":"essay","q":"塩化ナトリウム水溶液を冷やしても、結晶がほとんど出てこない。溶解度のグラフでは、塩化ナトリウムの曲線は温度が変わってもほとんど横ばいである。このことをもとに、結晶が出にくい理由を説明しなさい。","a":"塩化ナトリウムは、水の温度による溶解度の変化が小さいので、冷やしても出てくる結晶がほとんどないから。","r":["温度による溶解度の変化が小さい","だから冷やしても結晶があまり出ない"],"e":"グラフがほぼ水平。水を蒸発させて結晶をとり出す。","p":"p.193 問3(2)"},{"id":"soc001","s":"soc","u":"ヨーロッパの自然環境","t":"choice","q":"ヨーロッパ中央部に東西にのびる、3000m級の山々がそびえる険しい山脈はどれか。","c":["アルプス山脈","ウラル山脈","ヒマラヤ山脈","ロッキー山脈"],"a":0,"e":"南側のイタリアなどには火山や地震も多い。","p":"p.64"},{"id":"soc002","s":"soc","u":"ヨーロッパの自然環境","t":"fill","q":"スカンディナビア半島の西海岸には、氷河にけずられてできた奥ぶかい湾が見られる。この地形を何というか。","a":["フィヨルド"],"e":"ヨーロッパ北部はかつて氷河におおわれていた。","p":"p.64"},{"id":"soc003","s":"soc","u":"ヨーロッパの自然環境","t":"fill","q":"ヨーロッパの大西洋や北海の沿岸を流れ、沿岸を暖める暖流を何というか。","a":["北大西洋海流"],"e":"この暖流と偏西風の影響で、高緯度のわりに冬の寒さがおだやか。","p":"p.64"},{"id":"soc004","s":"soc","u":"ヨーロッパの自然環境","t":"fill","q":"暖流の北大西洋海流の上を通って暖められた空気を、ヨーロッパに運んでくる、一年じゅう西から東へふく風を何というか。","a":["偏西風"],"e":"偏西風と北大西洋海流で、ヨーロッパ西部は温暖。","p":"p.64"},{"id":"soc005","s":"soc","u":"ヨーロッパの自然環境","t":"essay","q":"ヨーロッパの大西洋沿岸は、日本より緯度が高いのに、冬の寒さがおだやかである。その理由を説明しなさい。","a":"暖流の北大西洋海流と、その上で暖められた空気を運んでくる偏西風の影響を受けるから。","r":["北大西洋海流(暖流)にふれている","偏西風にふれている","暖められた空気が運ばれてくる"],"e":"「北大西洋海流」「偏西風」の2語を必ず使う。","p":"p.64"},{"id":"soc006","s":"soc","u":"ヨーロッパの自然環境","t":"choice","q":"ヨーロッパの西部の沿岸に広がるおだやかな気候はどれか。","c":["西岸海洋性気候","地中海性気候","冷帯(亜寒帯)","砂漠気候"],"a":0,"e":"日本のような梅雨がなく、気温も日本ほど高くない。","p":"p.65"},{"id":"soc007","s":"soc","u":"ヨーロッパの自然環境","t":"choice","q":"ギリシャ・イタリア・スペインなど、ヨーロッパ南部の地中海沿岸の気候の特徴はどれか。","c":["夏は高温で乾燥し、冬は比較的雨が多い","1年じゅう雨が多い","1年じゅう気温が低い","夏は低温で、冬は雨が少ない"],"a":0,"e":"地中海性気候。","p":"p.65"},{"id":"soc008","s":"soc","u":"ヨーロッパの自然環境","t":"fill","q":"緯度の高い地域で、夏に太陽が1日じゅう沈まない、または沈んでも地平線近くにあって、うす明るい状態が続くことを何というか。","a":["白夜"],"e":"ノルウェーなどの写真(図4)。夏は昼が長く、冬は昼が短い。","p":"p.65"},{"id":"soc009","s":"soc","u":"ヨーロッパの自然環境","t":"choice","q":"ヨーロッパ東部のポーランドからロシア、北部のスカンディナビア半島に広がる気候はどれか。","c":["冷帯(亜寒帯)","温暖湿潤気候","熱帯","乾燥帯"],"a":0,"e":"暖流の影響がとどかず、冷涼。針葉樹林が広がる。","p":"p.65"},{"id":"soc010","s":"soc","u":"ヨーロッパの自然環境","t":"choice","q":"ヨーロッパについて正しいものはどれか。","c":["世界の六つの州のなかで人口密度がアジアの次に高い","面積は六つの州のなかで最大である","国は10か国に満たない","人口密度は世界でもっとも低い"],"a":0,"e":"面積は2番目にせまいが、40か国以上に分かれている。","p":"p.65"},{"id":"soc011","s":"soc","u":"民族・宗教とEUのあゆみ","t":"fill","q":"ヨーロッパの言語は、ゲルマン系、ラテン系、□系に大きく分けられる。□にあてはまる語句を答えなさい。","a":["スラブ"],"e":"文字や単語が似ているなど、共通する部分が多い。","p":"p.68"},{"id":"soc012","s":"soc","u":"民族・宗教とEUのあゆみ","t":"choice","q":"ヨーロッパで広く信仰されているキリスト教の三つの宗派の組み合わせはどれか。","c":["カトリック・プロテスタント・正教会","カトリック・イスラム教・正教会","プロテスタント・仏教・正教会","カトリック・ヒンドゥー教・プロテスタント"],"a":0,"e":"クリスマスやイースターなどの行事が祝日になっている国も多い。","p":"p.68"},{"id":"soc013","s":"soc","u":"民族・宗教とEUのあゆみ","t":"essay","q":"西ヨーロッパの国々が統合を進めた理由を、「世界大戦」と「鉱産資源」という言葉を使って説明しなさい。","a":"20世紀前半の二度の世界大戦の教訓から、再び戦争を起こさないように、戦争に必要な鉱産資源(石炭・鉄鉱石)を共同で管理し、協力して経済発展をめざしたから。","r":["二度の世界大戦の教訓","鉱産資源を共同で管理する","協力して経済発展をめざす/戦争を防ぐ"],"e":"統合の目的の一つは、石炭や鉄鉱石を自由に取り引きすること。","p":"p.68・70"},{"id":"soc014","s":"soc","u":"民族・宗教とEUのあゆみ","t":"fill","q":"1993年につくられた、多くの共通政策を行うヨーロッパの強力な国際組織を何というか。アルファベット2字でも答えられる。","a":["ヨーロッパ連合","EU"],"e":"東ヨーロッパにも加盟国が広がり、現在も加盟をめざす国がある。","p":"p.69"},{"id":"soc015","s":"soc","u":"民族・宗教とEUのあゆみ","t":"fill","q":"EUの加盟国の多くが、国ごとの通貨を廃止して導入した共通通貨を何というか。","a":["ユーロ"],"e":"硬貨の表面は共通、裏面は国ごとにことなるデザイン。","p":"p.69"},{"id":"soc016","s":"soc","u":"民族・宗教とEUのあゆみ","t":"choice","q":"EUの加盟国の人口は約何億人か。","c":["約4億人","約1億人","約10億人","約14億人"],"a":0,"e":"国内総生産(GDP)は世界の約2割をしめる。","p":"p.69"},{"id":"soc017","s":"soc","u":"民族・宗教とEUのあゆみ","t":"essay","q":"EUがつくられたことで、人々の生活が便利になった点を、2つ答えなさい。","a":"パスポートなしで国境を通過でき、隣の国に通勤したり買い物に行ったりできる。また、ある加盟国で取得した資格が、ほかの加盟国でも通用して働ける。","r":["国境を自由に行き来できる(パスポート不要)","隣国への通勤・買い物ができる","資格を取り直さずに他国で働ける"],"e":"人・物資・金銭が国境を通るときの制限をなくした。","p":"p.69"},{"id":"soc018","s":"soc","u":"民族・宗教とEUのあゆみ","t":"choice","q":"ソ連(ソビエト社会主義共和国連邦)は、1991年に何か国に分かれたか。","c":["15か国","4か国","10か国","27か国"],"a":0,"e":"分裂後も、ロシアは東ヨーロッパの国々に強い影響をもつ。","p":"p.69"},{"id":"soc019","s":"soc","u":"ヨーロッパの工業と農業","t":"choice","q":"EUの加盟国が国境を越えて航空機を生産できる理由として、本文に書かれているものはどれか。","c":["国境を物資が通過する制限が少ないから","各国が同じ言語を使っているから","どの国も航空機の技術がないから","アジアとの競争が少ないから"],"a":0,"e":"各国で部品を分担して作り、フランスなどで組み立てている。","p":"p.70"},{"id":"soc020","s":"soc","u":"ヨーロッパの工業と農業","t":"choice","q":"ヨーロッパの工業で、近年広がっている動きはどれか。","c":["西ヨーロッパの工場を、賃金の低い東ヨーロッパに移す動き","東ヨーロッパの工場を西ヨーロッパに集める動き","工場をすべて海外にうつす動き","工業をやめて農業に転換する動き"],"a":0,"e":"西ヨーロッパと東ヨーロッパには、賃金の格差がある。","p":"p.70"},{"id":"soc021","s":"soc","u":"ヨーロッパの工業と農業","t":"fill","q":"アルプス山脈より北側で、小麦・ライ麦・じゃがいもなどの栽培と、豚・牛などの家畜の飼育を組み合わせて行う農業を何というか。","a":["混合農業"],"e":"ヨーロッパの北部や山岳地域では酪農も盛ん。","p":"p.71"},{"id":"soc022","s":"soc","u":"ヨーロッパの工業と農業","t":"fill","q":"地中海沿岸で、夏の乾燥に強いオリーブやぶどうなどを栽培し、冬の降水を利用して小麦などを栽培する農業を何というか。","a":["地中海式農業"],"e":"ヨーロッパでは、地域ごとの自然環境に応じた農業が行われている。","p":"p.71"},{"id":"soc023","s":"soc","u":"ヨーロッパの工業と農業","t":"fill","q":"EUが加盟国の農業を守り、食料自給率を上げるために行っている共通の政策を何というか。","a":["共通農業政策"],"e":"農産物の価格を高く維持し、補助金を出してきた。","p":"p.71"},{"id":"soc024","s":"soc","u":"ヨーロッパの工業と農業","t":"essay","q":"EUの共通農業政策の成果と、そこから生じた課題を説明しなさい。","a":"成果:農産物の生産が増え、EU内で主要な農産物を自給できるようになった。課題:過剰な生産や自然環境への影響、補助金制度の負担が問題になり、価格を下げて生産量を調整し、環境にやさしい農業に取り組むなど見直しが進んでいる。","r":["食料自給率が上がった(自給できるようになった)","生産過剰・環境への影響・補助金などの課題","政策の見直しが進んでいる"],"e":"輸入農産物に対抗して価格を高く維持してきた。","p":"p.71"},{"id":"soc025","s":"soc","u":"エネルギーと環境問題","t":"fill","q":"石炭や石油などの化石燃料を燃やして生じる酸性の化合物が雨にとけたもので、ヨーロッパの多くの国に被害をもたらしたものを何というか。","a":["酸性雨"],"e":"国際的に、工場の排煙や自動車の排出ガスを規制する取り組みが進んでいる。","p":"p.72"},{"id":"soc026","s":"soc","u":"エネルギーと環境問題","t":"essay","q":"ヨーロッパで環境問題がEU全体の課題として取り組まれるようになった理由を、「酸性雨」を例に説明しなさい。","a":"酸性雨のように、環境問題は一つの国だけにとどまらず、国境を越えて多くの国々に被害が広がるから。","r":["酸性雨などの環境問題を例にしている","国境を越えて多くの国に被害が広がる"],"e":"国際的に排煙や排出ガスの規制が進められた。","p":"p.72"},{"id":"soc027","s":"soc","u":"エネルギーと環境問題","t":"choice","q":"パークアンドライドとは、どのようなしくみか。","c":["都心部への自家用車の乗り入れを止め、郊外の駅に駐車して公共交通機関で都心へ行くしくみ","都心部に大きな駐車場をつくるしくみ","自家用車を無料で貸し出すしくみ","都心に住む人を郊外に移すしくみ"],"a":0,"e":"持続可能な社会をつくるための取り組みの一つ。","p":"p.72"},{"id":"soc028","s":"soc","u":"エネルギーと環境問題","t":"fill","q":"ヨーロッパでは、送電線や□が多くの国につながり、国境を越えた資源・エネルギーの輸出入が広がっている。□にあてはまる語句を答えなさい。","a":["パイプライン"],"e":"ロシアからパイプラインで石油や天然ガスが送られている。","p":"p.73"},{"id":"soc029","s":"soc","u":"エネルギーと環境問題","t":"fill","q":"ドイツなどが力を入れている、風力・太陽光・バイオマスなどによる発電に使われるエネルギーを何というか。","a":["再生可能エネルギー"],"e":"ドイツは1986年のチェルノブイリ原子力発電所の事故後、原子力に依存しない社会をめざした。","p":"p.73"},{"id":"soc030","s":"soc","u":"エネルギーと環境問題","t":"essay","q":"ヨーロッパの資源・エネルギー問題について、2022年のロシアのウクライナ侵攻後に起きた課題を説明しなさい。","a":"EUとロシアの関係が悪化して、ロシアからの石油・天然ガスの輸入が制限され、エネルギー供給に不安が生じて価格が大きく上昇した。ロシアにたよらないエネルギーの確保が課題になっている。","r":["ロシアからの輸入が制限された","エネルギー供給への不安・価格の上昇","ロシアにたよらない確保が課題"],"e":"再生可能エネルギーは値段が高いなどの課題もある。","p":"p.73"},{"id":"soc031","s":"soc","u":"EUの課題","t":"fill","q":"さまざまな民族や文化、宗教をもつ人々がともに暮らす社会を何というか。","a":["多文化社会"],"e":"アジア・アフリカから移民や難民が来ることなどでヨーロッパは多文化社会になっている。","p":"p.74・76"},{"id":"soc032","s":"soc","u":"EUの課題","t":"choice","q":"2020年に、EUから初めて離脱した国はどこか。","c":["イギリス","ドイツ","フランス","スペイン"],"a":0,"e":"2016年の国民投票で離脱派が多数になった。","p":"p.75"},{"id":"soc033","s":"soc","u":"EUの課題","t":"essay","q":"EUの統合を進めるうえでの課題を、加盟国のあいだの格差にふれて説明しなさい。","a":"豊かな西ヨーロッパと所得の低い東ヨーロッパのあいだに格差があり、人の移動や失業、各国の主権や文化を守りたい意見との対立など、統合をさらに進めることには賛否がある。","r":["西と東の格差にふれている","統合の進め方について意見がわかれる/対立がある"],"e":"EU離脱の動きも課題のひとつ。","p":"p.74〜76"},{"id":"soc034","s":"soc","u":"アフリカの自然環境","t":"choice","q":"アフリカ州の面積・人口・GDPについて正しいものはどれか。","c":["面積は世界の約22%だが、GDPは世界の約2.9%にとどまる","面積は世界の約2.9%で、GDPは世界の約22%","面積もGDPも世界の約半分","面積は世界の約9%で、GDPは約25%"],"a":0,"e":"ヨーロッパ州は面積約9.1%、GDPが約24.9%。","p":"p.63・79"},{"id":"soc035","s":"soc","u":"アフリカの自然環境","t":"fill","q":"アフリカ大陸の東部の高原から流れ出し、世界最長の川を何というか。","a":["ナイル川"],"e":"下流に水や栄養分の豊かな土をもたらし、古くから文明を生み出した。","p":"p.80"},{"id":"soc036","s":"soc","u":"アフリカの自然環境","t":"fill","q":"アフリカ大陸の北部に広がる、世界最大の砂漠を何というか。","a":["サハラ砂漠"],"e":"乾燥帯では、オアシスやかんがいを利用した農業や牧畜が行われる。","p":"p.81"},{"id":"soc037","s":"soc","u":"アフリカの自然環境","t":"choice","q":"アフリカ大陸の気候について正しいものはどれか。","c":["赤道をさかいに、南北で気候が対称的に分布している","全域が熱帯雨林気候である","南部は北部より気温が低い砂漠が広がる","赤道付近は乾燥帯が広がる"],"a":0,"e":"ギニア湾岸やコンゴ盆地は熱帯雨林気候。その外側に雨季と乾季のあるサバナ気候。","p":"p.80"},{"id":"soc038","s":"soc","u":"アフリカの自然環境","t":"fill","q":"熱帯雨林気候の地域で、自然が森林を再生する力を利用して、森を焼いて灰を肥料に作物をつくる農業を何というか。","a":["焼畑農業"],"e":"1年から数年のあいだ農作物を栽培した後、森が回復するまで土地を休ませる。","p":"p.80・81"},{"id":"soc039","s":"soc","u":"アフリカの自然環境","t":"choice","q":"アフリカの3都市の年降水量は、カイロ29.7mm、ロメ837.9mm、プレトリア665.2mmである。もっとも降水量が少ない都市はどれか。","c":["カイロ","ロメ","プレトリア","どれも同じ"],"a":0,"e":"カイロは北部のサハラ砂漠に近く、乾燥している。","p":"p.80"},{"id":"soc040","s":"soc","u":"アフリカの歴史と文化","t":"essay","q":"アフリカの国境線に直線的なものが多い理由と、そのことが現在の課題につながっている点を説明しなさい。","a":"ヨーロッパの国々の植民地になったとき、民族の分布を無視して直線的な境界線が引かれた。独立後も国境線はそのまま残り、民族問題や紛争の原因になっている。","r":["ヨーロッパの植民地支配","民族の分布を無視して国境が引かれた","民族問題・紛争の原因になっている"],"e":"植民地の多くは第二次世界大戦後に独立した。","p":"p.81"},{"id":"soc041","s":"soc","u":"アフリカの歴史と文化","t":"fill","q":"16世紀ごろからヨーロッパ系の人々がアフリカに進出し、多くの人々を南北アメリカにつれ去って働かせた。このようにつれ去られた人々を何というか。","a":["奴隷"],"e":"アフリカは多くの地域がヨーロッパの国々の植民地になった。","p":"p.81"},{"id":"soc042","s":"soc","u":"アフリカの歴史と文化","t":"choice","q":"サハラ砂漠より南で、地域の共通語として公用語になっている言語はどれか。","c":["スワヒリ語","アラビア語","ヒンディー語","ラテン語"],"a":0,"e":"北アフリカではアラビア語が広く話され、イスラム教が信仰されている。","p":"p.81"},{"id":"soc043","s":"soc","u":"アフリカの経済","t":"fill","q":"植民地支配をしていたヨーロッパ系の人々が経営した、カカオ・コーヒー・茶などの輸出用の農作物を栽培する大農園を何というか。","a":["プランテーション"],"e":"独立後も輸出用の農作物を集中的に栽培する農業が続く国が多い。","p":"p.84"},{"id":"soc044","s":"soc","u":"アフリカの経済","t":"choice","q":"チョコレートの原料であるカカオを世界有数の規模で生産しているのは、どのあたりの国々か。","c":["ギニア湾岸の国々(ガーナ・コートジボワールなど)","サハラ砂漠の国々","南アフリカ共和国と東アフリカ","地中海沿岸の国々"],"a":0,"e":"世界じゅうに輸出されている。","p":"p.84"},{"id":"soc045","s":"soc","u":"アフリカの経済","t":"fill","q":"アフリカで開発が進む、希少金属のことを何というか。","a":["レアメタル"],"e":"銅・金・ダイヤモンドなどの鉱産資源も豊か。","p":"p.84"},{"id":"soc046","s":"soc","u":"アフリカの経済","t":"fill","q":"特定の農産物や鉱産資源などの輸出に頼る経済を何というか。","a":["モノカルチャー経済"],"e":"工業化がなかなか進まない課題がある。","p":"p.85"},{"id":"soc047","s":"soc","u":"アフリカの経済","t":"essay","q":"モノカルチャー経済の課題と、そこからぬけ出すために必要なことを説明しなさい。","a":"天候による不作や国際価格の変動で収入が不安定になり、工業化が進まず貧富の差が拡大しやすい。そこからぬけ出すには、工業をはじめ多様な産業を育てることが必要。","r":["収入が不安定(不作・価格の変動)","貧富の差が拡大しやすい","工業など多様な産業を育てる"],"e":"モザンビークはアルミニウムを生産する工場を建設した。","p":"p.85"},{"id":"soc048","s":"soc","u":"アフリカの経済","t":"choice","q":"フェアトレードの説明として正しいものはどれか。","c":["生産者の労働に見合う適正な価格で、継続的に取り引きする仕組み","できるだけ安く買う仕組み","農産物の輸出を禁止する仕組み","関税をなくす仕組み"],"a":0,"e":"環境や生産者の生活に配慮する取り組み。","p":"p.85"},{"id":"soc049","s":"soc","u":"アフリカの社会と国際協力","t":"choice","q":"アフリカの都市で人口が急増して起きている問題はどれか。","c":["スラムがつくられるなどの都市問題","農村の人口が急増する","都市の人口が減る","工場が足りなくなる"],"a":0,"e":"仕事を求めて農村から都市へ移住する若い人々が増えている。","p":"p.86"},{"id":"soc050","s":"soc","u":"アフリカの社会と国際協力","t":"choice","q":"ケニアなどで携帯電話の普及によって可能になったことはどれか。","c":["現金を持たずに送金や支払いができる","鉱産資源の輸出が増える","電気や水道がすべて整備される","鉄道が不要になる"],"a":0,"e":"情報通信網の整備が進み、携帯電話が農村部にも普及した。","p":"p.87"},{"id":"soc051","s":"soc","u":"アフリカの社会と国際協力","t":"fill","q":"アフリカの政治的・経済的な結びつきの強化や、紛争の解決をめざしてつくられた国際組織を何というか。","a":["アフリカ連合","AU"],"e":"国際連合(国連)など、さまざまな国際協力の取り組みもある。","p":"p.87"},{"id":"soc052","s":"soc","u":"アフリカの社会と国際協力","t":"choice","q":"21世紀になってアフリカで関係を深めている国のうち、最大の貿易相手国になっている国が多いのはどこか。","c":["中国","日本","ブラジル","オーストラリア"],"a":0,"e":"鉱産資源の開発、道路・工場・港湾の建設などで協力している。","p":"p.87"},{"id":"soc053","s":"soc","u":"アフリカの社会と国際協力","t":"essay","q":"アフリカの国々の自立のために日本が行っている協力の例を、「NGO」という言葉を使って説明しなさい。","a":"政府開発援助(ODA)やNGOを通じて、稲の品種開発・栽培指導や、人材育成などの協力を行っている。","r":["政府開発援助(ODA)やNGO","稲の栽培指導・人材育成などの具体例"],"e":"JICAの専門家が稲の栽培を指導している(図7)。","p":"p.87"},{"id":"soc054","s":"soc","u":"北アメリカの自然環境","t":"choice","q":"北アメリカ州の面積・GDPについて正しいものはどれか。","c":["GDPは世界の約28.6%をしめる","面積は世界の約50%","GDPは世界の約2.9%","人口は世界の約40%"],"a":0,"e":"面積約2253万km²(世界の16.6%)、人口約6.0億人(7.5%)、GDP約24.2兆ドル(28.6%)。","p":"p.91"},{"id":"soc055","s":"soc","u":"北アメリカの自然環境","t":"choice","q":"世界最大の島グリーンランドは、どの州に属するか。","c":["北アメリカ州","ヨーロッパ州","アジア州","オセアニア州"],"a":0,"e":"北アメリカ大陸は大西洋・太平洋・メキシコ湾・北極海に面し、カナダ・アメリカ・メキシコなどの国がある。","p":"p.92"},{"id":"soc056","s":"soc","u":"北アメリカの自然環境","t":"choice","q":"カナダとアメリカの面積は、それぞれ日本の何倍以上あるか。","c":["25倍以上","5倍以上","100倍以上","2倍以上"],"a":0,"e":"メキシコから南は中央アメリカの国々がつらなり、カリブ海には多くの島国がある。","p":"p.92"},{"id":"soc057","s":"soc","u":"北アメリカの自然環境","t":"fill","q":"北アメリカの西側に南北に走る、高くけわしい山脈を何というか。","a":["ロッキー山脈"],"e":"東側にはなだらかで低いアパラチア山脈が走る。","p":"p.92"},{"id":"soc058","s":"soc","u":"北アメリカの自然環境","t":"fill","q":"北アメリカの東側に南北に走る、なだらかで低い山脈を何というか。","a":["アパラチア山脈"],"e":"西側にはけわしいロッキー山脈がある。","p":"p.92"},{"id":"soc059","s":"soc","u":"北アメリカの自然環境","t":"fill","q":"北アメリカで、ロッキー山脈とアパラチア山脈のあいだに広がる広大な平原を何というか。","a":["中央平原"],"e":"ミシシッピ川がメキシコ湾に向けて流れている。","p":"p.92"},{"id":"soc060","s":"soc","u":"北アメリカの自然環境","t":"fill","q":"北アメリカの中央平原を流れ、メキシコ湾に注ぐ川を何というか。","a":["ミシシッピ川"],"e":"水上交通のルートとして重要で、穀物や石炭などの貨物船が航行している。","p":"p.92-93"},{"id":"soc061","s":"soc","u":"北アメリカの自然環境","t":"choice","q":"アメリカの気候の分布について正しいものはどれか。","c":["北緯40度より北は冷帯(亜寒帯)が広がり、西経100度より西は乾燥帯、東は温帯が広がる","全域が温帯である","全域が乾燥帯である","南部は寒帯が広がる"],"a":0,"e":"温帯気候であるアメリカ北東部に人口が集中している。","p":"p.92"},{"id":"soc062","s":"soc","u":"北アメリカの自然環境","t":"fill","q":"メキシコ湾やカリブ海に面した地域にしばしば上陸し、強風と大雨で大きな災害を引き起こす熱帯低気圧を何というか。","a":["ハリケーン"],"e":"中央アメリカやカリブ海の島々は主に熱帯気候。","p":"p.93"},{"id":"soc063","s":"soc","u":"北アメリカの歴史と民族","t":"fill","q":"北アメリカに、もともと住んでいた人々を何というか。","a":["先住民"],"e":"狩猟や農業をして生活していた。16世紀にヨーロッパから移民が来て植民地をつくった。","p":"p.93"},{"id":"soc064","s":"soc","u":"北アメリカの歴史と民族","t":"choice","q":"17世紀以降、アフリカから奴隷としてつれてこられた人々は、アメリカの南部やカリブ海の島々で何を栽培したか。","c":["輸出用の綿花やさとうきび","小麦と大豆","茶とコーヒー","米とじゃがいも"],"a":0,"e":"労働力として栽培させられた。","p":"p.93"},{"id":"soc065","s":"soc","u":"北アメリカの歴史と民族","t":"fill","q":"メキシコやカリブ海の島々などから来た、スペイン語を話す人々を何というか。","a":["ヒスパニック"],"e":"アジアからの移民も多くなっている。","p":"p.93"},{"id":"soc066","s":"soc","u":"北アメリカの歴史と民族","t":"fill","q":"さまざまな民族が暮らしている国を何というか。アメリカは世界でも代表的な□国家である。□にあてはまる語句を答えなさい。","a":["多民族"],"e":"19世紀後半以降、世界各地から多くの人々がアメリカへ移住した。","p":"p.93"},{"id":"soc067","s":"soc","u":"北アメリカの歴史と民族","t":"choice","q":"カナダの公用語として正しいものはどれか。","c":["英語とフランス語","英語のみ","スペイン語","フランス語のみ"],"a":0,"e":"中央アメリカではスペイン語が広く話されている。","p":"p.93"},{"id":"soc068","s":"soc","u":"北アメリカの歴史と民族","t":"essay","q":"アメリカが多民族国家になった理由を、歴史にふれて説明しなさい。","a":"もともと先住民が住む土地だったが、16世紀からヨーロッパの移民が植民地をつくり、17世紀以降はアフリカから奴隷がつれてこられ、19世紀後半以降はアメリカの経済発展にともなって世界各地から多くの人々が移住してきたから。","r":["先住民の土地にヨーロッパから移民が来た","アフリカから奴隷がつれてこられた","経済発展で世界各地から移住した"],"e":"近年はヒスパニックやアジア系の移民も多い。","p":"p.93"},{"id":"soc069","s":"soc","u":"北アメリカの農業","t":"fill","q":"農業労働者を雇って経営する、大規模な農業を何というか。","a":["企業的農業"],"e":"かんがい設備や大型の農業機械を使い、少ない人数で広大な農地を管理する。","p":"p.96"},{"id":"soc070","s":"soc","u":"北アメリカの農業","t":"fill","q":"アメリカやカナダで、それぞれの地域の自然環境に適した農産物を生産する農業を何というか。","a":["適地適作"],"e":"ロッキー山脈周辺では肉牛の放牧、東側では小麦・とうもろこし・大豆の栽培や混合農業、冷涼な北部では酪農、温暖な南部では綿花の栽培が行われる。","p":"p.96"},{"id":"soc071","s":"soc","u":"北アメリカの農業","t":"choice","q":"降水量の少ないロッキー山脈の周辺で盛んな農業はどれか。","c":["肉牛の放牧","稲作","酪農","野菜の促成栽培"],"a":0,"e":"年降水量に着目して整理するとよい。","p":"p.96"},{"id":"soc072","s":"soc","u":"北アメリカの農業","t":"fill","q":"農業機械・種子・農薬・化学肥料などの開発や、農産物の生産・流通・販売にかかわる企業活動を何というか。","a":["アグリビジネス"],"e":"農産物の生産量を増やし、高い作業効率を実現するための開発を進めている。","p":"p.97"},{"id":"soc073","s":"soc","u":"北アメリカの農業","t":"fill","q":"アグリビジネスを行う企業のうち、穀物を主にあつかう大企業を何というか。","a":["穀物メジャー"],"e":"世界の穀物市場に大きな影響力をもつ。","p":"p.97"},{"id":"soc074","s":"soc","u":"北アメリカの農業","t":"fill","q":"アメリカやカナダは、小麦・とうもろこし・大豆の輸出量が非常に多く、世界の食料供給を支えている。このことから、北アメリカは世界の□とよばれる。□にあてはまる語句を答えなさい。","a":["食料庫"],"e":"「世界の食料庫」。","p":"p.97"},{"id":"soc075","s":"soc","u":"北アメリカの農業","t":"essay","q":"アメリカが、世界の「食料庫」といわれるほど多くの農産物を生産・輸出できる理由を説明しなさい。","a":"中央平原などの広い農地で、大型の機械やかんがい設備を使った企業的農業を行い、それぞれの地域の自然環境に適した農産物を生産(適地適作)し、アグリビジネスや穀物メジャーなどの企業が生産・流通を担っているから。","r":["広大な農地・大型機械(企業的農業)","適地適作","アグリビジネス・穀物メジャーなどの企業"],"e":"「企業的農業」「適地適作」の語を使う。","p":"p.96-97"},{"id":"soc076","s":"soc","u":"北アメリカの農業","t":"choice","q":"垂直農法の説明として正しいものはどれか。","c":["高層ビルや倉庫の中で、垂直に農地を積み上げる農法で、ICTで光・温度・水などを管理する","広い農地で大型機械を使う農法","焼畑を行う農法","牛を放牧する農法"],"a":0,"e":"水の使用量が大幅に減り、都市部でも農産物の生産ができる。","p":"p.94"},{"id":"soc077","s":"soc","u":"北アメリカの工業","t":"choice","q":"19世紀後半に、五大湖周辺で重工業が発達した理由として本文に書かれているのはどれか。","c":["鉄鉱石や石炭の産地に近く、水運や鉄道輸送の面で便利だった","石油が豊富だったから","気候が温暖だったから","労働者の賃金が安かったから"],"a":0,"e":"鉄鋼業などの重工業が発達した。","p":"p.98"},{"id":"soc078","s":"soc","u":"北アメリカの工業","t":"fill","q":"20世紀に、流れ作業による大量生産方式を取り入れた自動車工業が始まった都市はどこか。","a":["デトロイト"],"e":"自動車は世界じゅうで爆発的に売れ、アメリカは世界の工業をリードする国になった。","p":"p.98"},{"id":"soc079","s":"soc","u":"北アメリカの工業","t":"choice","q":"20世紀後半に、アメリカの重工業や自動車工業の競争力が低下した理由はどれか。","c":["日本やドイツ、韓国、中国などで工業が発展し、安くて高品質の工業製品が作られるようになったから","資源が足りなくなったから","人口が減ったから","工場が火事になったから"],"a":0,"e":"重工業や自動車工業に代わり、先端技術(ハイテク)産業が中心になった。","p":"p.98"},{"id":"soc080","s":"soc","u":"北アメリカの工業","t":"fill","q":"アメリカの北緯37度より南の温暖な地域に位置する、ハイテク産業が盛んな地域を何というか。","a":["サンベルト"],"e":"重工業の中心だった地域よりも南にある。","p":"p.99"},{"id":"soc081","s":"soc","u":"北アメリカの工業","t":"fill","q":"サンフランシスコ南部にある、ICT関連の企業が多く集まる地域を何というか。","a":["シリコンバレー"],"e":"中国系やインド系など、世界じゅうから来た人々が働いている。","p":"p.99"},{"id":"soc082","s":"soc","u":"北アメリカの工業","t":"essay","q":"サンベルトでハイテク産業が発達した理由を説明しなさい。","a":"気候が温暖で土地が安く、豊富な労働力にめぐまれているから。","r":["気候が温暖","土地が安い","豊富な労働力"],"e":"重工業の中心地より南に移動した。","p":"p.99"},{"id":"soc083","s":"soc","u":"北アメリカの工業","t":"essay","q":"アメリカ・カナダ・メキシコの3か国が、貿易を自由にしたことで、工場にどのような変化が起きたか説明しなさい。","a":"賃金の安いメキシコで作った工業製品を、アメリカやカナダに輸出しやすくなり、多くの工場がアメリカやカナダからメキシコへ移転した。","r":["賃金の安いメキシコの工業製品が輸出しやすくなった","工場がアメリカやカナダからメキシコへ移った"],"e":"アメリカ国内では、研究開発や製品の企画立案を行うことが多くなった。","p":"p.99"},{"id":"soc084","s":"soc","u":"北アメリカの工業","t":"choice","q":"アメリカの航空機・宇宙産業の発展が、のちに結び付いた分野はどれか。","c":["情報通信技術(ICT)やソフトウェア開発","農業","繊維産業","造船業"],"a":0,"e":"NASAが設立され、宇宙開発が進められた。","p":"p.98"},{"id":"soc085","s":"soc","u":"北アメリカの文化と社会","t":"choice","q":"アメリカで広く使われ、世界じゅうのビジネスでも使われて共通言語のような役割を果たしている言語はどれか。","c":["英語","スペイン語","フランス語","中国語"],"a":0,"e":"アメリカの文化は世界各地で広く受け入れられている。","p":"p.100"},{"id":"soc086","s":"soc","u":"北アメリカの文化と社会","t":"choice","q":"アメリカで生まれた企業や文化として、本文に書かれているものはどれか。","c":["ファーストフードのチェーン店やインターネット、SNS","鉄道の自動運転システム","和食のチェーン店","伝統工芸"],"a":0,"e":"ICT関連の多国籍企業が開発した。","p":"p.100-101"},{"id":"soc087","s":"soc","u":"北アメリカの文化と社会","t":"choice","q":"2009年にアメリカで初めて就任した大統領はどのような人か。","c":["アフリカ系の大統領","アジア系の大統領","女性の大統領","ヒスパニック系の大統領"],"a":0,"e":"移民の増加などで民族の多様化が進んでいる。","p":"p.101"},{"id":"soc088","s":"soc","u":"北アメリカの文化と社会","t":"essay","q":"アメリカの文化・サービス・製品が、世界じゅうに受け入れられた理由を説明しなさい。","a":"アメリカは世界最大の経済規模をもち、英語が世界の共通言語のような役割を果たしている。また、企業が自社の技術や製品を世界に普及させ、大きな利益を得ているから。","r":["経済規模が世界最大/英語の役割","企業が技術・製品を世界に普及させた"],"e":"映画、音楽、スポーツ、ファーストフード、SNSなど。","p":"p.100-101"},{"id":"soc089","s":"soc","u":"持続可能な社会へ","t":"fill","q":"広い国土で、自動車なしでは生活が成り立たない社会を何というか。","a":["自動車社会"],"e":"アメリカやカナダでは、通勤・買い物・旅行など、日常生活の広い範囲に自動車が使われている。","p":"p.102"},{"id":"soc090","s":"soc","u":"持続可能な社会へ","t":"fill","q":"新しい製品を安く大量に生産・販売し、消費する生活スタイルを何というか。","a":["大量生産・大量消費","大量生産大量消費"],"e":"産業を発展させる一方で、大量の廃棄物を生み出す。","p":"p.102"},{"id":"soc091","s":"soc","u":"持続可能な社会へ","t":"choice","q":"アメリカの大量生産・大量消費の生活スタイルの問題点として正しいものはどれか。","c":["多くの資源やエネルギーを使い、大量の廃棄物を生み出す","資源やエネルギーが不足しない","廃棄物がほとんど出ない","人々の生活が不便になる"],"a":0,"e":"廃棄物や資源・エネルギーの利用や管理にも課題が多い。","p":"p.102-103"},{"id":"soc092","s":"soc","u":"持続可能な社会へ","t":"choice","q":"アメリカで、再生可能エネルギーの発電を支援する政策が進められた結果、どのような変化が起きたか。","c":["関連産業で働く人が増加した","関連産業で働く人が減少した","電力の使用量が増えた","石油の輸入が減った"],"a":0,"e":"持続可能な社会をつくるうえで影響力をもつ。","p":"p.103"},{"id":"soc093","s":"soc","u":"持続可能な社会へ","t":"fill","q":"ガラスびんやペットボトルを販売するときに預り金を徴収し、使用後に容器を店に返却すると返金されるしくみを何というか。","a":["デポジット制","デポジット"],"e":"リサイクルを促進するしくみ。","p":"p.103"},{"id":"soc094","s":"soc","u":"持続可能な社会へ","t":"essay","q":"アメリカが持続可能な社会をつくるために行っている取り組みの例を、2つ説明しなさい。","a":"再生可能エネルギーによる発電を支援する政策を進めている。また、びんやペットボトルの預り金制度(デポジット制)でリサイクルを促進し、ファーストフード店ではプラスチック製のストローを廃止している。","r":["再生可能エネルギーの支援","デポジット制・リサイクル","ストロー廃止などの取り組み"],"e":"ほかに、電動キックスケーターのシェアなどICTで交通問題を解決する動きもある。","p":"p.103"},{"id":"soc095","s":"soc","u":"持続可能な社会へ","t":"choice","q":"アメリカの企業が最初に大規模に開発・販売を始めた、走行中に二酸化炭素を排出しない自動車はどれか。","c":["電気自動車","ガソリン車","ディーゼル車","ハイブリッド車"],"a":0,"e":"ガソリンの消費を減らすため、新たな税金や法律を設ける動きもある。","p":"p.94"},{"id":"soc096","s":"soc","u":"北アメリカの農業","t":"choice","q":"パナマ運河は、どの海を結んでいるか。","c":["太平洋とカリブ海","太平洋と大西洋(北部)","カリブ海とメキシコ湾","大西洋とインド洋"],"a":0,"e":"閘門式の運河で、年間約1万4000隻の船舶が通行する。","p":"p.90"},{"id":"jpn001","s":"jpn","u":"シジュウカラ(読解)","t":"essay","q":"筆者は、どのような観察を基に「ジャージャー」についての仮説を立てたか。簡潔にまとめなさい。","x":"【本文の要点】\nシジュウカラの親鳥は、卵やひなを襲う天敵のうち、カラスやネコなどには「ピーツピ」と鳴くのに対し、ヘビにだけは「ジャージャー」と鳴く。鳴き声をコンピュータで分析しても、その違いは明らかだった。筆者はこの観察から、「ジャージャー」は、警戒すべき対象としての「ヘビ」を意味する「単語」になっているのではないか、という仮説を立てた。ここでの「単語」とは、「ヘビ」や「タカ」などの警戒すべき対象を表す、一つ一つの鳴き声のことである。","a":"シジュウカラの親鳥は、卵やひなを襲う天敵のうち、カラスやネコなどには「ピーツピ」と鳴くのに対し、ヘビにだけは「ジャージャー」と鳴く。鳴き声をコンピュータで分析しても、その違いは明らかだった。","r":["ヘビにだけ「ジャージャー」と鳴く","カラスやネコには「ピーツピ」と鳴く","鳴き声の違いは分析でも明らか"],"e":"学びへの扉 1②。この観察から仮説を立てた。","p":"p.130"},{"id":"jpn002","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"筆者が立てた仮説はどれか。","x":"【本文の要点】\nシジュウカラの親鳥は、卵やひなを襲う天敵のうち、カラスやネコなどには「ピーツピ」と鳴くのに対し、ヘビにだけは「ジャージャー」と鳴く。鳴き声をコンピュータで分析しても、その違いは明らかだった。筆者はこの観察から、「ジャージャー」は、警戒すべき対象としての「ヘビ」を意味する「単語」になっているのではないか、という仮説を立てた。ここでの「単語」とは、「ヘビ」や「タカ」などの警戒すべき対象を表す、一つ一つの鳴き声のことである。","c":["「ジャージャー」という鳴き声は、「ヘビ」を意味する「単語」になっているのではないか","「ジャージャー」は、ヘビに対する恐怖心の表れではないか","シジュウカラの鳴き声には意味がないのではないか","ヘビは「ジャージャー」という鳴き声が苦手なのではないか"],"a":0,"e":"仮説は、観察から立てた「~ではないか」という考え。","p":"p.130"},{"id":"jpn003","s":"jpn","u":"シジュウカラ(読解)","t":"essay","q":"筆者は、ここでの「単語」をどのように定義しているか。","x":"【本文の要点】\nシジュウカラの親鳥は、卵やひなを襲う天敵のうち、カラスやネコなどには「ピーツピ」と鳴くのに対し、ヘビにだけは「ジャージャー」と鳴く。鳴き声をコンピュータで分析しても、その違いは明らかだった。筆者はこの観察から、「ジャージャー」は、警戒すべき対象としての「ヘビ」を意味する「単語」になっているのではないか、という仮説を立てた。ここでの「単語」とは、「ヘビ」や「タカ」などの警戒すべき対象を表す、一つ一つの鳴き声のことである。","a":"「ヘビ」や「タカ」といった、警戒すべき対象を意味する、一つ一つの鳴き声。","r":["「ヘビ」や「タカ」などの特定の対象を示す","一つ一つの鳴き声"],"e":"「単語」の定義を決めたうえで、仮説を検証している。","p":"p.130"},{"id":"jpn004","s":"jpn","u":"シジュウカラ(読解)","t":"essay","q":"筆者は、シジュウカラがヘビを見たときに鳴く状況を観察するだけでなく、鳴き声だけを聞かせる実験を行った。その理由を説明しなさい。","x":"【本文の要点】\nヘビを見たシジュウカラが「ジャージャー」と鳴く様子は観察できる。しかし、それだけでは、ヘビの存在を仲間に伝えるために鳴いているのか、単なる恐怖心から鳴いているのかが区別できず、鳴き声の意味を確かめることはできない。","a":"ヘビを見て鳴いている状況では、ヘビの存在を仲間に伝えるために鳴いているのか、単なる恐怖心から鳴いているのかが区別できないから。","r":["観察だけでは意味を確かめられない","伝えるためか恐怖心からか区別できない","鳴き声を聞いた側の行動を調べる"],"e":"鳴き声を聞いたシジュウカラが、どのように振る舞うかを調べた。","p":"p.130"},{"id":"jpn005","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"検証1で、鳴き声を聞かせた実験の方法として正しいものはどれか。","x":"【本文の要点】\n【検証1】ヘビのいない状況で、録音した「ジャージャー」を、巣箱をかけた木の近くのスピーカーから流し、シジュウカラの行動の変化を観察した。比較のために、「ピーツピ」を流した場合と、鳴き声を流さない場合も調べた。\n結果:「ジャージャー」を聞いたほとんどのシジュウカラが地面をじっと見下ろし、一部は巣箱の穴をのぞいた。「ピーツピ」では、ほとんどが首を左右に振って周囲を警戒した。鳴き声を流さなかったときは、ほとんど反応しなかった。","c":["ヘビのいない状況で、録音した「ジャージャー」をスピーカーから流した","ヘビを巣箱に近づけて、「ジャージャー」と鳴かせた","ヘビの模型を見せながら観察した","巣箱を地面に置いて鳴き声を聞かせた"],"a":0,"e":"巣箱の周辺で、シジュウカラの行動の変化を観察した。","p":"p.131"},{"id":"jpn006","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"検証1で、「ジャージャー」を聞いたシジュウカラの行動として正しいものはどれか。","x":"【本文の要点】\n【検証1】ヘビのいない状況で、録音した「ジャージャー」を、巣箱をかけた木の近くのスピーカーから流し、シジュウカラの行動の変化を観察した。比較のために、「ピーツピ」を流した場合と、鳴き声を流さない場合も調べた。\n結果:「ジャージャー」を聞いたほとんどのシジュウカラが地面をじっと見下ろし、一部は巣箱の穴をのぞいた。「ピーツピ」では、ほとんどが首を左右に振って周囲を警戒した。鳴き声を流さなかったときは、ほとんど反応しなかった。","c":["地面をじっと見下ろしたり、巣箱の穴をのぞいたりした","首を左右に振って周囲を警戒した","巣箱から飛び立って遠くへ逃げた","ほとんど反応しなかった"],"a":0,"e":"グラフ1。「ピーツピ」では左右を警戒、鳴き声なしではほとんど反応しなかった(グラフ2・3)。","p":"p.131"},{"id":"jpn007","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"検証1で、「ピーツピ」を聞かせたとき、多くのシジュウカラはどう行動したか。","x":"【本文の要点】\n【検証1】ヘビのいない状況で、録音した「ジャージャー」を、巣箱をかけた木の近くのスピーカーから流し、シジュウカラの行動の変化を観察した。比較のために、「ピーツピ」を流した場合と、鳴き声を流さない場合も調べた。\n結果:「ジャージャー」を聞いたほとんどのシジュウカラが地面をじっと見下ろし、一部は巣箱の穴をのぞいた。「ピーツピ」では、ほとんどが首を左右に振って周囲を警戒した。鳴き声を流さなかったときは、ほとんど反応しなかった。","c":["首を左右に振り、周囲を警戒した","地面を確認した","巣箱の穴をのぞいた","ほとんど反応しなかった"],"a":0,"e":"カラスやネコなどを警戒するときの鳴き声。","p":"p.131"},{"id":"jpn008","s":"jpn","u":"シジュウカラ(読解)","t":"essay","q":"検証1のあと、筆者が「検証2」を行う必要があったのはなぜか。","x":"【本文の要点】\n【検証1】ヘビのいない状況で、録音した「ジャージャー」を、巣箱をかけた木の近くのスピーカーから流し、シジュウカラの行動の変化を観察した。比較のために、「ピーツピ」を流した場合と、鳴き声を流さない場合も調べた。\n結果:「ジャージャー」を聞いたほとんどのシジュウカラが地面をじっと見下ろし、一部は巣箱の穴をのぞいた。「ピーツピ」では、ほとんどが首を左右に振って周囲を警戒した。鳴き声を流さなかったときは、ほとんど反応しなかった。\n※検証1の結果は、「地面や巣箱を確認しろ」という命令を聞いて行動した、という可能性とも矛盾しない。","a":"検証1の結果だけでは、「ジャージャー」が「地面や巣箱を確認しろ」という命令を意味する可能性が残り、鳴き声を聞いたシジュウカラが実際にヘビの姿をイメージしているかどうかが確かめられなかったから。","r":["検証1では「ヘビ」の姿を思い描いているかまでは分からない","「確認しろ」という命令の可能性が残る","ヘビの姿をイメージしているか調べるため"],"e":"学びへの扉 2②。","p":"p.132"},{"id":"jpn009","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"検証2で、小枝を「ヘビ」に見立てるために行った操作はどれか。","x":"【本文の要点】\n【検証2】長さ20cmほどの小枝にひもを付け、木の幹に沿ってぶら下げた。スピーカーから「ジャージャー」を流しながら、遠くからひもをゆっくり引き、小枝をヘビのように幹をはい上らせた。\n結果:「ジャージャー」を聞いたシジュウカラのほとんどが、小枝に近づいて確かめた。「ジャージャー」以外の鳴き声を聞かせると、近づくものはほとんどいなかった。また、「ジャージャー」を流しながら小枝を大きく左右に揺らし、ヘビに似ていない動きで見せた場合も、近づくものはほとんどいなかった。","c":["ひもで小枝を引き上げ、幹をはい上るヘビのように動かした","小枝を地面に置いて動かさなかった","小枝を木の上から落とした","小枝に鳴き声を録音した機械をつけた"],"a":0,"e":"20cmほどの小枝をひもで木の幹に沿ってぶら下げた。","p":"p.133"},{"id":"jpn010","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"検証2で、「ジャージャー」を聞かせながら、小枝を大きく左右に揺らしてヘビに似ていない動きで見せたとき、結果はどうなったか。","x":"【本文の要点】\n【検証2】長さ20cmほどの小枝にひもを付け、木の幹に沿ってぶら下げた。スピーカーから「ジャージャー」を流しながら、遠くからひもをゆっくり引き、小枝をヘビのように幹をはい上らせた。\n結果:「ジャージャー」を聞いたシジュウカラのほとんどが、小枝に近づいて確かめた。「ジャージャー」以外の鳴き声を聞かせると、近づくものはほとんどいなかった。また、「ジャージャー」を流しながら小枝を大きく左右に揺らし、ヘビに似ていない動きで見せた場合も、近づくものはほとんどいなかった。","c":["小枝に近づくシジュウカラはほとんどいなかった","多くのシジュウカラが小枝に近づいた","シジュウカラはすべて逃げた","小枝をくちばしでつついた"],"a":0,"e":"グラフ5。ヘビに似た動きにだけ反応した。","p":"p.133"},{"id":"jpn011","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"検証2で、ヘビに似た動きの小枝を見せながら「ジャージャー」以外の鳴き声を聞かせたとき、小枝に近づいたシジュウカラはどうだったか。","x":"【本文の要点】\n【検証2】長さ20cmほどの小枝にひもを付け、木の幹に沿ってぶら下げた。スピーカーから「ジャージャー」を流しながら、遠くからひもをゆっくり引き、小枝をヘビのように幹をはい上らせた。\n結果:「ジャージャー」を聞いたシジュウカラのほとんどが、小枝に近づいて確かめた。「ジャージャー」以外の鳴き声を聞かせると、近づくものはほとんどいなかった。また、「ジャージャー」を流しながら小枝を大きく左右に揺らし、ヘビに似ていない動きで見せた場合も、近づくものはほとんどいなかった。","c":["ほとんどいなかった","ほぼすべてが近づいた","半数が近づいた","全員が逃げた"],"a":0,"e":"グラフ4。「ジャージャー」を聞かせたときだけ多くが近づいた。","p":"p.133"},{"id":"jpn012","s":"jpn","u":"シジュウカラ(読解)","t":"essay","q":"筆者が「ジャージャー」は「ヘビ」を意味する「単語」であると結論づけた根拠を、二つの実験の結果をふまえて説明しなさい。","x":"【本文の要点】\n検証1:「ジャージャー」を聞くと、地面や巣箱を確認した。\n検証2:「ジャージャー」を聞くと、ヘビに似た動きの小枝に近づいて確かめたが、ほかの鳴き声や、ヘビに似ていない動きの小枝には、ほとんど反応しなかった。","a":"検証1で「ジャージャー」を聞くと地面や巣箱を確認し、検証2でもヘビに似た動きの小枝に近づいたことから、鳴き声を聞いたシジュウカラはヘビの姿をイメージし、ヘビを探す行動を取るとわかったから。","r":["検証1の結果(地面や巣箱の確認)","検証2の結果(ヘビに似た小枝に近づく)","ヘビの姿をイメージしている"],"e":"「~を根拠とすることで」の形で説明できる。","p":"p.134"},{"id":"jpn013","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"この文章の構成として正しいものはどれか。","c":["観察→仮説→検証1→検証2→結論","結論→仮説→検証1→検証2→観察","仮説→結論→検証1→検証2→観察","検証1→検証2→観察→仮説→結論"],"a":0,"e":"学びへの扉 1。仮説の検証を重ねて結論を導く構成。","p":"p.136"},{"id":"jpn014","s":"jpn","u":"シジュウカラ(読解)","t":"essay","q":"この文章の構成や展開の効果を、「〇〇を根拠とすることで」の形で説明しなさい。","x":"【本文の要点】\n二つの実験の結果から、「ジャージャー」を聞いたシジュウカラはヘビの姿をイメージし、ヘビを探すときに役立つ特別な行動を取ることがわかった。ここから、「ジャージャー」は「ヘビ」を意味する「単語」であると結論づけられる。\n研究者のあいだでは、長年、「言葉」をもつのは人間だけで、動物の鳴き声は「怒り」や「喜び」などの感情の表れにすぎないと考えられてきた。そのため、動物の鳴き声の詳しい研究は進んでいなかった。\n今回の研究で、シジュウカラにはヘビを示す「単語」があることがわかった。さらに、複数の「単語」を組み合わせて、より複雑なメッセージを伝えていることも実証された。人間以外で、複数の「単語」を組み合わせる能力が実証されたのは、シジュウカラが初めてである。","a":"二つの実験の結果を根拠とすることで、「ジャージャー」が「ヘビ」を意味する「単語」であるという結論に説得力が出ている。","r":["「根拠」となる事実を示している","二つの実験(検証1・2)にふれている","結論の説得力が高まっている"],"e":"学びへの扉 2③。","p":"p.136"},{"id":"jpn015","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"研究者のあいだで、長年信じられてきたこととして正しいものはどれか。","x":"【本文の要点】\n二つの実験の結果から、「ジャージャー」を聞いたシジュウカラはヘビの姿をイメージし、ヘビを探すときに役立つ特別な行動を取ることがわかった。ここから、「ジャージャー」は「ヘビ」を意味する「単語」であると結論づけられる。\n研究者のあいだでは、長年、「言葉」をもつのは人間だけで、動物の鳴き声は「怒り」や「喜び」などの感情の表れにすぎないと考えられてきた。そのため、動物の鳴き声の詳しい研究は進んでいなかった。\n今回の研究で、シジュウカラにはヘビを示す「単語」があることがわかった。さらに、複数の「単語」を組み合わせて、より複雑なメッセージを伝えていることも実証された。人間以外で、複数の「単語」を組み合わせる能力が実証されたのは、シジュウカラが初めてである。","c":["「言葉」をもつのは人間だけで、動物の鳴き声は単なる感情の表れである","動物も人間と同じ言葉をもつ","鳥の鳴き声はすべて意味をもつ","動物の鳴き声の研究はすでに十分に進んでいる"],"a":0,"e":"そのため、動物の鳴き声の詳しい研究は十分に進められてこなかった。","p":"p.134"},{"id":"jpn016","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"今回の研究を経て、シジュウカラについて新たにわかったこととして正しいものはどれか。","x":"【本文の要点】\n二つの実験の結果から、「ジャージャー」を聞いたシジュウカラはヘビの姿をイメージし、ヘビを探すときに役立つ特別な行動を取ることがわかった。ここから、「ジャージャー」は「ヘビ」を意味する「単語」であると結論づけられる。\n研究者のあいだでは、長年、「言葉」をもつのは人間だけで、動物の鳴き声は「怒り」や「喜び」などの感情の表れにすぎないと考えられてきた。そのため、動物の鳴き声の詳しい研究は進んでいなかった。\n今回の研究で、シジュウカラにはヘビを示す「単語」があることがわかった。さらに、複数の「単語」を組み合わせて、より複雑なメッセージを伝えていることも実証された。人間以外で、複数の「単語」を組み合わせる能力が実証されたのは、シジュウカラが初めてである。","c":["複数の「単語」を組み合わせて、より複雑なメッセージを伝えている","人間の言葉を理解している","1年を通して同じ鳴き声しか出さない","ヘビを見ても警戒しない"],"a":0,"e":"人間以外で複数の単語を組み合わせる能力が実証されたのは、シジュウカラが初めて。","p":"p.135"},{"id":"jpn017","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"表で、「ピーツピ」を聞いたシジュウカラの反応と意味の組み合わせとして正しいものはどれか。","x":"【鳴き声の表(要点)】\n鳴き声:ツツピー ツツピー(さえずり)/状況:春先に繁殖のための縄張りをつくるとき(鳴くのはオスのみ)/反応:オスは縄張り争い、メスはオスの魅力を評価/意味:縄張りに入るな・つがいになろう\n鳴き声:ピーツピ/状況:カラスやネコを発見/反応:周囲を確認/意味:警戒しろ\n鳴き声:チッチッ/状況:遠くに飛んでいくときなど/反応:音源を見る/意味:こっちを見て\n鳴き声:ヂヂヂヂヂ/状況:仲間からはぐれたときなど/反応:音源に接近/意味:集まれ\n鳴き声:ジャージャー/状況:ヘビを発見/反応:地面や巣箱を確認/意味:ヘビ","c":["周囲を確認する・警戒しろ","地面や巣箱を確認する・ヘビ","音源を見る・こっちを見て","音源に接近する・集まれ"],"a":0,"e":"カラスやネコを発見したときの鳴き声。","p":"p.134"},{"id":"jpn018","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"表で、「チッチッ」の意味はどれか。","x":"【鳴き声の表(要点)】\n鳴き声:ツツピー ツツピー(さえずり)/状況:春先に繁殖のための縄張りをつくるとき(鳴くのはオスのみ)/反応:オスは縄張り争い、メスはオスの魅力を評価/意味:縄張りに入るな・つがいになろう\n鳴き声:ピーツピ/状況:カラスやネコを発見/反応:周囲を確認/意味:警戒しろ\n鳴き声:チッチッ/状況:遠くに飛んでいくときなど/反応:音源を見る/意味:こっちを見て\n鳴き声:ヂヂヂヂヂ/状況:仲間からはぐれたときなど/反応:音源に接近/意味:集まれ\n鳴き声:ジャージャー/状況:ヘビを発見/反応:地面や巣箱を確認/意味:ヘビ","c":["こっちを見て","集まれ","ヘビ","縄張りに入るな"],"a":0,"e":"遠くに飛んでいくときなどに発する鳴き声。","p":"p.134"},{"id":"jpn019","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"表で、仲間とはぐれたときなどに発し、聞いた仲間が音源に接近する鳴き声(ヂヂヂヂヂ)の意味はどれか。","x":"【鳴き声の表(要点)】\n鳴き声:ツツピー ツツピー(さえずり)/状況:春先に繁殖のための縄張りをつくるとき(鳴くのはオスのみ)/反応:オスは縄張り争い、メスはオスの魅力を評価/意味:縄張りに入るな・つがいになろう\n鳴き声:ピーツピ/状況:カラスやネコを発見/反応:周囲を確認/意味:警戒しろ\n鳴き声:チッチッ/状況:遠くに飛んでいくときなど/反応:音源を見る/意味:こっちを見て\n鳴き声:ヂヂヂヂヂ/状況:仲間からはぐれたときなど/反応:音源に接近/意味:集まれ\n鳴き声:ジャージャー/状況:ヘビを発見/反応:地面や巣箱を確認/意味:ヘビ","c":["集まれ","警戒しろ","ヘビ","こっちを見て"],"a":0,"e":"","p":"p.134"},{"id":"jpn020","s":"jpn","u":"シジュウカラ(読解)","t":"choice","q":"表で、春先に繁殖のための縄張りをつくるとき、オスだけが鳴く「ツツピー ツツピー」は何というか。","x":"【鳴き声の表(要点)】\n鳴き声:ツツピー ツツピー(さえずり)/状況:春先に繁殖のための縄張りをつくるとき(鳴くのはオスのみ)/反応:オスは縄張り争い、メスはオスの魅力を評価/意味:縄張りに入るな・つがいになろう\n鳴き声:ピーツピ/状況:カラスやネコを発見/反応:周囲を確認/意味:警戒しろ\n鳴き声:チッチッ/状況:遠くに飛んでいくときなど/反応:音源を見る/意味:こっちを見て\n鳴き声:ヂヂヂヂヂ/状況:仲間からはぐれたときなど/反応:音源に接近/意味:集まれ\n鳴き声:ジャージャー/状況:ヘビを発見/反応:地面や巣箱を確認/意味:ヘビ","c":["さえずり","地鳴き","警戒音","集合音"],"a":0,"e":"「縄張りに入るな」「つがいになろう」という意味。","p":"p.134"},{"id":"jpn021","s":"jpn","u":"シジュウカラ(語句・漢字)","t":"choice","q":"「レパートリー」の意味として正しいものはどれか。","c":["いつでも演じられるように用意してある演目や曲目。転じて、いつでもこなせる範囲や領域","新しく作られた曲目","一度だけ演じる出し物","観客に見せる舞台装置"],"a":0,"e":"鳴き声のレパートリー=鳴き声の種類が多いこと。","p":"p.128"},{"id":"jpn022","s":"jpn","u":"シジュウカラ(語句・漢字)","t":"choice","q":"「仮説」の意味として正しいものはどれか。","c":["ある現象を説明するために、仮に立てる説","実験の結果として得られた事実","結論として確定した考え","他人から聞いた意見"],"a":0,"e":"「学習で用いる言葉」。","p":"p.137"},{"id":"jpn023","s":"jpn","u":"シジュウカラ(語句・漢字)","t":"choice","q":"「検証」の意味として正しいものはどれか。","c":["実験や観察などによって得た事実と照合し、仮説を証明すること","仮に立てた考え","結果を予想すること","人の意見を聞くこと"],"a":0,"e":"「学習で用いる言葉」。","p":"p.137"},{"id":"jpn024","s":"jpn","u":"シジュウカラ(語句・漢字)","t":"choice","q":"「耳を澄ます」の意味として正しいものはどれか。","c":["注意して、よく聞こうとする","大きな音を出す","耳をふさぐ","話をさえぎる"],"a":0,"e":"「よく耳を澄ますと、…気がつきます」。","p":"p.128"},{"id":"jpn025","s":"jpn","u":"シジュウカラ(語句・漢字)","t":"essay","q":"「仮説」と「予想」のちがいを考え、自分の言葉で説明しなさい。","a":"仮説は、観察などの事実を基に立てた、検証が必要な考え。予想は、なんとなくこうなるだろうと見通しを立てること。","r":["仮説:観察などを基に仮に立てた説","予想:こうなるだろうと見通すこと"],"e":"言葉ポケット。基にする事実の有無や、検証するかどうかがちがい。","p":"p.137"},{"id":"jpn026","s":"jpn","u":"意見と根拠","t":"choice","q":"「根拠」の説明として正しいものはどれか。","c":["意見の正しさや有効性を証明するもの","自分の感想","意見をまとめた結論","人から聞いた噂話"],"a":0,"e":"意見を述べるときは、根拠を明確に示す必要がある。","p":"p.138"},{"id":"jpn027","s":"jpn","u":"意見と根拠","t":"choice","q":"「理由づけ」の説明として正しいものはどれか。","c":["根拠が意見とどのように結び付くのかを説明すること","意見をくり返すこと","根拠を集めること","結論を述べること"],"a":0,"e":"無理のない理由づけは、意見の説得力を高める。","p":"p.139"},{"id":"jpn028","s":"jpn","u":"意見と根拠","t":"choice","q":"根拠として示すのにふさわしいものはどれか。","c":["誰が見ても変わらない、正確で客観的な事実","個人の考えや好み","人によって異なる考え","予想や期待"],"a":0,"e":"根拠は意見の信頼性を高めるためにある。","p":"p.138"},{"id":"jpn029","s":"jpn","u":"意見と根拠","t":"essay","q":"「猫のほうが、かわいい」を根拠にして「探偵は猫を飼うべきだ」という意見を述べても、説得力がない。その理由を説明しなさい。","a":"「かわいい」は人によって感じ方が異なる考えであって、誰が見ても変わらない事実ではなく、「犬のほうがかわいい」と思う人は説得できないから。","r":["「かわいい」は人によってちがう","客観的な事実ではない"],"e":"「考え」を根拠にした場合。「猫は散歩をさせなくてもよい」は事実。","p":"p.138"},{"id":"jpn030","s":"jpn","u":"意見と根拠","t":"essay","q":"同じ根拠(猫は散歩をさせなくてもよい)から、異なる意見が導かれることがある。それはなぜか。","a":"根拠と意見を結び付ける理由づけが異なるから。例えば、仕事で家を空けることが多いと散歩が難しいから猫を、体力があって散歩で体をきたえたいから犬を、というように理由づけで意見が変わる。","r":["理由づけがちがう","理由づけの具体例にふれている"],"e":"理由づけによっては、同じ根拠から異なる意見が導かれる。","p":"p.139"},{"id":"jpn031","s":"jpn","u":"意見と根拠","t":"choice","q":"意見を聞いたり伝えたりするときの「チェックポイント」として挙げられているものはどれか。","c":["根拠が示されているか/正確で客観的な事実を根拠にしているか/理由づけに無理はないか","言葉づかいは丁寧か/声は大きいか/話が短いか","主語が省略されていないか/文末が統一されているか","人数が多いか/長く話しているか/経験があるか"],"a":0,"e":"3点を確認する。","p":"p.139"},{"id":"jpn032","s":"jpn","u":"意見と根拠","t":"essay","q":"「伝統文化は大切にすべきだ。なぜなら、とても大事なものだからだ。」は、適切な根拠が示されているといえるか。理由とともに答えなさい。","a":"適切な根拠が示されているとはいえない。「大切にすべき」という意見を言い換えただけで、事実が示されていないから。","r":["示されていないと判断している","意見のくり返しで、事実がない"],"e":"問題1①。","p":"p.139"},{"id":"jpn033","s":"jpn","u":"意見と根拠","t":"essay","q":"「敬語を使う必要はない。尊敬の気持ちは、敬語を使わなくても自然に相手に伝わると思うからだ。」は、適切な根拠が示されているか。理由とともに答えなさい。","a":"適切ではない。根拠が「~と思う」という筆者の考えであり、誰が見ても変わらない客観的な事実ではないから。","r":["適切でないと判断","根拠が考え(思う)で事実ではない"],"e":"問題1③。","p":"p.139"},{"id":"jpn034","s":"jpn","u":"意見と根拠","t":"essay","q":"意見:私は、ごみ袋に名前を書くことに賛成だ。根拠:この制度を取り入れたN市では、ごみが前の年より8パーセント減った。この根拠と意見を結び付ける理由づけを考えなさい。","a":"名前を書くとごみの出し方に責任がもてるようになり、ルールを守る人が増えて、ごみが減ると考えられるから。","r":["根拠(ごみが減った)につなげている","意見(賛成)と結び付いている"],"e":"問題2①。答えは一例。","p":"p.139"},{"id":"jpn035","s":"jpn","u":"意見と根拠","t":"essay","q":"意見:私たちは、もっと基礎体力を強化すべきだ。根拠:先週の試合では、後半、疲労でプレーが乱れ、相手チームに逆転された。この根拠と意見を結び付ける理由づけを考えなさい。","a":"基礎体力が足りないと、試合の後半に疲れてプレーが乱れてしまうので、基礎体力をつければ最後まで集中して戦えると考えられるから。","r":["疲労とプレーの乱れの関係にふれている","基礎体力を強化する必要性を述べている"],"e":"問題2②。答えは一例。","p":"p.139"},{"id":"jpn036","s":"jpn","u":"意見と根拠","t":"choice","q":"意見を主張する文章の構成や展開に説得力があるかを判断するときに、検討することとして正しいものはどれか。","c":["事実の解釈に無理はないか、事実と意見が確かに結び付くか","文章が長いか短いか","筆者の経験が多いか","難しい言葉が使われているか"],"a":0,"e":"「構成や展開の効果を考える」の学びのカギ。","p":"p.137"},{"id":"jpn037","s":"jpn","u":"根拠を明確にして書く","t":"choice","q":"レポートの構成として正しい順序はどれか。","c":["調査の目的ときっかけ→調査の方法→調査の結果→考察→参考文献","調査の結果→考察→調査の方法→調査の目的→参考文献","考察→調査の目的→調査の結果→調査の方法→参考文献","参考文献→調査の目的→調査の方法→考察→調査の結果"],"a":0,"e":"参考文献には要約または引用した資料の出典を示す。","p":"p.143"},{"id":"jpn038","s":"jpn","u":"根拠を明確にして書く","t":"choice","q":"文章を引用するときの注意として正しいものはどれか。","c":["かぎ(「 」)でくくるなどして、引用部分を他と区別する","出典を書かずに使う","自分の言葉に直して引用部分を隠す","引用部分は長いほどよい"],"a":0,"e":"出典を正確に示す。","p":"p.141"},{"id":"jpn039","s":"jpn","u":"根拠を明確にして書く","t":"essay","q":"統計やアンケートなどの資料を引用するときに注意することを2つ答えなさい。","a":"読み取った情報や数値を正確に示すこと。読み手が引用元を確かめられるよう、出典を正確に示すこと。","r":["情報・数値を正確に示す","出典を正確に示す"],"e":"","p":"p.141"},{"id":"jpn040","s":"jpn","u":"根拠を明確にして書く","t":"choice","q":"次のうち、考察で「考え」を伝える文末表現はどれか。","c":["~と考えられる","~である","~ている","~だ"],"a":0,"e":"「~だ/である/ている」は事実を伝える文末表現。「考え」は「~だろう」「~と推測できる」「~といえる」など。","p":"p.143"},{"id":"jpn041","s":"jpn","u":"根拠を明確にして書く","t":"choice","q":"図表を読み取るときのポイントとして挙げられていないものはどれか。","c":["作成者の名前に注目","特徴的な数値に注目","変化に注目","違いに注目"],"a":0,"e":"最大値・最小値、増加・減少、項目の比較などに注目する。","p":"p.145"},{"id":"jpn042","s":"jpn","u":"根拠を明確にして書く","t":"choice","q":"「敷居が高い」の本来の意味はどれか。","c":["相手に不義理などをしてしまって、その人の家に行きにくい","高級すぎたり上品すぎたりして入りにくい","段差があって歩きにくい","相手の家が遠くて行きにくい"],"a":0,"e":"p.142のレポートの例。「高級すぎて入りにくい」は誤用とされる。","p":"p.142"},{"id": ":"リズムが生まれ、雨が降り続く静けさが強調される。","p":"p.148"},{"id":"jpn072","s":"jpn","u":"詩・季節の言葉","t":"essay","q":"「大阿蘇」で、同じ言葉がくり返されることで、どのような効果が生まれているか。","x":"【本文の要点】\n「大阿蘇」(三好達治)は、阿蘇の雨の風景を詠んだ詩である。雨の中、子馬をまじえた馬の群れが立っている。馬たちは草を食べ、雨にぐっしょり濡れている。これらの様子が描かれた後、「雨は蕭々と降っている」という行が、詩の中で何度もくり返される。最後には、空が一面の雨雲におおわれ、山は煙(噴煙)をあげているという、広大でひっそりとした光景が示される。","a":"雨が降り続く情景の静けさや長い時間の流れが強調され、言葉の響きやリズムも生まれる。","r":["静けさ・長い時間が表れる","リズム・響きが生まれる"],"e":"自分の感じたことを書いてよい。","p":"p.148"},{"id":"jpn073","s":"jpn","u":"詩・季節の言葉","t":"choice","q":"「大阿蘇」で、「彼らは草をたべている」の「彼ら」は何を指しているか。","x":"【本文の要点】\n「大阿蘇」(三好達治)は、阿蘇の雨の風景を詠んだ詩である。雨の中、子馬をまじえた馬の群れが立っている。馬たちは草を食べ、雨にぐっしょり濡れている。これらの様子が描かれた後、「雨は蕭々と降っている」という行が、詩の中で何度もくり返される。最後には、空が一面の雨雲におおわれ、山は煙(噴煙)をあげているという、広大でひっそりとした光景が示される。","c":["馬の群れ","阿蘇の人々","旅人","山の神"],"a":0,"e":"「一頭二頭子馬をまじえた馬の群れが」。","p":"p.148"},{"id":"jpn074","s":"jpn","u":"詩・季節の言葉","t":"choice","q":"「大阿蘇」の注で説明されている阿蘇は、どのような山か。","c":["熊本県にある、世界最大級のカルデラを有する複式火山","長野県にある活火山","北海道にある成層火山","静岡県にある休火山"],"a":0,"e":"中岳は阿蘇を構成する山の一つ。草千里浜は牛馬の放牧場。","p":"p.149"},{"id":"jpn075","s":"jpn","u":"詩・季節の言葉","t":"fill","q":"「秋の植物や動物にまつわる言葉」で、「秋の草花の咲く野原のこと」を何というか。","a":["花野"],"e":"すすきやはぎなどが咲く野原。","p":"p.150"},{"id":"jpn076","s":"jpn","u":"詩・季節の言葉","t":"fill","q":"「秋の植物や動物にまつわる言葉」で、「紅葉によって色づく頃、鮮やかに彩られた山の様子」を何というか。","a":["山粧う"],"e":"","p":"p.150"},{"id":"jpn077","s":"jpn","u":"詩・季節の言葉","t":"fill","q":"「秋の植物や動物にまつわる言葉」で、「秋に入り、北方から海を渡って多くの鳥がやって来ること」を何というか。","a":["鳥渡る"],"e":"","p":"p.150"},{"id":"jpn078","s":"jpn","u":"詩・季節の言葉","t":"choice","q":"与謝蕪村の句「子狐のかくれ貌なる野菊哉」の季語と季節はどれか。","c":["野菊・秋","子狐・春","かくれ貌・夏","哉・冬"],"a":0,"e":"野菊は秋の季語。","p":"p.150"},{"id":"jpn079","s":"jpn","u":"詩・季節の言葉","t":"choice","q":"「そよぐ」の意味はどれか。","c":["草や木の葉が、風に吹かれて、かすかに音を立てて揺れ動く","風がはげしく吹く","葉がすべて落ちる","木が大きく育つ"],"a":0,"e":"「動きを表す言葉⑥」。","p":"p.150"},{"id":"jpn080","s":"jpn","u":"古典の世界","t":"choice","q":"「竹取物語」について正しいものはどれか。","c":["日本最古の物語といわれ、平安時代の初め頃に作られたと考えられている","江戸時代に作られた紀行文","鎌倉時代に作られた随筆","平安時代に作られた和歌集"],"a":0,"e":"作者は不詳。","p":"p.152・156"},{"id":"jpn081","s":"jpn","u":"古典の世界","t":"choice","q":"「枕草子」の作者と種類の組み合わせとして正しいものはどれか。","c":["清少納言・随筆","紫式部・長編物語","兼好法師・随筆","松尾芭蕉・紀行文"],"a":0,"e":"清少納言のするどい感性が光る随筆。","p":"p.153"},{"id":"jpn082","s":"jpn","u":"古典の世界","t":"choice","q":"「徒然草」の作者はだれか。","c":["兼好法師","清少納言","紫式部","松尾芭蕉"],"a":0,"e":"ユーモアあり皮肉ありの随筆。","p":"p.153"},{"id":"jpn083","s":"jpn","u":"古典の世界","t":"choice","q":"「源氏物語」について正しいものはどれか。","c":["紫式部による長編物語で、主人公は光源氏","清少納言による随筆","松尾芭蕉による紀行文","琵琶法師が語る軍記物語"],"a":0,"e":"恋愛と苦悩を描く。","p":"p.153"},{"id":"jpn084","s":"jpn","u":"古典の世界","t":"choice","q":"「平家物語」について正しいものはどれか。","c":["平家一族の栄えとほろびを、琵琶法師が語った壮大な人間ドラマ","松尾芭蕉の旅の記録","兼好法師の随筆","日本最古の歌集"],"a":0,"e":"戦乱の時代の物語。","p":"p.153"},{"id":"jpn085","s":"jpn","u":"古典の世界","t":"choice","q":"「おくのほそ道」の作者と種類の組み合わせとして正しいものはどれか。","c":["松尾芭蕉・紀行文","清少納言・随筆","兼好法師・随筆","紫式部・物語"],"a":0,"e":"俳句を詠みながら歩く、江戸時代の紀行文。","p":"p.153"},{"id":"jpn086","s":"jpn","u":"古典の世界","t":"choice","q":"日本の三大歌集の組み合わせとして正しいものはどれか。","c":["万葉集・古今和歌集・新古今和歌集","万葉集・徒然草・古今和歌集","古今和歌集・枕草子・新古今和歌集","万葉集・源氏物語・新古今和歌集"],"a":0,"e":"「和歌の世界」。","p":"p.152"},{"id":"jpn087","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「いろは歌」の説明として正しいものはどれか。","c":["四十七文字の仮名を一回ずつ使って作られている","漢字だけで作られている","万葉集に収められた歌","松尾芭蕉の作品"],"a":0,"e":"七・五音を四回くり返す「今様」という歌謡形式。","p":"p.154・155"},{"id":"jpn088","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"「いろはにほへど」の「にほへど」を現代仮名遣いで書きなさい。","x":"【本文の要点】\nいろは歌(原文):色はにほへど 散りぬるを 我が世誰ぞ 常ならむ 有為の奥山 今日越えて 浅き夢見じ 酔ひもせず\n(「ゑひ」は現代仮名遣いで「えい」と書く。)","a":["におえど"],"e":"語中の「ほ」は「お」、「へ」は「え」と書く。","p":"p.154"},{"id":"jpn089","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"「けふ」を現代仮名遣いで書きなさい。","a":["きょう"],"e":"「けふ」→「きょう」。「ゐ」→「い」、「ゑ」→「え」も確認。","p":"p.154"},{"id":"jpn090","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"歴史的仮名遣いと現代仮名遣いについて、正しいものはどれか。","c":["語頭以外の「は・ひ・ふ・へ・ほ」は、ふつう「わ・い・う・え・お」に直す","「ゐ」は「ゐ」と書く","「いふ」は「いふ」と書く","歴史的仮名遣いと現代仮名遣いに違いはない"],"a":0,"e":"例:「言ふ」→「言う」。","p":"p.154"},{"id":"jpn091","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"essay","q":"「いろは歌」の「色はにほへど 散りぬるを」を現代語訳しなさい。","x":"【本文の要点】\nいろは歌(原文):色はにほへど 散りぬるを 我が世誰ぞ 常ならむ 有為の奥山 今日越えて 浅き夢見じ 酔ひもせず\n(「ゑひ」は現代仮名遣いで「えい」と書く。)","a":"(花は)色は美しく照り映えていても、散ってしまうものである。","r":["「色は美しく」","「散ってしまう」"],"e":"「我が世誰ぞ 常ならむ」は「私たちの生きるこの世の誰が永久に変わらないことがあろうか」。","p":"p.154"},{"id":"jpn092","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「浅き夢見じ」の意味として正しいものはどれか。","x":"【本文の要点】\nいろは歌(原文):色はにほへど 散りぬるを 我が世誰ぞ 常ならむ 有為の奥山 今日越えて 浅き夢見じ 酔ひもせず\n(「ゑひ」は現代仮名遣いで「えい」と書く。)","c":["浅い夢など見ることはしない","深い眠りにつく","浅い夢をよく見る","夢の話をしない"],"a":0,"e":"「酔ひもせず」は「心をまどわされもしない」。","p":"p.155"},{"id":"jpn093","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「竹取物語」で、翁が竹の中から見つけた、三寸ばかりのかわいらしい人はだれか。","x":"【本文の要点】\n(竹取物語の冒頭、原文)今は昔、竹取の翁といふものありけり。野山にまじりて竹を取りつつ、よろづのことに使ひけり。名をば、さぬきのみやつことなむいひける。その竹の中に、もと光る竹なむ一筋ありける。あやしがりて、寄りて見るに、筒の中光りたり。それを見れば、三寸ばかりなる人、いとうつくしうてゐたり。","c":["かぐや姫","五人の貴公子","帝の使い","嫗"],"a":0,"e":"「三寸」は、ごく小さいことを表す。一寸は約3センチメートル。","p":"p.157"},{"id":"jpn094","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「三寸」の一寸は、約何センチメートルか。","c":["約3センチメートル","約1センチメートル","約10センチメートル","約30センチメートル"],"a":0,"e":"三寸=約9センチメートル。ごく小さいことを表す。","p":"p.157"},{"id":"jpn095","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「翁」の意味として正しいものはどれか。","c":["おじいさん","おばあさん","若い男","貴公子"],"a":0,"e":"「嫗」はおばあさん。","p":"p.156"},{"id":"jpn096","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「なよ竹のかぐや姫」という名づけについて正しいものはどれか。","x":"【本文の要点】\n翁と嫗は、子供を授かったと喜んで大切に育てた。子供はすくすくと育ち、わずか三か月ほどで大人になった。その姿は輝くばかりに美しく、辺りに光が満ちるようであった。そこで翁と嫗は、娘を「なよ竹のかぐや姫」と名づけた。「なよ竹」は細くしなやかな竹、「かぐや」は「かがよふ(ちらちらと光ってゆらめく)」という言葉から考えられた名である。","c":["「なよ竹」は細くしなやかな竹で、「かぐや」は光り輝く意味の言葉に由来する","「なよ竹」は太い竹の意味","姫の生まれた村の名前","翁の名前"],"a":0,"e":"「かがよふ」(ちらちらと光ってゆらめく)から。","p":"p.158"},{"id":"jpn097","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"essay","q":"かぐや姫が五人の貴公子の求婚を断り切れなかったとき、どうしたか。その理由もふくめて説明しなさい。","x":"【本文の要点】\nかぐや姫の評判を聞いて、結婚したいと思う人が大勢つめかけたが、姫はなかなか求婚を断り切れなかった。熱心だった五人の貴公子に対し、姫は、入手困難なものを持ってきた人と結婚しましょうと言い、それぞれに難題を出した。五人は知恵や財産を投じて難題に挑んだ。","a":"結婚を諦め切れない貴公子たちに、入手困難なものを持ってきた人と結婚すると言い、それぞれに難題を出した。","r":["それぞれに難題を出した","入手困難なものを求めた"],"e":"","p":"p.158"},{"id":"jpn098","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「蓬莱の玉の枝」の説明として正しいものはどれか。","c":["根が銀、茎が金、実が真珠でできているといわれる木の枝","根が金、茎が銀の木の枝","宝石をちりばめた首飾り","燃えない布"],"a":0,"e":"蓬莱山は古代中国の伝説上の理想郷。","p":"p.156"},{"id":"jpn099","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"essay","q":"くらもちの皇子の策略は、どのようにして失敗に終わったか。","x":"【本文の要点】\nくらもちの皇子は、「蓬莱の玉の枝」を探しに行くと言って船出したが、ひそかに人目につかない家に籠もり、匠たちににせの玉の枝を作らせた。そして、苦難の航海の末に探し当てたかのように、翁の家へ枝を持参した。ところが、匠たちが押しかけてきて、千日余りも働かされたのにまだ代金がもらえない、と訴えた。こうして皇子の策略はあっさり破れ、求婚は失敗に終わった。他の四人も、難題の品を手に入れることができず、求婚は全て失敗に終わった。","a":"皇子はにせの玉の枝を匠たちに作らせたが、匠たちが千日余りも働かされたのに代金がもらえないと訴えに来たため、策略はあっさり破れてしまった。","r":["匠たちににせの玉の枝を作らせた","匠たちが代金のことで訴えに来た","策略が破れて失敗した"],"e":"ほかの四人の貴公子も失敗に終わった。","p":"p.158・160"},{"id":"jpn100","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"かぐや姫が、月を見てなげき悲しむようになった理由として正しいものはどれか。","x":"【本文の要点】\nかぐや姫は、帝にたびたび宮中へ召されたが、姿を影に変えて抵抗し、帝は宮中に迎えることをあきらめた。三年が過ぎた春の初め、姫は月を見てなげき悲しむようになり、秋になるとその様子はいっそう深くなった。翁が訳を尋ねると、姫は「実は私は月の都の者です。訳があって人間世界に来ましたが、八月十五夜には月に帰らなければなりません」と涙ながらに打ち明けた。","c":["八月十五夜に、月の都に帰らなければならないから","帝に宮中へ迎えられるのがいやだから","五人の貴公子に追われているから","翁と嫗がいなくなるから"],"a":0,"e":"「私は、実は月の都の者です」。","p":"p.161"},{"id":"jpn101","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「八月十五夜」は、どのような夜か。","c":["旧暦の八月十五日の夜で、中秋の名月の夜","新暦の八月十五日の夜","春の初めの夜","旧暦の一月一日"],"a":0,"e":"現在の九月から十月頃にあたる。","p":"p.161"},{"id":"jpn102","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"かぐや姫の昇天の場面で、天人が着せた天の羽衣の効果として、本文に書かれているのはどれか。","x":"【本文の要点】\n八月十五夜の夜、帝は二千人の兵士を遣わして翁の家を守らせたが、天人が現れると、兵士たちは戦意を失ってしまった。天人が天の羽衣をかぐや姫に着せようとする。かぐや姫は、天の羽衣を着ると、翁を愛おしく悲しく思う気持ちが消えてしまった。この衣を着た人は、物思いがなくなってしまうのである。姫は帝に手紙と不死の薬を残して、天に昇っていった。","c":["着ると物思いがなくなり、翁をいとおしく思う気持ちも消えた","空を飛べるようになる","姿が見えなくなる","若返る"],"a":0,"e":"かぐや姫は、天の羽衣を着ると地上での思いが消えてしまった。","p":"p.162-163"},{"id":"jpn103","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"帝が、不死の薬を燃やすよう命じた山はどれか。","x":"【本文の要点】\nかぐや姫が去った後、帝は姫のいないこの世で生きていてもむなしいと思い、不死の薬も不要だと考えた。そして、駿河の国にある、都からも近く天にも近い山の頂で、不死の薬と手紙を燃やすように命じて、使者を遣わした。その煙は、今も雲の中へ立ち上っていると言い伝えられている。","c":["駿河の国にある、天に近い山(ふじの山)","大阿蘇","比叡山","蓬莱山"],"a":0,"e":"煙はいまだ雲の中へ立ち上っていると言い伝えられている。","p":"p.163-164"},{"id":"jpn104","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"choice","q":"「竹取物語」の場面の順序として正しいものはどれか。","c":["翁がかぐや姫を見つける→五人の貴公子の求婚→帝の求婚と月を見て嘆く→かぐや姫の昇天→ふじの山","五人の貴公子の求婚→翁がかぐや姫を見つける→昇天→帝の求婚→ふじの山","昇天→ふじの山→翁が見つける→貴公子の求婚→帝の求婚","翁が見つける→昇天→貴公子の求婚→帝の求婚→ふじの山"],"a":0,"e":"章立て:一 冒頭、二 五人の貴公子たち、三 帝からの求婚、四 昇天、五 ふじの山。","p":"p.157-163"},{"id":"jpn105","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"「源氏物語」で、「竹取物語」は何と評されているか。「物語の□の親」の□にあてはまる語句を答えなさい。","a":["出で来はじめ"],"e":"「物語の出で来はじめの親」。日本最古の物語とされる。","p":"p.164"},{"id":"jpn106","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「筒」","a":["つつ"],"e":"","p":"p.157"},{"id":"jpn107","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「冒頭」","a":["ぼうとう"],"e":"","p":"p.157"},{"id":"jpn108","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「求婚」","a":["きゅうこん"],"e":"","p":"p.157"},{"id":"jpn109","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「姫」","a":["ひめ"],"e":"","p":"p.157"},{"id":"jpn110","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「恐ろしい」","a":["おそろしい"],"e":"","p":"p.159"},{"id":"jpn111","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「訪れる」","a":["おとずれる"],"e":"","p":"p.159"},{"id":"jpn112","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「授かる」","a":["さずかる"],"e":"","p":"p.158"},{"id":"jpn113","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「娘」","a":["むすめ"],"e":"","p":"p.158"},{"id":"jpn114","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「諦める」","a":["あきらめる"],"e":"","p":"p.158"},{"id":"jpn115","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「挑む」","a":["いどむ"],"e":"","p":"p.158"},{"id":"jpn116","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「籠もる」","a":["こもる"],"e":"","p":"p.158"},{"id":"jpn117","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「召す」","a":["めす"],"e":"","p":"p.161"},{"id":"jpn118","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「訴え」","a":["うったえ"],"e":"","p":"p.160"},{"id":"jpn119","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「昇天」","a":["しょうてん"],"e":"","p":"p.162"},{"id":"jpn120","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「遣わす」","a":["つかわす"],"e":"","p":"p.162"},{"id":"jpn121","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「閉ざす」","a":["とざす"],"e":"","p":"p.162"},{"id":"jpn122","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「犯す」","a":["おかす"],"e":"","p":"p.162"},{"id":"jpn123","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「添える」","a":["そえる"],"e":"","p":"p.162"},{"id":"jpn124","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「羽衣」","a":["はごろも"],"e":"","p":"p.162"},{"id":"jpn125","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「贈る」","a":["おくる"],"e":"","p":"p.163"},{"id":"jpn126","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「伏せる」","a":["ふせる"],"e":"","p":"p.163"},{"id":"jpn127","s":"jpn","u":"古典(いろは歌・竹取物語)","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「承る」","a":["うけたまわる"],"e":"","p":"p.164"},{"id":"jpn128","s":"jpn","u":"詩・季節の言葉","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「丘」","a":["おか"],"e":"","p":"p.149"},{"id":"jpn129","s":"jpn","u":"詩・季節の言葉","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「噴煙」","a":["ふんえん"],"e":"","p":"p.149"},{"id":"jpn130","s":"jpn","u":"詩・季節の言葉","t":"fill","q":"次の漢字の読み方をひらがなで答えなさい。「煙」","a":["けむり"],"e":"","p":"p.149"},{"id":"jpn131","s":"jpn","u":"貴公子たちの失敗談","t":"choice","q":"石作の皇子が、「仏の御石の鉢」を持ち帰ったとき、どうなったか。","x":"【本文の要点】\n石作の皇子は、「仏の御石の鉢」(仏教を開いた釈迦が使ったといわれる、珍しい石の鉢)を求められた。皇子は、天竺(インド)に探しに行くとうそをつき、大和国(奈良県)の山寺から鉢を持ち帰ったが、にせ物であることを見破られてしまった。皇子が、恥を捨ててでも姫に言い寄ったことから、厚かましいことを「はぢを捨つ」というようになった(「鉢」と「恥」をかけた言葉遊び)。","c":["大和国の山寺から持ち帰ったにせ物だと見破られた","本物だとして姫に認められた","インドで手に入れた本物だった","持ち帰る途中で盗まれた"],"a":0,"e":"天竺(インド)に探しに行くとうそをついていた。","p":"p.166"},{"id":"jpn132","s":"jpn","u":"貴公子たちの失敗談","t":"choice","q":"「はぢを捨つ」(厚かましいこと)という言葉は、どのような言葉遊びから生まれたか。","x":"【本文の要点】\n石作の皇子は、「仏の御石の鉢」(仏教を開いた釈迦が使ったといわれる、珍しい石の鉢)を求められた。皇子は、天竺(インド)に探しに行くとうそをつき、大和国(奈良県)の山寺から鉢を持ち帰ったが、にせ物であることを見破られてしまった。皇子が、恥を捨ててでも姫に言い寄ったことから、厚かましいことを「はぢを捨つ」というようになった(「鉢」と「恥」をかけた言葉遊び)。","c":["「鉢」と「恥」をかけた","「箱」と「恥」をかけた","「橋」と「恥」をかけた","「端」と「恥」をかけた"],"a":0,"e":"石作の皇子が、恥を捨てても姫に言い寄ったことから。","p":"p.166"},{"id":"jpn133","s":"jpn","u":"貴公子たちの失敗談","t":"choice","q":"右大臣阿倍御主人が買い求めた「火鼠の皮衣」は、どうなったか。","x":"【本文の要点】\n右大臣阿倍御主人は、「火鼠の皮衣」(古代中国の伝説上の動物である火鼠の毛で織った衣服)を求められた。大金を払って唐土(中国)の商人から、火をつけても決して燃えない皮衣を買い求めたが、姫が火にくべると、あっさり燃えてしまった。求婚に失敗した右大臣の「阿倍」にかけて、何かをやり遂げられず、がっかりすることを「あへなし」というようになった。","c":["姫が火にくべると、あっさり燃えてしまった","火に強く、燃えなかった","姫が気に入って受け取った","盗まれてしまった"],"a":0,"e":"火をつけても決して燃えないとされていた。","p":"p.166"},{"id":"jpn134","s":"jpn","u":"貴公子たちの失敗談","t":"fill","q":"求婚に失敗した右大臣の「阿倍」にかけて生まれた、「何かをやり遂げられず、がっかりする」という意味の言葉を答えなさい。","x":"【本文の要点】\n右大臣阿倍御主人は、「火鼠の皮衣」(古代中国の伝説上の動物である火鼠の毛で織った衣服)を求められた。大金を払って唐土(中国)の商人から、火をつけても決して燃えない皮衣を買い求めたが、姫が火にくべると、あっさり燃えてしまった。求婚に失敗した右大臣の「阿倍」にかけて、何かをやり遂げられず、がっかりすることを「あへなし」というようになった。","a":["あへなし","あえなし"],"e":"「阿倍」と「あへ(なし)」をかけた言葉遊び。","p":"p.166"},{"id":"jpn135","s":"jpn","u":"貴公子たちの失敗談","t":"choice","q":"大納言大伴御行が、竜の首の玉を探しに行ったとき、どうなったか。","x":"【本文の要点】\n大納言大伴御行は、「竜の首にある五色に光る玉」を求められた。自ら探しに船を出したが、あらしで遭難してしまう。竜の怒りを買ったのだと恐れて、探すことをあきらめた。その後、病気になり、すももほどの大きさに目が真っ赤にはれあがった。周囲の人が、そんなものは「食べられない」と言ったことから、道理に合わない、常識外れなことを「たへがたし」というようになった。","c":["船があらしで遭難し、竜の怒りを買ったと恐れて断念した","玉を手に入れて姫に贈った","船で外国に着いた","竜に会って玉をもらった"],"a":0,"e":"その後、病気で目が真っ赤にはれた。","p":"p.167"},{"id":"jpn136","s":"jpn","u":"貴公子たちの失敗談","t":"choice","q":"「道理に合わない、常識外れなことを『たへがたし』というようになった」のは、何という言葉遊びからか。","x":"【本文の要点】\n大納言大伴御行は、「竜の首にある五色に光る玉」を求められた。自ら探しに船を出したが、あらしで遭難してしまう。竜の怒りを買ったのだと恐れて、探すことをあきらめた。その後、病気になり、すももほどの大きさに目が真っ赤にはれあがった。周囲の人が、そんなものは「食べられない」と言ったことから、道理に合わない、常識外れなことを「たへがたし」というようになった。","c":["周囲の人が、そんなものは「食べられない」と言ったことから","船が「堪えられない」ほどゆれたことから","目が「耐えられない」ほど痛かったことから","玉が「たへがたい」ほど重かったことから"],"a":0,"e":"「食べがたし」と「たへがたし」をかけた言葉遊び。","p":"p.167"},{"id":"jpn137","s":"jpn","u":"貴公子たちの失敗談","t":"choice","q":"中納言石上麻呂は、「燕の持たる子安貝」を取ろうとして、どうなったか。","x":"【本文の要点】\n中納言石上麻呂は、「燕の持たる子安貝」(つばめが産卵するときに生じるという宝貝で、安産のお守り)を求められた。自ら籠に乗り、屋根の高さまでつり上げさせて、巣の中の子安貝を取ろうとした。何かを手にして下りようとした瞬間、つなが切れて転落してしまった。しかも、にぎっていたものは、つばめのふんであった。「貝」を得られなかったことから、期待に反することを「かひなし」というようになった。","c":["籠から転落し、にぎっていたものはつばめのふんだった","子安貝を手に入れて姫に贈った","つばめを捕まえた","巣を壊してしまい許された"],"a":0,"e":"子安貝は、つばめが産卵する際に生じるといわれる宝貝。","p":"p.167"},{"id":"jpn138","s":"jpn","u":"貴公子たちの失敗談","t":"fill","q":"「貝」を得られなかったことから、期待に反することを何というようになったか。「□□なし」の□□を答えなさい。","x":"【本文の要点】\n中納言石上麻呂は、「燕の持たる子安貝」(つばめが産卵するときに生じるという宝貝で、安産のお守り)を求められた。自ら籠に乗り、屋根の高さまでつり上げさせて、巣の中の子安貝を取ろうとした。何かを手にして下りようとした瞬間、つなが切れて転落してしまった。しかも、にぎっていたものは、つばめのふんであった。「貝」を得られなかったことから、期待に反することを「かひなし」というようになった。","a":["かひ","かい"],"e":"「かひなし」。","p":"p.167"},{"id":"jpn139","s":"jpn","u":"貴公子たちの失敗談","t":"choice","q":"「仏の御石の鉢」「火鼠の皮衣」「竜の首の玉」「燕の持たる子安貝」を求められた貴公子の組み合わせとして正しいものはどれか。","c":["石作の皇子・右大臣阿倍御主人・大納言大伴御行・中納言石上麻呂","石作の皇子・くらもちの皇子・大納言大伴御行・右大臣阿倍御主人","くらもちの皇子・右大臣阿倍御主人・中納言石上麻呂・大納言大伴御行","石作の皇子・大納言大伴御行・右大臣阿倍御主人・くらもちの皇子"],"a":0,"e":"くらもちの皇子は「蓬莱の玉の枝」。五人の貴公子の失敗談。","p":"p.166-167"},{"id":"jpn140","s":"jpn","u":"貴公子たちの失敗談","t":"essay","q":"五人の貴公子の失敗談に共通するのは、どのようなことか。自分の言葉で説明しなさい。","a":"かぐや姫に出された難題の品を手に入れられなかったり、にせ物を持ってきてうそがばれたりして、全員が求婚に失敗し、その失敗が言葉遊びとして語り継がれた。","r":["難題をクリアできなかった","求婚に失敗した","言葉遊びとして語られる"],"e":"失敗談を言葉遊びと結び付けて語る面白さがある。","p":"p.166-167"},{"id":"jpn141","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「うけたまはりて」を現代仮名遣いで書きなさい。","a":["うけたまわりて"],"e":"語頭以外の「は」は「わ」に直す。","p":"p.169"},{"id":"jpn142","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「使ひけり」を現代仮名遣いで書きなさい。","a":["使いけり","つかいけり"],"e":"語頭以外の「ひ」は「い」に直す。","p":"p.169"},{"id":"jpn143","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「いふものありけり」を現代仮名遣いで書きなさい。","a":["いうものありけり"],"e":"語頭以外の「ふ」は「う」に直す。","p":"p.169"},{"id":"jpn144","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「伝へたる」を現代仮名遣いで書きなさい。ひらがなで答えなさい。","a":["つたえたる"],"e":"語頭以外の「へ」は「え」に直す。","p":"p.169"},{"id":"jpn145","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「天人のよそほひ」の「よそほひ」を現代仮名遣いで書きなさい。","a":["よそおい"],"e":"「ほ」→「お」、「ひ」→「い」。","p":"p.169"},{"id":"jpn146","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「よろづのことに」の「よろづ」を現代仮名遣いで書きなさい。","a":["よろず"],"e":"「づ」→「ず」。","p":"p.169"},{"id":"jpn147","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「登るべきやうなし」の「やうなし」を現代仮名遣いで書きなさい。","a":["ようなし"],"e":"「やう」→「よう」。","p":"p.169"},{"id":"jpn148","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「うつくしうて」の「うつくしう」を現代仮名遣いで書きなさい。","a":["うつくしゅう"],"e":"「しう」→「しゅう」。","p":"p.169"},{"id":"jpn149","s":"jpn","u":"古典の言葉・仮名遣い","t":"fill","q":"「ゑひもせず」を現代仮名遣いで書きなさい。","a":["えいもせず"],"e":"「ゑ」→「え」、「ひ」→「い」。","p":"p.169"},{"id":"jpn150","s":"jpn","u":"古典の言葉・仮名遣い","t":"choice","q":"歴史的仮名遣いとは何か。","x":"【古典の言葉】\n古典では、語頭以外の「は・ひ・ふ・へ・ほ」は、平安時代中頃から、ワ行の「わ・い・う・え・お」の音に変化した。そのため、古典の仮名遣い(歴史的仮名遣い)は、平安時代中頃以前の表記を基準としたもので、現代仮名遣いと発音とが異なる。","c":["平安時代中頃以前の表記を基準にした古典の仮名遣い","江戸時代の仮名遣い","明治時代に作られた仮名遣い","現代の仮名遣い"],"a":0,"e":"語頭以外のハ行の音が、ワ行の音に変化したあとも、表記は昔のまま残った。","p":"p.169"},{"id":"jpn151","s":"jpn","u":"古典の言葉・仮名遣い","t":"choice","q":"古典の「うつくし」の主な意味はどれか。","c":["かわいい・愛らしい","美しい・きれいだ","恐ろしい","珍しい"],"a":0,"e":"現代の「美しい」とは意味が変化した言葉。","p":"p.169"},{"id":"jpn152","s":"jpn","u":"古典の言葉・仮名遣い","t":"choice","q":"古典の「いと」の意味はどれか。","c":["たいへん・あまりに・とても","少し","すぐに","ほとんど"],"a":0,"e":"現代では使われなくなった言葉。","p":"p.169"},{"id":"jpn153","s":"jpn","u":"古典の言葉・仮名遣い","t":"choice","q":"古典の「わろし」の意味はどれか。","c":["よくない・見劣りがする・感心しない","うれしい","おかしい","悲しい"],"a":0,"e":"現代では使われなくなった言葉。","p":"p.169"},{"id":"jpn154","s":"jpn","u":"古典の言葉・仮名遣い","t":"choice","q":"古典の「あやしがりて」の意味はどれか。","c":["不思議に思って","恐ろしがって","うれしく思って","怒って"],"a":0,"e":"現代の「怪しい」とは意味が異なる。","p":"p.157・168"},{"id":"jpn155","s":"jpn","u":"古典の言葉・仮名遣い","t":"essay","q":"古典の言葉(文語)と現代の言葉(口語)には、どのような違いがあるか。2つ以上挙げて説明しなさい。","a":"仮名遣いが違う(「いふ」→「いう」など)ことや、現代とは意味が変化した言葉(「うつくし」=かわいい)、現代では使われなくなった言葉(「いと」「わろし」)がある。","r":["仮名遣いの違い","意味が変化した言葉(例:うつくし)","使われなくなった言葉(例:いと・わろし)"],"e":"形が現代と同じでも意味が変わった言葉に注意する。","p":"p.169"}]);
/* ===== 保存層(あとでSupabaseに差し替える部分) ===== */
const mem={};
const S={g(k,d){try{const v=localStorage.getItem('qa:'+k);if(v!=null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},
 s(k,v){mem[k]=v;try{localStorage.setItem('qa:'+k,JSON.stringify(v))}catch(e){}}};
const SUB={sci:'理科',soc:'社会',jpn:'国語'};
const NOTE={sci:'4章 物質のすがたとその変化',soc:'地理 ヨーロッパ州',jpn:'シジュウカラ・古典ほか'};
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFKC').replace(/\s/g,'').toLowerCase();
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const bank=()=>{const m=new Map();[...BASE,...S.g('custom',[])].forEach(q=>m.set(q.id,q));return[...m.values()]};
let st={sub:null,quiz:null};

function hub(){const B=bank(),W=S.g('wrongs',{});
 $.innerHTML=`<h1>期末テスト対策</h1><p class=sub>中学1年 ・ 全${B.length}問</p><div class=grid>`+Object.keys(SUB).map(k=>{
 const n=B.filter(q=>q.s==k).length,w=B.filter(q=>q.s==k&&W[q.id]).length;
 return `<button class="c sb" data-a=sub data-v=${k}><b>${SUB[k]}</b><span>${NOTE[k]}</span><em>${n?n+'問':'問題データ待ち'}${w?' ・ 復習 '+w+'問':''}</em></button>`}).join('')+
 `</div><div class=row><button class=b data-a=rec>学習の記録</button><button class=b data-a=imp>問題データを追加</button></div>`}

function sub(k){st.sub=k;const B=bank().filter(q=>q.s==k),W=S.g('wrongs',{}),us=[...new Set(B.map(q=>q.u))],w=B.filter(q=>W[q.id]).length;
 if(!B.length){$.innerHTML=`<button class=b data-a=hub>← トップ</button><h2>${SUB[k]}</h2><div class=c><p>まだ問題がありません。「問題データを追加」から読み込めます。</p><button class=b data-a=imp>問題データを追加</button></div>`;return}
 $.innerHTML=`<button class=b data-a=hub>← トップ</button><h1>${SUB[k]}</h1><p class=sub>${NOTE[k]}</p>
 <div class=c><h2>単元</h2><div class=units>${us.map(u=>`<label class=k><input type=checkbox name=u value="${esc(u)}" checked>${esc(u)}(${B.filter(q=>q.u==u).length})</label>`).join('')}</div>
 <h2>形式</h2><select id=ty><option value=all>すべて</option><option value=choice>選択問題</option><option value=fill>用語の入力</option><option value=essay>記述(自己採点)</option></select>
 <h2>問題数</h2><select id=nn><option>10</option><option>20</option><option value=999>すべて</option></select>
 <div class=row><button class="b p" data-a=start>スタート</button><button class=b data-a=review ${w?'':'disabled'}>間違えた問題を復習(${w})</button></div></div>`}

function start(list,rev){if(!list.length){alert('条件に合う問題がありません');return}
 st.quiz={list,i:0,sc:0,res:[],rev:!!rev};qv()}
function qv(){const z=st.quiz,q=z.list[z.i];z.done=false;
 let h=`<div class=top><button class=b data-a=sub data-v=${st.sub}>やめる</button><span>${z.i+1} / ${z.list.length}</span></div><div class=c><div class=meta>${esc(q.u)} ・ ${esc(q.p||'')}</div>${q.x?`<div class=src>${esc(q.x)}</div>`:''}<p class=q>${esc(q.q)}</p>`;
 if(q.t=='choice'){z.o=shuf(q.c.map((x,i)=>i));h+=z.o.map(i=>`<button class=o data-a=pick data-v=${i}>${esc(q.c[i])}</button>`).join('')}
 else if(q.t=='fill')h+=`<input type=text id=in autocomplete=off placeholder="答えを入力"><button class="b p" data-a=check>答え合わせ</button>`;
 else h+=`<textarea id=in rows=4 placeholder="自分の言葉で書いてみよう"></textarea><button class="b p" data-a=check>模範解答を見る</button>`;
 $.innerHTML=h+`<div class=row id=sk><button class=b data-a=idk>わからない(答えを見る)</button><button class=b data-a=skip>とばす</button></div></div><div id=fb></div>`;const i=document.getElementById('in');if(i)i.focus()}

function mark(q,sc){const z=st.quiz,W=S.g('wrongs',{});z.res.push({id:q.id,sc});z.sc+=sc;
 if(sc>=1){if(z.rev)delete W[q.id]}else{const w=W[q.id]||{n:0};w.n++;w.t=Date.now();W[q.id]=w}S.s('wrongs',W)}
function fb(ok,q,ans){const nxt=st.quiz.i+1>=st.quiz.list.length?'結果を見る':'次へ';
 document.getElementById('fb').innerHTML=`<div class="c fb ${ok?'ok':'ng'}"><b class=r>${ok?'正解!':'不正解'}</b>${ok?'':`<p>正解:${esc(ans)}</p>`}${q.e?`<p>${esc(q.e)}</p>`:''}<button class="b p" data-a=next>${nxt}</button></div>`}

function hs(){const e=document.getElementById('sk');if(e)e.remove()}
function idk(){const z=st.quiz,q=z.list[z.i];if(z.done)return;z.done=true;hs();
 document.querySelectorAll('.o').forEach(b=>{b.disabled=true;if(+b.dataset.v==q.a)b.classList.add('ok')});
 const el=document.getElementById('in');if(el)el.disabled=true;mark(q,0);fb(false,q,q.t=='choice'?q.c[q.a]:q.t=='fill'?q.a[0]:q.a)}
function skip(){const z=st.quiz,q=z.list[z.i];if(z.done)return;z.res.push({id:q.id,sc:0});next()}
function pick(v){const z=st.quiz,q=z.list[z.i];if(z.done)return;z.done=true;hs();const i=+v,ok=i==q.a;
 document.querySelectorAll('.o').forEach(b=>{b.disabled=true;if(+b.dataset.v==q.a)b.classList.add('ok');else if(+b.dataset.v==i)b.classList.add('ng')});
 mark(q,ok?1:0);fb(ok,q,q.c[q.a])}
function check(){const z=st.quiz,q=z.list[z.i];if(z.done)return;const el=document.getElementById('in'),val=el.value;
 if(q.t=='fill'){if(!norm(val))return;z.done=true;hs();el.disabled=true;const ok=q.a.some(a=>norm(a)==norm(val));mark(q,ok?1:0);fb(ok,q,q.a[0])}
 else{z.done=true;hs();el.disabled=true;
  document.getElementById('fb').innerHTML=`<div class="c fb wa"><b class=r>模範解答</b><p class=pre>${esc(q.a)}</p><b>採点ポイント(できたらチェック)</b>${(q.r||[]).map(x=>`<label class=k><input type=checkbox>${esc(x)}</label>`).join('')}${q.e?`<p class=meta>${esc(q.e)}</p>`:''}<p>自己評価は?</p><div class=row><button class="b p" data-a=grade data-v=1>できた</button><button class=b data-a=grade data-v=.5>惜しい</button><button class=b data-a=grade data-v=0>できなかった</button></div></div>`}}
function grade(v){const z=st.quiz,q=z.list[z.i];mark(q,+v);next()}
function next(){const z=st.quiz;if(z.i+1>=z.list.length)return result();z.i++;qv()}

function result(){const z=st.quiz,B=bank(),n=z.list.length,sc=Math.round(z.sc*10)/10;
 const H=S.g('hist',[]);H.push({t:Date.now(),s:st.sub,sc,n,rev:z.rev});S.s('hist',H.slice(-200));
 const wr=z.res.filter(r=>r.sc<1).map(r=>B.find(q=>q.id==r.id)).filter(Boolean);
 $.innerHTML=`<h1>結果</h1><div class=c><div class=big>${sc} / ${n}</div><p>${Math.round(sc/n*100)}%</p></div>`+
 (wr.length?`<div class=c><h2>見直す問題</h2><ul>${wr.map(q=>`<li>${esc(q.q)}<br><span class=meta>答え:${esc(q.t=='choice'?q.c[q.a]:q.t=='fill'?q.a[0]:q.a)}(${esc(q.p||'')})</span></li>`).join('')}</ul></div>`:'<div class=c>全問クリア!</div>')+
 `<div class=row><button class="b p" data-a=sub data-v=${st.sub}>${SUB[st.sub]}に戻る</button><button class=b data-a=hub>トップ</button></div>`}

function rec(){const H=S.g('hist',[]),W=S.g('wrongs',{});
 $.innerHTML=`<button class=b data-a=hub>← トップ</button><h1>学習の記録</h1>`+Object.keys(SUB).map(k=>{const h=H.filter(x=>x.s==k),t=h.reduce((a,x)=>a+x.n,0),s=h.reduce((a,x)=>a+x.sc,0);
 return `<div class=c><h2>${SUB[k]}</h2><p>${h.length}回 ・ ${t?Math.round(s/t*100)+'%':'—'}</p></div>`}).join('')+
 `<div class=c><h2>直近の記録</h2><ul>${H.slice(-10).reverse().map(x=>`<li>${new Date(x.t).toLocaleString('ja-JP')} ${SUB[x.s]} ${x.sc}/${x.n}${x.rev?'(復習)':''}</li>`).join('')||'<li>まだ記録がありません</li>'}</ul></div>
 <div class=row><button class=b data-a=reset>記録を消す</button></div>`}

function imp(msg){const n=S.g('custom',[]).length;
 $.innerHTML=`<button class=b data-a=hub>← トップ</button><h1>問題データを追加</h1><p class=sub>追加済み:${n}問</p>${msg?`<div class=c>${msg}</div>`:''}
 <div class=c><p>JSON配列の形式で貼り付けるか、ファイルを選びます。同じidの問題は上書きされます。</p>
 <input type=file id=fl accept=".json,.txt"><textarea id=tx rows=9 placeholder='[{"id":"soc001","s":"soc","u":"自然環境","t":"fill","q":"…","a":["偏西風"],"e":"…","p":"p.65"}]'></textarea>
 <div class=row><button class="b p" data-a=load>追加する</button><button class=b data-a=clr>追加分をすべて削除</button></div></div>
 <div class=c><p class=meta>t:choice → c(選択肢の配列)とa(正解の番号。0始まり)<br>t:fill → a(正解の表記の配列)<br>t:essay → a(模範解答)とr(採点ポイントの配列)<br>s は sci / soc / jpn。u は単元名、p は教科書のページ。</p></div>`}
function load(){let d;try{d=JSON.parse(document.getElementById('tx').value)}catch(e){return imp('JSONの形式が正しくありません。'+esc(e.message))}
 if(!Array.isArray(d))return imp('配列([ ])で入力してください。');
 const ok=[],ng=[];d.forEach((q,i)=>{const v=q&&q.id&&SUB[q.s]&&q.u&&q.q&&((q.t=='choice'&&Array.isArray(q.c)&&Number.isInteger(q.a))||(q.t=='fill'&&Array.isArray(q.a))||(q.t=='essay'&&typeof q.a=='string'));v?ok.push(q):ng.push(i+1)});
 const m=new Map(S.g('custom',[]).map(q=>[q.id,q]));ok.forEach(q=>m.set(q.id,q));S.s('custom',[...m.values()]);
 imp(`${ok.length}問を追加しました。`+(ng.length?`<br>形式エラーで除外:${ng.length}件(${ng.slice(0,10).join(', ')}番目)`:''))}

const A={hub,rec,imp:()=>imp(),sub:v=>sub(v),
 start(){const us=[...document.querySelectorAll('input[name=u]:checked')].map(x=>x.value),ty=document.getElementById('ty').value,n=+document.getElementById('nn').value;
  start(shuf(bank().filter(q=>q.s==st.sub&&us.includes(q.u)&&(ty=='all'||q.t==ty))).slice(0,n))},
 review(){const W=S.g('wrongs',{});start(shuf(bank().filter(q=>q.s==st.sub&&W[q.id])),true)},
 pick,check,grade,next,load,idk,skip,
 clr(){if(confirm('追加した問題をすべて削除しますか?')){S.s('custom',[]);imp('削除しました。')}},
 reset(){if(confirm('学習記録と復習データを消しますか?')){S.s('hist',[]);S.s('wrongs',{});rec()}}};
$.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&!t.disabled)A[t.dataset.a](t.dataset.v)});
$.addEventListener('change',e=>{if(e.target.id=='fl'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{document.getElementById('tx').value=r.result};r.readAsText(e.target.files[0])}});
$.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='in'&&e.target.tagName=='INPUT')check()});
hub();
</script></body></html>
