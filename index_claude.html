<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>理科・地理・国語・英語クイズ</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1f2937;--sub:#6b7280;--ac:#3b82f6;--bd:#e5e7eb;--ok:#16a34a;--okb:#dcfce7;--ng:#dc2626;--ngb:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--sub:#9ca3af;--ac:#60a5fa;--bd:#374151;--ok:#4ade80;--okb:#14532d;--ng:#f87171;--ngb:#7f1d1d}}
:root[data-theme="dark"]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--sub:#9ca3af;--ac:#60a5fa;--bd:#374151;--ok:#4ade80;--okb:#14532d;--ng:#f87171;--ngb:#7f1d1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:1.4rem;margin:0 0 4px}.sub{color:var(--sub);font-size:.9rem;margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:2px solid var(--bd);background:var(--card);text-align:left;margin-top:10px;min-height:52px;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--ac)}
.btn:disabled{cursor:default}
.btn.ok{background:var(--okb);border-color:var(--ok)}
.btn.ng{background:var(--ngb);border-color:var(--ng)}
.btn b{display:inline-block;width:1.6em;color:var(--sub)}
.pri{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:700;margin-top:16px}
.sec{text-align:center;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--sub);margin-bottom:8px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:.3s}
.q{white-space:pre-line;font-size:1.1rem;font-weight:600;margin:0 0 8px}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);border-left:4px solid var(--ac);font-size:.95rem}
.exp strong{display:block;margin-bottom:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row .btn{flex:1 1 45%;margin-top:0;text-align:center}
.sel.on{border-color:var(--ac);background:var(--ac);color:#fff}
.tog{display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer}
.tog input{width:20px;height:20px}
.score{font-size:3rem;font-weight:800;text-align:center;color:var(--ac);margin:8px 0}
.wl{padding-left:1.2em;font-size:.9rem;color:var(--sub)}
.hide{display:none}
.portal{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;padding:8px 14px;border-radius:99px;background:var(--card);color:var(--sub);border:1px solid var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:.85rem;text-decoration:none}
.portal:hover{color:var(--ac);border-color:var(--ac)}
.sc{display:flex;align-items:center;gap:14px;padding:18px 16px}.sc .em{font-size:2rem}.sc small{color:var(--sub)}.back{background:none;border:0;color:var(--sub);padding:0 0 10px;font-size:.9rem}
</style></head>
<body><main>
<section id="home" class="card">
  <h1>📚 クイズ集</h1>
  <p class="sub">教科を選んでスタート！</p>
  <div id="subj"></div>
  <p class="sub" style="margin:16px 0 0;font-size:.8rem">成績はこの端末のブラウザにだけ保存されます。</p>
  <button class="btn sec" id="reset" style="font-size:.85rem;color:var(--sub)">記録をリセット</button>
</section>
<section id="start" class="card hide">
  <button class="back" id="back">← 教科選択へ</button>
  <h1 id="st"></h1>
  <p class="sub" id="ss"></p>
  <strong>出題範囲</strong>
  <div class="row" id="ranges"></div>
  <label class="tog"><input type="checkbox" id="shuf" checked> 出題順をシャッフルする</label>
  <button class="btn pri" id="go">スタート</button>
  <button class="btn sec" id="weak">💪 苦手克服モード</button>
</section>

<section id="play" class="card hide">
  <div class="top"><button class="back" id="quit" style="padding:0">🏠 教科選択へ</button><span id="cnt">1 / 30</span><span id="sc">正解 0</span></div>
  <div class="bar"><i id="pb"></i></div>
  <p class="q" id="q"></p>
  <div id="opts"></div>
  <div class="exp hide" id="exp"></div>
  <button class="btn pri hide" id="next">次の問題へ</button>
</section>

<section id="res" class="card hide">
  <h1 style="text-align:center">結果発表</h1>
  <div class="score" id="rs"></div>
  <p class="sub" style="text-align:center;font-size:1.2rem;font-weight:700;margin:0" id="rp"></p>
  <p class="sub" style="text-align:center" id="rm"></p>
  <div id="wrongBox" class="hide"><strong>間違えた問題</strong><ol class="wl" id="wl"></ol></div>
  <button class="btn pri hide" id="retry">間違えた問題だけやり直す</button>
  <button class="btn sec" id="again">トップへ戻る</button>
</section>
</main>

const SUBJ=[
{k:"理科",n:"理科",e:"🔬",s:"状態変化・蒸留・光と凸レンズ",d:mk([
["物質が加熱や冷却によって、固体・液体・気体とそのすがたを変える現象を何というか。",["化学変化","状態変化","溶解","再結晶"],1,"物質があたためられたり冷やされたりして、固体・液体・気体の間で形を変えることを「状態変化」といいます。"],
["物質が状態変化するとき、変化せずに一定に保たれるものはどれか。",["体積","密度","質量","粒子の間隔"],2,"状態変化しても物質をつくる粒子の数自体は変わらないため、質量は変化しません。"],
["ろうを加熱して液体にし、それを冷却して固体に戻したときの体積と中央の表面のようすについて正しいものはどれか。",["体積は大きくなり、中央が盛り上がる","体積は小さくなり、中央が凹む","体積は変わらず、表面は平らなまま","体積は小さくなり、中央が盛り上がる"],1,"液体から固体に状態変化すると、粒子どうしの間隔が狭くなるため体積は小さくなり、ビーカーのろうの中央部分は凹みます。"],
["一般的な物質とは異なり、液体から固体になるときに例外的に体積が増加する物質はどれか。",["エタノール","ろう","水","ブタン"],2,"水は例外的に、液体から固体（氷）になるときに体積が増加する性質を持っています。"],
["物質をつくる粒子のモデルで考えたとき、液体から気体に状態変化したときの粒子の運動と間隔のようすとして正しいものはどれか。",["粒子の運動が激しくなり、間隔が広がる","粒子の運動が静かになり、間隔が狭くなる","粒子の数が大幅に増加する","粒子自体の大きさが巨大化する"],0,"加熱して液体から気体になると、粒子の運動がより激しくなり、粒子どうしの間隔が大きく広がります。"],
["液体が沸騰するときと蒸発するときについての説明として、正しいものはどれか。",["蒸発は液体の内部からも起こり、沸騰は表面からのみ起こる","蒸発も沸騰も特定の温度でしか起こらない","蒸発は液体の表面から起こり、沸騰は表面だけでなく内部からも激しく気体が発生する","沸騰は温度に関係なく常におこる"],2,"蒸発は液体の表面から起こり温度に関係なく発生しますが、沸騰は一定の温度（沸点）に達したときに液体の表面だけでなく内部からも激しく気体が発生する現象です。"],
["液体が沸騰して気体に変化するときの温度を何というか。",["融点","沸点","限界温度","発火点"],1,"液体が沸騰して気体に変化するときの温度を「沸点」といいます。"],

["純粋な物質（純物質）の沸点や融点についての記述として正しいものはどれか。",["物質の量が多くなるほど高くなる","加熱する火力が強いほど高くなる","物質の種類によって決まっており、物質の量には関係しない","加熱し続けると沸騰中も温度は上がり続ける"],2,"純粋な物質の沸点や融点は物質の種類ごとに決まっており、物質の量に関係なく一定です。"],
["液体を加熱する実験で、枝つきフラスコや試験管に沸騰石を入れる目的は何か。",["加熱時間を短くするため","急な沸騰（突沸）を防ぐため","沸点を高くするため","発生した気体を冷却するため"],1,"液体が急激に沸騰して飛び散る現象（突沸）を防ぐために、あらかじめ沸騰石を入れて加熱します。"],
["エタノールや水の蒸留実験で、ガスバーナーの火を消す直前に行わなければならない安全上の操作はどれか。",["沸騰石を取り出す","温度計を抜く","ガラス管の先を試験管の液体から出す","ゴム栓を強く締め直す"],2,"火を消す前にガラス管の先を液体から出しておかないと、装置内の空気が冷えて収縮し、集めた液体がフラスコ側に逆流して危険なためです。"],
["水とエタノールの混合物を加熱したときの温度変化の特徴として正しいものはどれか。",["水の沸点である100℃に達するまで一定の温度を保つ","沸騰が始まっても一定の温度にはならず、徐々に温度が上がり続ける","エタノールの融点で一定温度になる","加熱を始めるとすぐに一定の温度になる"],1,"混合物は純物質と異なり、沸騰が始まっても温度が一定にならず、加熱とともに徐々に温度が上昇します。"],
["液体を加熱して沸騰させ、出てくる気体を冷やして再び液体にして集める操作を何というか。",["再結晶","ろ過","蒸留","昇華"],2,"液体を加熱して気体にし、それを冷却して再び液体として集める操作を「蒸留」といいます。"],
["水（沸点100℃）とエタノール（沸点78℃）の混合物を蒸留したとき、最初に出てくる液体に多く含まれる物質はどちらか。",["水","エタノール","水とエタノールが半分ずつ","どちらも含まれない"],1,"沸点の低いエタノール（78℃）の方が先に沸騰して気体になりやすいため、最初に出てくる液体にはエタノールが多く含まれます。"],
["石油（原油）を蒸留塔で各成分に分離するとき、蒸留塔の上段から取り出される物質の特徴はどれか。",["沸点が最も高い物質","沸点が最も低い物質","密度が最も大きい固体","気化しない重油"],1,"石油の蒸留では、沸点の低い成分ほど低温で気体となって塔の上部にのぼるため、上段からは沸点の低い物質（ガソリンや石油ガスなど）が取り出されます。"],
["太陽や点灯している電球のように、自ら光を発する物体を何というか。",["反射体","光源","焦点","発光レンズ"],1,"自ら光を発する物体を「光源」といいます。"],
["光が鏡などの面に当たってはね返るとき、入射角と反射角の関係はどうなるか。",["入射角 ＞ 反射角","入射角 ＝ 反射角","入射角 ＜ 反射角","入射角 ＋ 反射角 ＝ 90°"],1,"光が反射するとき、入射角と反射角の大きさは常に等しくなります。これを「反射の法則」といいます。"],

["鏡に映る物体の「像」の位置について正しい説明はどれか。",["鏡の表面上にある","物体から鏡までの距離の2倍奥にある","鏡に対して物体と線対称の位置にある","鏡の手前に浮き出て見える"],2,"鏡に映る像は、鏡の面を軸として実際の物体と線対称となる位置（鏡の奥の同じ距離の位置）にあるように見えます。"],
["光が空気中から水やガラスの中へ斜めに進むとき、入射角と屈折角の大きさの関係はどうなるか。",["入射角 ＞ 屈折角","入射角 ＝ 屈折角","入射角 ＜ 屈折角","屈折角 ＝ 90°"],0,"光が空気中から水やガラスに進むときは、光が境界で境界面の垂直線寄りに折れ曲がるため、「入射角 ＞ 屈折角」となります。"],
["光が水やガラスの中から空気中へ斜めに進むとき、入射角と屈折角の大きさの関係はどうなるか。",["入射角 ＞ 屈折角","入射角 ＝ 屈折角","入射角 ＜ 屈折角","常に屈折角は0°"],2,"光が水やガラスから空気中に出ていくときは、境界で外側に折れ曲がるため、「入射角 ＜ 屈折角」となります。"],
["水を入れたコップの底に置いたコインが、水を入れると浅い位置に浮き上がって見えるのは光の何の現象によるものか。",["反射","屈折","全反射","直進"],1,"コインから出た光が水から空気へ出るときに境界で屈折し、その屈折した光の延長線上に像が見えるため、浮き上がって見えます。"],
["光が水やガラスから空気へ進むときに、入射角を大きくしていくと屈折光が出なくなり、境界ですべて反射する現象を何というか。",["乱反射","複屈折","全反射","散乱"],2,"水やガラスから空気へ光が進む際、入射角がある角度を超えると屈折角が90°を超えてしまい、光がすべて境界で反射する「全反射」が起こります。"],
["信号の損失を抑えて大量のデータを高速で通信できる、全反射の仕組みを利用したケーブルはどれか。",["同軸ケーブル","光ファイバー","LANケーブル","エナメル線"],1,"光ファイバーは、ガラスやプラスチックの管内部で光を繰り返し全反射させて信号を遠くまで伝える技術です。"],

["凸レンズの焦点の内側（レンズに近い位置）に物体を置いたとき、レンズを通して見える像を何というか。",["倒立の実像","正立の実像","倒立の虚像","正立の虚像"],3,"焦点の内側に物体を置いた場合、スクリーンに像は映りませんが、レンズを覗くと実物より大きな同じ向きの「正立の虚像」が見えます。"],

["太陽光（白色光）をプリズムに通すと、赤から紫までの様々な色の光に分かれるのはなぜか。",["色によって光の反射角が異なるから","色によって光の屈折する角度（屈折率）が異なるから","色によって光が全反射するから","プリズム内部で光が吸収されるから"],1,"太陽光には様々な色の光が混ざり合っており、ガラスなどの境界を通る際に色（波長）によって屈折する角度が異なるため、色が分かれて見えます。"]
])},

["竹取の翁が光る竹の中で見つけたかぐや姫の最初の大きさはどのくらいでしたか。",["三寸（約9cm）","一尺（約30cm）","五寸（約15cm）","赤ん坊と同じ大きさ"],0,"翁が竹の中に見た女の子は「三寸ばかりなる人（約9cmほどの大きさ）」でした。"],
["かぐや姫に求婚した貴公子の人数は何人ですか。",["3人","5人","7人","10人"],1,"かぐや姫の美しさを聞きつけて求婚してきた熱心な貴公子は5人いました。"],
["かぐや姫が月へ帰ったのは、旧暦のいつの夜ですか。",["正月十五日","七月七日","八月十五日（中秋の名月）","十二月三十一日"],2,"かぐや姫は八月十五日の満月の夜（中秋の名月）に天人の迎えに乗って月へ帰りました。"],
["帝がかぐや姫から贈られた「不死の薬」を日本で一番天に近い山で燃やさせたことから、その山は何と呼ばれるようになったとされていますか。",["阿蘇山","富士の山（富士山）","筑波山","比叡山"],1,"「士（兵士）をたくさん連れて登ったこと」や「不死の薬を燃やしたこと」から、その山は「ふじの山（富士山）」と名付けられたと伝えられています。"]

SUBJ[1].d.push(...mk([["アメリカ合衆国最大の都市であり、国際連合の本部や多くの企業の本社が集まる世界経済・政治の中心地はどこですか。",["シアトル","ニューヨーク","シカゴ","ロサンゼルス"],1,"ニューヨークのマンハッタン島には国際連合（国連）の本部があり、多くの企業の本社が集中する世界経済と国際政治の中心地となっています。"],["中央アメリカに位置し、太平洋とカリブ海を結ぶ水門式の運河はどれですか。",["スエズ運河","パナマ運河","キール運河","コリント運河"],1,"パナマ運河は太平洋とカリブ海を結ぶ水門式の運河で、年間約1万4000隻の船舶が通行する国際的な海上交通の要所です。"],["北アメリカ大陸の西側に南北につらなる、けわしく高い山脈は何ですか。",["アパラチア山脈","ロッキー山脈","アルプス山脈","アンデス山脈"],1,"北アメリカ大陸の西側にはけわしく標高の高いロッキー山脈が走り、東側にはなだらかなアパラチア山脈が南北に走っています。"],["北アメリカ大陸の東側に位置する、古くからの浸食によってなだらかで低い山脈は何ですか。",["ロッキー山脈","ピレネー山脈","アパラチア山脈","ヒマラヤ山脈"],2,"北アメリカ大陸の東側には、なだらかで低いアパラチア山脈が走っています。"],["ロッキー山脈とアパラチア山脈の間の広大な中央平原を流れ、メキシコ湾に注ぐ大河は何ですか。",["アマゾン川","ミシシッピ川","セントローレンス川","コロラド川"],1,"二つの山脈の間には広大な中央平原が広がり、ミシシッピ川がメキシコ湾に向けて流れています。"],["世界最大の島であり、デンマーク領である北極海や大西洋に面した島はどこですか。",["マダガスカル島","キューバ島","グリーンランド","ニューファンドランド島"],2,"グリーンランドは世界最大の島で、デンマーク領であり、北極海や大西洋に面しています。"],["メキシコ湾やカリブ海沿岸の地域で、夏から秋にかけて強風や大雨などの大きな災害をもたらす熱帯低気圧は何ですか。",["サイクロン","台風","ハリケーン","シロッコ"],2,"メキシコ湾やカリブ海に面した地域では、熱帯低気圧のハリケーンがしばしば上陸し、大きな被害を引き起こします。"],["アメリカやカナダで最も広く使われている言語は何ですか。",["スペイン語","英語","フランス語","ポルトガル語"],1,"ヨーロッパ（主にイギリス）からの移民が開拓を進めた歴史的背景から、アメリカやカナダでは英語が最も広く話されています。"],["カナダのケベック州などで、英語とともに公用語として使われている言語は何ですか。",["スペイン語","ドイツ語","フランス語","イタリア語"],2,"カナダでは歴史的な背景から英語とフランス語が公用語となっており、ケベック州など一部の地域ではフランス語が使用されています。"],["近年、メキシコやカリブ海の島々などからアメリカへ移住してきた、主にスペイン語を話す人々を何と呼びますか。",["ネイティブアメリカン","ヒスパニック","アフリカ系","アジア系"],1,"メキシコやカリブ海沿岸から移住してきた、主にスペイン語を話す人々をヒスパニックと呼びます。"],["16世紀にヨーロッパからの移民がやってくる前に、北アメリカ大陸で自然環境に合わせて暮らしていた人々を何といいますか。",["インカ人","アボリジニ","先住民（ネイティブアメリカン）","マオリ"],2,"北アメリカはもともと先住民（ネイティブアメリカン）が住む土地であり、狩猟や農業をして生活していました。"],["広大な農地で大型農機具やかんがい設備を使い、少ない人数で大量の農作物を生産する農業の形態を何といいますか。",["自給的農業","企業的農業","焼畑農業","遊牧"],1,"アメリカやカナダでは、世界市場の変化に対応して大規模に農作物を生産する企業的農業が行われています。"],["各地域の地形や気候などの自然環境に適した農作物を栽培することを何といいますか。",["単一栽培","適地適作","有機農業","垂直農法"],1,"アメリカやカナダでは、地域ごとの降水量や気温などの自然条件に応じた適地適作が行われています。"],["アメリカの降水量が少ないロッキー山脈周辺の地域で行われている主な農牧業は何ですか。",["酪農","肉牛の放牧","綿花栽培","水稲栽培"],1,"降水量の少ないロッキー山脈の周辺地域は放牧地として利用されており、肉牛の放牧が行われています。"],["アメリカの農牧業において、西側の乾燥した放牧地域と東側の湿潤な耕作地域を分ける目印となる経線（年間降水量500mm線）はどれですか。",["西経80度","西経100度","東経135度","本初子午線"],1,"ほぼ西経100度（年間降水量500mm線）より西側は乾燥帯で放牧が行われ、東側は湿潤で小麦・とうもろこし・大豆などが栽培されています。"],["気候が冷涼で大都市に近いアメリカ北東部や五大湖周辺で盛んな農牧業は何ですか。",["酪農","地中海式農業","プランテーション","焼畑農業"],0,"冷涼で都市に近い北部や五大湖周辺の地域では、生乳や乳製品を生産する酪農が盛んに行われています。"],["放牧で育った肉牛を集め、栄養価の高い飼料を与えて短期間で太らせる肥育施設・方式を何といいますか。",["スプリンクラー","フィードロット","グリーンハウス","コンバイン"],1,"放牧された肉牛を集め、栄養価の高い飼料を与えて肉質を良くする飼育方法をフィードロット方式といいます。"],["農業機械や種子、農薬の開発から農産物の加工・流通までを一体となって行う巨大企業や関連ビジネスを何といいますか。",["アグリビジネス","バイオテクノロジー","モノカルチャー","サステナビリティ"],0,"農業用機械、種子、農薬、化学肥料の開発や農産物の流通などを総合的に手がける企業やビジネスをアグリビジネスと呼びます。"],["アグリビジネス企業のうち、世界規模で穀物の買収や売買、市場調査などを行う大企業を特に何と呼びますか。",["穀物メジャー","石油メジャー","総合商社","投資銀行"],0,"穀物を主に取り扱う大企業は穀物メジャーと呼ばれ、世界の農産物市場で大きな影響力を持っています。"],["アメリカの重工業（鉄鋼業など）が19世紀後半から発展した、鉄鉱石や石炭の産地に近く水運が利用できた地域はどこですか。",["フロリダ半島周辺","五大湖周辺","テキサス州周辺","カリフォルニア沿岸"],1,"五大湖周辺は鉄鉱石や石炭の産地に近く、水運や鉄道輸送の面で便利だったため重工業が大きく発展しました。"],["20世紀初頭に、ベルトコンベアによる流れ作業の大量生産方式を導入して自動車工業の中心地となった都市はどこですか。",["ニューヨーク","デトロイト","ヒューストン","シアトル"],1,"20世紀初頭、デトロイトで流れ作業による大量生産方式を取り入れた自動車工業が始まり、世界的に大きく発展しました。"],["第二次世界大戦後、アメリカで設立され、宇宙開発や航空・宇宙技術の研究を進めた政府機関は何ですか。",["NATO","NASA（アメリカ航空宇宙局）","UN","WHO"],1,"アメリカでは第二次世界大戦後にNASA（アメリカ航空宇宙局）が設立され、宇宙開発とともに情報通信技術などの進歩に貢献しました。"],["アメリカで北緯37度以南に位置し、温暖な気候と豊富な労働力を背景にハイテク産業が発展した地域を何といいますか。",["ルーストベルト","サンベルト","コーンベルト","コットンベルト"],1,"北緯37度より南のサンベルトと呼ばれる地域は、気候が温暖で土地が安く、豊富な労働力に恵まれてハイテク産業の中心地となりました。"],["サンフランシスコの南に位置し、ICT（情報通信技術）関連の企業や研究機関が集積している地域を何といいますか。",["マンハッタン","シリコンバレー","デトロイト","ハリウッド"],1,"サンフランシスコ南部のシリコンバレーにはICT関連の企業が多く集まり、世界的なハイテク産業の拠点となっています。"],["アメリカ・カナダ・メキシコ間の貿易協定により、メキシコで急速に発展した産業の動きとして正しいものはどれか。",["賃金の安いメキシコへ多くの工場が移転した","メキシコからアメリカへの製品輸出が禁止された","3か国間の貿易額が激減した","メキシコでの自動車生産が完全に廃止された"],0,"関税なしで貿易ができる国際組織・協定の影響により、賃金の安いメキシコへ工場が移転し、自動車工業やハイテク産業が盛んになりました。"],["高層ビルや倉庫の中でコンテナなどを利用し、水や光を管理して作物を栽培する新しい農業技術を何といいますか。",["焼畑農法","垂直農法","露地栽培","熱帯農業"],1,"垂直農法は、建物内で農地を重ねて少量の水や光を管理して育てる方法で、食料問題や環境負荷への対策として期待されています。"],["アメリカの映画産業の中心地であり、世界中で公開される多くの映画が制作されているカリフォルニア州の地域はどこですか。",["ブロードウェイ","ハリウッド","シリコンバレー","ブロンクス"],1,"アメリカ西部のハリウッドは映画産業の中心地であり、ここで制作された映画やキャラクターは世界中に広がっています。"],["国土が広く人口密度の低いアメリカやカナダで見られる、日常生活や移動に自動車が欠かせない社会構造を何といいますか。",["歩行者社会","自動車社会","自転車社会","鉄道社会"],1,"アメリカやカナダは無料の高速道路や広大な駐車場が整備されており、自動車がなければ生活が成り立たない自動車社会となっています。"],["缶やビンなどの容器付き製品の販売時に預かり金を徴収し、使用後に返却すると返金されるリサイクル制度を何といいますか。",["パークアンドライド","デポジット制度","カーシェアリング","カーボンオフセット"],1,"資源のリサイクルやゴミの削減を促進するため、製品購入時に預かり金を払い、返却時に返金を受けるデポジット制度が導入されています。"],["メキシコで広く親しまれている、トウモロコシをすりつぶして作った生地で肉や野菜を包んだ伝統的な料理は何ですか。",["クスクス","タコス","ウガリ","フーフー"],1,"トウモロコシを主原料とした生地に肉や野菜を包んだタコスは、メキシコの伝統的な料理です。"]],30));
SUBJ[2].d.push(...mk([["『竹取物語』で、竹取の翁（おきな）の本名として本文に記されている名前はどれですか。",["さぬきのみやつこ","石作の皇子","阿倍御主人","大伴大納言"],0,"竹取の翁の本名は本文に「名をば、さぬきのみやつことなむいいける」と記されています。"],["古文における「うつくし（うつくしうて）」の主な意味はどれですか。",["綺麗だ・美しい","かわいい・愛らしい","悲しい・切ない","不思議だ・あやしい"],1,"現代語の「美しい」とは異なり、古文での「うつくし」は主に「かわいい・愛らしい」という意味で用いられます。"],["かぐや姫が求婚者の一人である庫持の皇子（くらもちのみこ）に持参するよう求めた難題（宝物）は何ですか。",["仏の御石の鉢","火鼠の皮衣","蓬莱の玉の枝","竜の首にある五色に光る玉"],2,"庫持の皇子に課された難題は、根が銀・茎が金・実が真珠でできている「蓬莱（ほうらい）の玉の枝」でした。"],["石作の皇子（いしづくのみこ）が持参を命じられた宝物と、その失敗に関する記述として正しいものはどれですか。",["燕の持たる子安貝を狙って屋根から落ちた","「仏の御石の鉢」を天竺に探しに行くと偽り、山寺の鉢を持ってきたが見破られた","「火鼠の皮衣」を火にくべたら燃えてしまった","竜の怒りを恐れて途中で船を下りた"],1,"石作の皇子は「仏の御石の鉢」を天竺（インド）へ探しに行くと見せかけ、大和国の山寺から古い鉢を持ってきましたが、鉢が光らないため嘘が見破られました。"],["阿倍御主人（あべのみうし）が大金を払って手に入れた「火鼠の皮衣」はどうなりましたか。",["火にくべたところあっさりと燃えてしまった","本物であったため美しい光を放った","途中で盗賊に奪われてしまった","水に浸したところ破れてしまった"],0,"火をつけても決して燃えないと言われた「火鼠の皮衣」でしたが、実際に火にくべるとあっさり燃えてしまいました。"],["大伴大納言（おおとものだいなごん）が「竜の首にある五色に光る玉」を探しに行った際、どうなりましたか。",["無事に玉を手に入れて帰還した","船が激しい嵐に遭遇し、竜の怒りを買ったと恐れて断念した","途中で船が沈没して行方不明になった","竜と戦って退治した"],1,"自ら船を出した大伴大納言は激しい嵐に遭い、竜の怒りを買ったと恐れて断念しました。その際、目が真っ赤やすもものように腫れ上がりました。"],["中納言石上麻呂（ちゅうなごんいしのかみのまろ）が「燕の持たる子安貝」を取ろうとした際の結末として正しいものはどれですか。",["子安貝を手に入れたが偽物だった","籠に乗って屋根の上の巣を探ったが、つかんだのはつばめのふんであり転落して腰を打った","燕に攻撃されて逃げ帰った","子安貝を海に落としてしまった"],1,"巣の中に手を差し入れて何かをつかみ降りようとした瞬間、命綱が切れて転落し、手の中にあったのは「つばめのふん」でした。"],["かぐや姫が月を見ながら泣くようになり、自分が「月の都の人間」であることを打ち明けたのはいつですか。",["帝と出会った直後","帝の求婚から三年が過ぎた年の旧暦八月十五日（満月の夜）が近づいた頃","貴公子たちが難題を運んできた直後","翁が竹を取らなくなった頃"],1,"帝の求婚から三年が過ぎた年の秋、旧暦八月十五日が近づくにつれて月を見て泣くようになり、自らの正体を明かしました。"],["八月十五日の夜、かぐや姫を迎えに来た天人に対し、帝が遣わした二千人の兵士たちはどうなりましたか。",["天人と激しく戦って勝利した","心がぼんやりとして戦う意欲を失ってしまった","全員が逃げ出してしまった","矢を射かけて天人を追い払った"],1,"天人が降りてくると、館を守っていた兵士たちはぼんやりとして戦意を失い、かぐや姫が連れ去られるのを防ぐことができませんでした。"],["天人が持って来た「天の羽衣（あまのはごろも）」を着せられたかぐや姫に起きた変化は何ですか。",["地上で悲しんでいた気持ちや物思いが一瞬で消え去った","姿が透明になり消えてしまった","再び三寸の大きさに戻った","喋ることができなくなった"],0,"天の羽衣を着せられたかぐや姫は、地上の人々を思いやって深く悲しんでいた気持ちや物思いが一瞬で消えてしまいました。"],["古典の言葉「いと」の意味として正しいものはどれですか。",["すこし・わずかに","たいへん・とても・あまりに","決して・絶対に","いつか・近いうちに"],1,"古典の言葉「いと」は、「たいへん・とても・あまりに」という意味を表します。"],["古典の言葉「わろし」の意味として正しいものはどれですか。",["素晴らしい・見ごとだ","よくある・普通だ","よくない・見劣りがする","恐ろしい・気味が悪い"],2,"古典の言葉「わろし」は、「よくない・見劣りがする・感心しない」という意味を表します。"],["歴史的仮名遣いにおいて、語頭（単語の先頭）以外の「は・ひ・ふ・へ・ほ」は現代仮名遣いでは基本的にどの行の音に変わりますか。",["ア行（あ・い・う・え・お）","カ行（か・き・く・け・こ）","ワ行（わ・い・う・え・お）","マ行（ま・み・む・め・も）"],2,"語頭以外のハ行の音は、現代仮名遣いではワ行の音（わ・い・う・え・お）に変化します。"],["歴史的仮名遣い「けふ」を現代仮名遣いで正しく表記したものはどれですか。",["けふ","きょう","けう","きふ"],1,"歴史的仮名遣いの「けふ」は、現代仮名遣いでは「きょう」と表記します。"],["『いろは歌』の一節「有為の奥山（うゐのおくやま）」の「うゐ」を現代仮名遣いに直した表記はどれですか。",["うい","うえ","うを","うゆ"],0,"歴史的仮名遣いの「ゐ」は現代仮名遣いでは「い」となるため、「うゐのおくやま」は「ういのおくやま」となります。"],["『いろは歌』の一節「浅き夢みじ 酔ひもせず」の「酔ひ（ゑひ）」を現代仮名遣いで表記したものとして適切なものはどれですか。",["えひ（えい）","わい","よい","ゆい"],2,"「酔ひ（ゑひ）」は、現代仮名遣いでは「酔い（よい）」と書きます。「ゑ」を「え」に直しただけの「えい」ではない点に注意しましょう。"],["『源氏物語』の作者および成立した時代として正しい組み合わせはどれですか。",["清少納言 — 平安時代","紫式部 — 平安時代","兼好法師 — 鎌倉時代","松尾芭蕉 — 江戸時代"],1,"『源氏物語』は平安時代に紫式部によって執筆された長編物語です。"],["平家一族の栄華と滅亡を描いた、鎌倉時代成立の軍記物語は何ですか。",["竹取物語","伊勢物語","平家物語","方丈記"],2,"平家一族の栄枯盛衰を描いた『平家物語』は、鎌倉時代に成立した代表的な軍記物語です。"],["松尾芭蕉が約2400キロメートルにおよぶ旅の体験をもとに書き上げた、江戸時代の代表的な紀行文は何ですか。",["徒然草","おくのほそ道","枕草子","古今和歌集"],1,"江戸時代に松尾芭蕉が東北・北陸などを巡った旅を綴った紀行文が『おくのほそ道』です。"],["季節のしおり（秋）に登場する言葉「花野（はなの）」の意味として正しいものはどれですか。",["春に桜が満開になっている野原","ススキやハギなど、秋の草花が咲き乱れる野原","初夏に菖蒲が咲く湿地帯","冬に雪が花のように積もった野原"],1,"「花野」とは、ススキやハギなどの秋の草花が美しく咲いている野原のことを指します。"],["「山粧う（やまよそおう）」が表す季節と情景の組み合わせとして最も適切なものはどれですか。",["春 — 新緑が一斉に芽吹く様子","夏 — 青々とした木々が茂る様子","秋 — 紅葉によって山が鮮やかに色づく様子","冬 — 雪が山全体を白く覆う様子"],2,"「山粧う」は秋の表現で、紅葉によって山が化粧をしたかのように鮮やかに色づく情景を表します。"],["秋の言葉である「鳥渡る（とりわたる）」の説明として正しいものはどれですか。",["鳥が巣作りを行うために木から木へ飛び渡ること","秋になり、北方から海を渡って多くの渡り鳥がやって来ること","春になり、南の国へ鳥が帰っていくこと","夕暮れ時に鳥が巣へ戻ること"],1,"「鳥渡る」は、秋に入ると北方から多くの渡り鳥が海を渡って日本へやって来る様子を表す言葉です。"],["中国古代の思想家である孔子とその弟子たちの言葉をまとめた、中学1年で学習する作品は何ですか。",["漢文・漢詩（論語）","随筆（枕草子）","物語（伊勢物語）","紀行文（おくのほそ道）"],0,"『論語』は中国古代の孔子やその弟子の言行を記録した書物で、中学1年の「古典の世界」で漢文として学習します。"]],30));
SUBJ.push({k:"英語",n:"英語",e:"🔤",s:"現在進行形・感嘆文・道案内・不定詞・Unit 8",d:mk([["「私は今、テレビを見ています。」を英語にする際、( ) に入る最も適切なものはどれですか？\n「I ( ) TV now.」",["watch","am watching","watching","am watch"],1,"「今〜しています」という現在進行中の動作を表すには〈am / is / are + 動詞の-ing形〉を使います。主語が I なので am watching が正解です。「am watch」のように動詞の原形をそのまま並べることはできません。"],["動詞「run」を現在進行形（-ing形）にするときの正しいスペルはどれですか？",["runing","runnning","running","raning"],2,"run のように「短母音 + 子音字」で終わる動詞は、最後の文字（n）を重ねて -ing をつけます。したがって running が正解です。"],["動詞「make」を-ing形にするときの正しいスペルはどれですか？",["makeing","making","makking","maiking"],1,"e で終わる動詞（make, use, comeなど）は、末尾の e を取って -ing をつけます。makeing としないように注意しましょう。"],["次の文の ( ) に入れるのに最も適切なものはどれですか？\n「Look! Jun ( ) basketball in the gym now.」",["plays","playing","is playing","is play"],2,"「今〜しています」という文で、主語が Jun（三人称単数）のため be動詞は is になります。be動詞を忘れて Jun playing... としないよう注意が必要です。"],["「彼は毎日サッカーをします。」と「彼は今サッカーをしています。」の英訳の組み合わせとして正しいものはどれですか？",["He plays soccer every day. / He is playing soccer now.","He is playing soccer every day. / He plays soccer now.","He play soccer every day. / He is play soccer now.","He is plays soccer every day. / He playing soccer now."],0,"普段の習慣（every dayなど）には「現在形（plays）」を用い、現在の動作（now）には「現在進行形（is playing）」を用います。"],["「動詞 + -ing」の作り方として誤っているものはどれですか？",["play → playing","read → reading","use → useing","get → getting"],2,"use は e で終わる語なので、e を取って using にするのが正しい形です。"],["「あなたは湖のまわりを歩いていますか？」という質問に対する正しい答え（いいえ、歩いていません）はどれですか？\n「Are you walking around a lake? — ( ).」",["No, I don't.","No, I not.","No, I am not.","No, I'm don't."],2,"Are you ...ing? と be動詞で聞かれているため、答えるときも be動詞を用いて No, I am not.（または No, I'm not.）と答えます。No, I don't. と混同しないようにしましょう。"],["次の対話の ( ) に入る最も適切な疑問詞はどれですか？\n「A: ( ) are those people doing? — B: They are taking pictures.」",["Where","What","How","Who"],1,"「あの人たちは何をしていますか？」と動作の内容を尋ねているので What が入ります。"],["「純の家族は何をしていますか？」という問いに対し、「母は料理をしています」と答える英文として正しいものはどれですか？",["She is cooking.","She cooks.","She is cook.","She cooking."],0,"「〜しています」と現在の動作を答えるので現在進行形にします。She に対応する be動詞 is と cooking を組み合わせます。"],["「私たちは今サッカーをしていません。」を表す英文として正しいものはどれですか？",["We are not play soccer now.","We do not playing soccer now.","We are not playing soccer now.","We not playing soccer now."],2,"現在進行形の否定文は〈am / is / are + not + -ing〉の形にします。do not や are not play は誤りです。"],["「エディはお友達と一緒にいますか？」に対する正しい肯定の返答（はい、一緒にいます）はどれですか？\n「Is Eddy still with his friends? — ( ).」",["Yes, he does.","Yes, he is.","Yes, he with.","Yes, he has."],1,"Is で始まる be動詞の疑問文には Yes, he is. で答えます。"],["「なんて面白いんでしょう！」を表す感嘆文の空欄に入る語はどれですか？\n「( ) interesting!」",["What","How","So","Very"],1,"〈How + 形容詞/副詞!〉の形で感情の高ぶりを表します。後ろに名詞がない場合は How を使います。"],["「なんておかしな言い訳でしょう！」を表す感嘆文の空欄に入る語はどれですか？\n「What ( ) funny excuse!」",["a","an","the","（不要）"],0,"〈What + a/an + 形容詞 + 単数名詞!〉の形にします。funny は子音で始まるため a が入ります。"],["次の日本語に合う感嘆文として正しいものはどれですか？「なんてすてきな場所でしょう！」",["How a nice place!","What a nice place!","How nice place!","What nice place!"],1,"「a nice place」という名詞のまとまりが続いているため、What a nice place! が正しい感嘆文です。How の後ろに a や名詞を直接置くことはできません。"],["感嘆文（How / What）のルールの説明として最も適切なものはどれですか？",["Howの後ろには必ず名詞がくる。","Whatの後ろには形容詞だけがくる。","Howの後ろには形容詞や副詞、Whatの後ろには名詞を含む語句がくる。","HowとWhatはどちらを使っても文構造は変わらない。"],2,"〈How + 形容詞/副詞!〉および〈What + (a/an) + 形容詞 + 名詞!〉が教科書で学習する基本ルールです。"],["「私は市民病院を探しています。」と言うときの ( ) に入る前置詞はどれですか？\n「I'm looking ( ) City Hospital.」",["at","for","to","in"],1,"look for ... で「〜を探す」という意味になります。look at ... は「〜を見る」の意味なので区別しましょう。"],["「2つ目の信号を左に曲がってください。」の英訳として正しいものはどれですか？",["Turn left at the second traffic light.","Turn right at the two traffic light.","Go straight at the second traffic light.","Turn left on two traffic light."],0,"「〜を左に曲がる」は Turn left at ...、「2つ目の信号」は the second traffic light と表現します。"],["相手の発言が聞き取れず「もう一度言ってくださいますか？」と丁寧に聞き返す表現はどれですか？",["Pardon me?","What is it?","Excuse me, no.","Say again."],0,"語尾を上げて Pardon me? と言うことで、「もう一度おっしゃっていただけますか？」という意味になります。"],["「図書館へはどう行けばいいですか？」と尋ねる文の ( ) に入る語句の組み合わせはどれですか？\n「How ( ) I ( ) to the library?」",["do / go","can / get","am / walk","will / come"],1,"道案内で「〜へはどう行けばいいですか？」と尋ねる定番表現は How can I get to ...? です。"],["「彼女は困っている人々を助けたいと思っています。」の ( ) に入る語句はどれですか？\n「She wants ( ) ( ) people in need.」",["help to","to help","to helping","helping to"],1,"〈want + to + 動詞の原形〉で「〜したい」という意味を表します。to の後ろは必ず動詞の原形（help）になります。"],["「主語 + want(s) + to + 動詞」の文法（不定詞）に関する説明として正しいものはどれですか？",["toの直後の動詞は-ing形にする。","toの直後の動詞は過去形にする。","toの直後の動詞は原形（元の形）にする。","主語が三人称単数の場合、toの直後の動詞にもsをつける。"],2,"不定詞 to の直後に置く動詞は、主語に関わらず必ず「原形」にします（例: wants to help）。wants to helps や wants to helping は誤りです。"],["「あなたは何を食べたいですか？」という質問と、その答えの組み合わせとして文法的に正しいものはどれですか？",["What do you want to eat? / I want to eat chicken curry.","What do you want to eating? / I want to eating chicken curry.","What are you want to eat? / I want eating chicken curry.","What do you want eat? / I want eat chicken curry."],0,"疑問文は What do you want to eat? となり、答える際も I want to eat ... と 〈want to + 動詞の原形〉 を用います。"],["「私たちは食品ロスを減らす必要があります。」の空欄に入る語はどれですか？\n「We need to ( ) food waste.」",["visit","reduce","appear","talk"],1,"reduce は「〜を減らす」という意味の動詞です。need to reduce food waste で「食品ロスを減らす必要がある」となります。"],["「彼女はいつも最善を尽くそうとしています。」の ( ) に入る動詞はどれですか？\n「She always tries to ( ) her best.」",["make","take","do","have"],2,"「最善を尽くす」という熟語は do one's best です。主語が She の場合は do her best となります。"],["「私は彼女のようになりたいです。」の英訳として正しいものはどれですか？",["I want to become like her.","I want becoming like her.","I want to become as her.","I want become like her."],0,"「〜になりたい」は want to become ...、「〜のように」は前置詞 like を使って like her と表現します。"],["「〜を楽しみに待つ」という意味を表す連語（熟語）はどれですか？",["look for","look at","look forward to","look around"],2,"look forward to ... で「〜を楽しみに待つ」という意味になります。"],["「困っている人々」を表す英語表現として正しいものはどれですか？",["people in need","people of need","people for need","people at need"],0,"in need で「困っている、助けを必要としている」という意味の熟語になります。"],["「一方では〜」という意味を表す連語として正しいものはどれですか？",["on the other hand","in the other hand","at the other hand","to the other hand"],0,"on the other hand は「他方では、一方では」という意味で、対比を表す重要表現です。"],["教科書本文（Unit 8）において、夏休みにボランティアとしてケニアを訪れ子どもたちに勉強を教えている人物は誰ですか？",["Kate","Mina","Riko","Anna"],1,"純（Jun）のスピーチで紹介されている従姉妹のミナ（Mina）についての記述です。"],["教科書本文（Unit 8 Part 3）において、一部の村の子どもたちが学校に行けない主な理由として述べられているものはどれですか？",["遠くの川まで水をくみに行くのに時間がかかるから。","学校の建物が壊れているから。","電車やバスなどの交通手段がないから。","授業料が高くて払えないから。"],0,"本文には「川へ水をくみに行くのがとても遠く、毎日長い時間歩かなければならないため、学校に行きたくても時間がない」と書かれています。"]])});
let D=[];
const KEY="quizrec_v1";let REC={};try{REC=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(REC))}catch(e){}};
const rec=n=>REC[n]||(REC[n]={plays:0,best:null,q:{}});
let cur=null,mode="normal";
const weakOf=s=>s.d.filter(q=>rec(s.k).q[q.n]===1);

const $=id=>document.getElementById(id);
function pick(s){cur=s;D=s.d;const w=weakOf(s).length;$("weak").textContent=`💪 苦手克服モード（${w}問）`;$("weak").disabled=!w;$("weak").style.opacity=w?1:.5;$("st").textContent=s.e+" "+s.n+"クイズ";$("ss").textContent=s.s+`（全${s.d.length}問）`;range=0;buildRanges();show("start")}
function renderHome(){$("subj").innerHTML="";SUBJ.forEach(s=>{const r=rec(s.k),w=weakOf(s).length;
 const info=r.best?`ベスト ${Math.round(r.best.s/r.best.t*100)}%（${r.best.s}/${r.best.t}）・挑戦 ${r.plays}回`:"まだ挑戦していません";
 const b=document.createElement("button");b.className="btn sc";
 b.innerHTML=`<span class="em">${s.e}</span><span><strong>${s.n}</strong><br><small>${s.s}</small><br><small>${info}${w?"・苦手 "+w+"問":""}</small></span>`;
 b.onclick=()=>pick(s);$("subj").appendChild(b)})}
function twoStep(btn,warn,fn){const orig=btn.textContent;let tm=null;btn.onclick=()=>{if(tm){clearTimeout(tm);tm=null;btn.textContent=orig;fn()}else{btn.textContent=warn;tm=setTimeout(()=>{tm=null;btn.textContent=orig},3500)}}}
function goHome(){renderHome();show("home")}
twoStep($("reset"),"もう一度押すと全記録を消します",()=>{REC={};save();renderHome()});
$("back").onclick=goHome;
let RANGES=[];
let range=0,pool=[],i=0,score=0,wrong=[],locked=false;
const show=id=>["home","start","play","res"].forEach(s=>$(s).classList.toggle("hide",s!==id));
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function buildRanges(){const N=D.length;RANGES=[["全"+N+"問",0,N]];for(let a=0;a<N;a+=10)RANGES.push([`${a+1}〜${Math.min(a+10,N)}問`,a,Math.min(a+10,N)]);
 $("ranges").innerHTML="";RANGES.forEach((r,k)=>{const b=document.createElement("button");b.className="btn sel"+(k===0?" on":"");b.textContent=r[0];
 b.onclick=()=>{range=k;[...$("ranges").children].forEach((c,j)=>c.classList.toggle("on",j===k))};$("ranges").appendChild(b)})}

function start(list,m="normal"){mode=m;pool=$("shuf").checked?shuffle(list):list;i=0;score=0;wrong=[];show("play");render()}
function render(){
 const q=pool[i];locked=false;
 $("cnt").textContent=`${i+1} / ${pool.length}`;$("sc").textContent=`正解 ${score}`;
 $("pb").style.width=(i/pool.length*100)+"%";
 $("q").textContent=q.q;$("exp").classList.add("hide");$("next").classList.add("hide");
 $("opts").innerHTML="";
 q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="btn";
  b.innerHTML=`<b>${"ABCD"[k]}</b>`;b.append(t);b.onclick=()=>answer(k);$("opts").appendChild(b)});
}
function answer(k){
 if(locked)return;locked=true;
 const q=pool[i],bs=$("opts").children;
 [...bs].forEach(b=>b.disabled=true);
 bs[q.a].classList.add("ok");
 const right=k===q.a;
 if(right)score++;else{bs[k].classList.add("ng");wrong.push(q)}
 rec(cur.k).q[q.n]=right?0:1;save();
 $("sc").textContent=`正解 ${score}`;
 $("exp").innerHTML=`<strong>${right?"⭕ 正解！":"❌ 不正解（正解は "+"ABCD"[q.a]+"）"}</strong>${q.e}`;
 $("exp").classList.remove("hide");
 $("pb").style.width=((i+1)/pool.length*100)+"%";
 $("next").textContent=i+1<pool.length?"次の問題へ":"結果を見る";
 $("next").classList.remove("hide");
 $("next").scrollIntoView({behavior:"smooth",block:"nearest"});
}
$("next").onclick=()=>{i++;i<pool.length?render():finish()};
function finish(){
 show("res");const n=pool.length;
 $("rs").textContent=`${score} / ${n}`;
 const p=score/n;
 let msg=p===1?"🎉 パーフェクト！":p>=.8?"👏 すばらしい！":p>=.6?"👍 あと少し！":"💪 復習してもう一度！";
 $("rp").textContent=`正答率 ${Math.round(p*100)}%`;
 if(mode==="normal"&&n>=10){const r=rec(cur.k);r.plays++;if(!r.best||p>r.best.s/r.best.t){if(r.best)msg="🏆 ベスト更新！ "+msg;r.best={s:score,t:n}}save()}
 $("rm").textContent=msg;
 $("wrongBox").classList.toggle("hide",!wrong.length);$("retry").classList.toggle("hide",!wrong.length);
 $("wl").innerHTML="";wrong.forEach(q=>{const l=document.createElement("li");l.textContent=`Q${q.n} ${q.q}`;$("wl").appendChild(l)});
}
$("go").onclick=()=>start(D.slice(RANGES[range][1],RANGES[range][2]));
$("retry").onclick=()=>start(wrong,"retry");
$("weak").onclick=()=>{const w=weakOf(cur);if(w.length)start(w,"weak")};
$("again").onclick=goHome;
twoStep($("quit"),"もう一度押すと中断します",goHome);
renderHome();
</script></body></html>
