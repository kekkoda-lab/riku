<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英検3級 ライティング練習</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF7EF;--ink:#24344D;--soft:#566178;--rule:#C3D7E8;--red:#C8433C;--gold:#C9A227;--ok:#4C7A5D;--line:#E7E0CE;--gray:#9AA2AF}
@media (prefers-color-scheme:dark){:root{--paper:#1B2230;--ink:#EDE9DD;--soft:#A9B2C3;--rule:#33405A;--line:#3A4660}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 'Zen Maru Gothic',sans-serif}
.app{max-width:780px;margin:0 auto;padding:24px 16px 50px}
.page{background:repeating-linear-gradient(to bottom,transparent 0 39px,var(--rule) 39px 40px) 0 100px;border:1px solid var(--line);border-radius:14px;padding:30px 28px 30px 46px;position:relative}
.page:before{content:"";position:absolute;left:26px;top:0;bottom:0;width:2px;background:var(--red);opacity:.5}
h1{font:600 28px 'Klee One',cursive;margin:0 0 4px}
.sub{color:var(--soft);font-size:14px;margin:0 0 12px}
button{font:inherit;cursor:pointer}
.tabs,.pills,.chips,.acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs,.pills{margin:10px 0}
.tab{padding:9px 16px;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700;color:#566178}
.tab.on{border-color:#24344D;color:#fff;background:#24344D}
.pill{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:700;position:relative;color:#566178}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
.pill.done:after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--ok)}
.card{background:#fff;color:#24344D;border:2px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.en{font-size:22px;font-weight:700;margin:0}
.jp{color:#566178;font-size:14px;margin:2px 0 0}
.chips{margin:8px 0}
.chip{border:1.5px solid var(--gold);background:#FFFBEA;color:#24344D;border-radius:999px;padding:5px 12px;font-size:14px}
label{display:block;font-weight:700;font-size:14px;color:var(--soft);margin:10px 0 4px}
.row{display:flex;align-items:center;gap:8px}
.pre{font-weight:700;white-space:nowrap}
input,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:#24344D}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.fill{height:100%;width:0;background:var(--gold)}
.cnt{font-weight:700;margin:12px 0 0}
.good{color:var(--ok)}.bad{color:var(--red)}
ul.chk{list-style:none;padding:0;margin:8px 0;font-size:15px}
.chk li:before{content:"○ ";color:var(--gray)}
.chk li.y{color:var(--ok)}
.chk li.y:before{content:"✓ ";font-weight:700}
.btn{padding:11px 18px;border-radius:10px;border:none;background:#24344D;color:#fff;font-weight:700}
.btn.r{background:var(--red)}
.btn.g{background:transparent;color:var(--soft);border:2px solid var(--line)}
.acts{margin:14px 0}
.model{background:#F1F7F3;color:#24344D;border:2px solid var(--ok);border-radius:12px;padding:14px 18px}
.model p{margin:4px 0}
.note{font-size:13px;color:var(--soft);margin:4px 0}
.back{display:inline-block;margin:0 0 10px;padding:8px 14px;border:2px solid var(--line);border-radius:10px;color:var(--soft);font-weight:700;font-size:14px;text-decoration:none}
.back:hover{border-color:var(--ink);color:var(--ink)}
</style>
</head>
<body>
<div class="app"><div class="page" id="page"></div></div>
<script>
const Q=[
{en:"Do you like to cook?",jp:"あなたは料理をするのが好きですか？",hint:"楽しい？ 家族が喜ぶ？",m:"Yes, I do. I like cooking very much. First, it is fun for me to make new dishes. Second, my family is happy when they eat my food."},
{en:"Which do you like better, summer or winter?",jp:"夏と冬、どちらが好きですか？",hint:"海で泳げる？ 雪で遊べる？",m:"I like summer better. First, I can swim in the sea. It is very fun. Second, I can eat ice cream every day. I like cold sweets very much."},
{en:"Do you want to live in a big city in the future?",jp:"あなたは将来、大都市に住みたいですか？",hint:"便利？ 静かなほうがいい？",m:"No, I don't. I want to live in a small town. First, it is quiet there. Second, I can enjoy nature and spend time with my family."},
{en:"Do you think it is good to read books every day?",jp:"毎日本を読むのはよいことだと思いますか？",hint:"学べる？ 落ち着く？",m:"I think it is good to read books every day. First, I can learn many things from books. Second, reading is a good way to relax after school."},
{en:"Do you want to have a pet?",jp:"あなたはペットを飼いたいですか？",hint:"かわいい？ 散歩で運動できる？",m:"Yes, I do. I want to have a dog. First, dogs are very cute. Second, I can go for a walk with my dog every day and get some exercise."},
{en:"Which do you like better, studying at home or at the library?",jp:"家と図書館、どちらで勉強するほうが好きですか？",hint:"静か？ 本がたくさんある？",m:"I like studying at the library better. First, it is quiet there, so I can focus. Second, I can find many books and learn about many things."},
{en:"Do you think students should help with housework?",jp:"生徒は家の手伝いをするべきだと思いますか？",hint:"家族を助けられる？ 料理を学べる？",m:"Yes, I do. I think students should help with housework. First, it is a good way to help our family. Second, we can learn how to cook and clean."},
{en:"Do you like to take pictures?",jp:"あなたは写真を撮るのが好きですか？",hint:"楽しい？ 思い出になる？",m:"Yes, I do. I like taking pictures of flowers. First, it is fun for me to find beautiful things. Second, I can look at my pictures and remember good days."},
{en:"Do you want to visit a foreign country in the future?",jp:"あなたは将来、外国を訪れたいですか？",hint:"文化を学べる？ 英語を話せる？",m:"Yes, I do. I want to visit Canada. First, I can learn about a different culture. Second, I can speak English with many people and make new friends."},
{en:"What is your favorite season?",jp:"あなたの好きな季節は何ですか？",hint:"天気がいい？ 食べ物がおいしい？",m:"My favorite season is autumn. First, the weather is nice, so I can go out. Second, I like eating sweet potatoes and apples in autumn very much."}
];
const CH=["it is fun for me","I like ... very much","I can learn many things","I can learn about ...","it is useful for me","it is easy for me to ...","I can spend time with my friends","I can spend time with my family"];
const KEY='eiken3_writing_v1';
let S={mode:'template',q:0,model:false,f:'r1'};
let D=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fix=s=>/[.!?]$/.test(s)?s:s+'.';
const words=s=>(s.match(/[A-Za-z0-9][A-Za-z0-9'’-]*/g)||[]).length;
function text(i,mode){
  const d=D[i]||{};
  if(mode==='free')return (d.free||'').trim();
  const p=[],a=(d.t||'').trim(),b=(d.r1||'').trim(),c=(d.r2||'').trim();
  if(a)p.push(fix(a));
  if(b)p.push('First, '+fix(b));
  if(c)p.push('Second, '+fix(c));
  return p.join(' ');
}
function render(){
  const q=Q[S.q],d=D[S.q]||{};
  const pills=Q.map((_,i)=>`<button class="pill${i===S.q?' on':''}${text(i,'template')||text(i,'free')?' done':''}" data-i="${i}">${i+1}</button>`).join('');
  const chips=CH.map(c=>`<button class="chip" data-c="${c}">${c}</button>`).join('');
  const inputs=S.mode==='template'?`
    <label>① 意見（I think ~ / I like ~ / Yes, I do. など）</label>
    <input id="t" value="${esc(d.t)}" placeholder="I think ...">
    <label>② 理由1</label><div class="row"><span class="pre">First,</span><input id="r1" value="${esc(d.r1)}" placeholder="it is fun for me."></div>
    <label>③ 理由2</label><div class="row"><span class="pre">Second,</span><input id="r2" value="${esc(d.r2)}" placeholder="I can ..."></div>
    <p class="note">黄色いカードをタップすると、選んでいる理由の欄に入ります（「...」は自分の言葉に直そう）。</p>
    <div class="chips">${chips}</div>`
  :`<label>あなたの答え（意見 + 理由2つ）</label>
    <textarea id="free" placeholder="I think ... First, ... Second, ...">${esc(d.free)}</textarea>
    <p class="note">型: I think ~. / First, ~. / Second, ~.</p>`;
  $('#page').innerHTML=`<a class="back" href="/riku/new01">カテゴリー選択に戻る</a>
  <h1>英検3級 ライティング練習</h1>
  <p class="sub">意見＋理由2つを、25〜35語で書こう</p>
  <div class="tabs"><button class="tab${S.mode==='template'?' on':''}" data-m="template">型つき（穴うめ）</button><button class="tab${S.mode==='free'?' on':''}" data-m="free">自由に書く</button></div>
  <div class="pills">${pills}</div>
  <div class="card"><p class="note">QUESTION ${S.q+1} / ${Q.length}</p><p class="en">${q.en}</p><p class="jp">${q.jp}（理由のヒント: ${q.hint}）</p></div>
  ${inputs}
  <div id="st"></div>
  <div class="acts"><button class="btn r" id="show">${S.model?'模範解答をかくす':'模範解答を見る'}</button><button class="btn" id="copy">添削用にコピー</button><button class="btn g" id="clr">消す</button></div>
  <p class="note" id="msg"></p>
  ${S.model?`<div class="model"><b>模範解答の例（${words(q.m)}語）</b><p>${q.m}</p></div>`:''}
  <div class="acts"><button class="btn g" id="prev">← 前の問題</button><button class="btn g" id="next">次の問題 →</button></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;S.model=false;render()});
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{S.q=+b.dataset.i;S.model=false;render()});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const el=$('#'+S.f);if(!el)return;el.value=(el.value?el.value.trim()+' ':'')+b.dataset.c;el.dispatchEvent(new Event('input'));el.focus()});
  ['t','r1','r2','free'].forEach(id=>{const el=$('#'+id);if(!el)return;
    el.onfocus=()=>{if(id==='r1'||id==='r2')S.f=id};
    el.oninput=()=>{(D[S.q]=D[S.q]||{})[id]=el.value;save();status();mark()}});
  $('#show').onclick=()=>{S.model=!S.model;render()};
  $('#clr').onclick=()=>{if(confirm('この問題の答えを消しますか？')){delete D[S.q];save();render()}};
  $('#prev').onclick=()=>{S.q=(S.q+Q.length-1)%Q.length;S.model=false;render()};
  $('#next').onclick=()=>{S.q=(S.q+1)%Q.length;S.model=false;render()};
  $('#copy').onclick=()=>{
    const t=text(S.q,S.mode);
    if(!t){$('#msg').textContent='まだ英文がありません。';return}
    const m='英検3級ライティングの添削をお願いします。\nQUESTION: '+Q[S.q].en+'\nMy answer: '+t;
    const ng=()=>{$('#msg').textContent='コピーできませんでした。英文を選んでコピーしてください。'};
    if(navigator.clipboard)navigator.clipboard.writeText(m).then(()=>{$('#msg').textContent='コピーしました。Claudeのチャットに貼り付けてください。'},ng);else ng();
  };
  status();
}
function mark(){document.querySelectorAll('.pill')[S.q].classList.toggle('done',!!(text(S.q,'template')||text(S.q,'free')))}
function status(){
  const t=text(S.q,S.mode),n=words(t),has=!!t;
  const s=t.split(/[.!?]+/).filter(x=>/[A-Za-z]/.test(x)).length;
  const ck=[
    [n>=25&&n<=35,'語数が25〜35語'],
    [s>=3,'3文以上で書いている'],
    [/\bFirst\b/i.test(t)&&/\bSecond\b/i.test(t),'First と Second で理由を2つ書いた'],
    [has&&!/\.\.\.|…/.test(t),'「...」が残っていない'],
    [/^[A-Z]/.test(t)&&/[.!?]$/.test(t),'大文字で始まり、ピリオドで終わっている']
  ];
  const msg=!has?'目標 25〜35語':n<25?'あと '+(25-n)+' 語':n>35?(n-35)+' 語オーバー':'ちょうどいい！';
  const cls=n>35?'bad':n>=25?'good':'';
  const col=n>35?'#C8433C':n>=25?'#4C7A5D':'#C9A227';
  $('#st').innerHTML=`<p class="cnt">${n} 語 <span class="${cls}">（${msg}）</span></p>
  <div class="bar"><div class="fill" style="width:${Math.min(n/35,1)*100}%;background:${col}"></div></div>
  <ul class="chk">${ck.map(c=>`<li class="${c[0]?'y':''}">${c[1]}</li>`).join('')}</ul>`;
}
render();
</script>
</body>
</html>
